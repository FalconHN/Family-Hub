const { useState, useEffect, useRef } = React;

// Firestore is used directly below for shared, real-time sync (isti obrazac kao shopping-list.html:
// jedan zajednicki dokument, polje sa nizom snimljeno kao JSON string).
const db = firebase.firestore();
const sharedDocRef = db.collection('recepti').doc('shared');

const DEFAULT_CATEGORIES = ["Doručak", "Ručak", "Večera", "Dezert", "Užina"];

// Cloudinary - besplatan servis za čuvanje slika koje korisnici otpremaju sa telefona/računara
// (bez kartice/naplate, sam po sebi CDN-uje i optimizuje slike). "Unsigned" upload preset znači
// da se otpremanje radi direktno iz browsera bez tajnog ključa.
const CLOUDINARY_CLOUD_NAME = "family-hub";
const CLOUDINARY_UPLOAD_PRESET = "recepti";

async function uploadImageToCloudinary(file) {
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/image/upload", {
    method: "POST",
    body: formData,
  });
  if (!res.ok) throw new Error("Cloudinary upload failed with status " + res.status);
  const data = await res.json();
  if (!data.secure_url) throw new Error("Cloudinary upload response missing secure_url");
  return data.secure_url;
}

// "Skeniraj recept": šalje fotografiju Cloudflare Worker-u (koji drži Gemini ključ)
// i dobija nazad strukturisan recept. VAŽNO: zamijeni URL ispod svojim Worker URL-om
// nakon što ga deployuješ (vidi recept-ocr-worker.js).
const RECIPE_OCR_WORKER_URL = "https://recept-ocr.ivanmitrovic82usa-503.workers.dev";

// Smanjuje sliku (radi brzine i limita) i vraća base64 (bez "data:" prefiksa).
function fileToDownscaledBase64(file, maxDim, kvalitet) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", typeof kvalitet === "number" ? kvalitet : 0.85);
        resolve({ base64: dataUrl.split(",")[1], mimeType: "image/jpeg" });
      };
      img.onerror = () => reject(new Error("Ne mogu da učitam sliku."));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Ne mogu da pročitam fajl."));
    reader.readAsDataURL(file);
  });
}

// Greške na koje ima smisla ČEKATI pa pokušati ponovo (privremena zauzetost AI servisa), za
// razliku od onih kod kojih ponavljanje ništa ne mijenja (npr. slika je nečitka, ključ nije
// podešen, dnevni limit je potrošen).
function vrijediPonoviti(status, poruka) {
  if (status === 503 || status === 429 || status === 502 || status === 504) return true;
  return /preopterećen|preoptereen|zauzet|high demand|overloaded|unavailable|try again/i.test(poruka || "");
}

async function scanRecipeFromImage(file) {
  if (!RECIPE_OCR_WORKER_URL || RECIPE_OCR_WORKER_URL.indexOf("REPLACE-WITH") !== -1) {
    throw new Error("Skener još nije podešen (Worker URL nije unešen u recepti.html).");
  }
  // 2000px umjesto 1600 i kvalitet 0.9 umjesto 0.85 - sitan tekst sa fotografije recepta (a
  // pogotovo rukopis) se osjetno bolje prepoznaje, a slika je i dalje daleko ispod dozvoljene
  // veličine koju Worker prima.
  const { base64, mimeType } = await fileToDownscaledBase64(file, 2000, 0.9);
  let res;
  try {
    res = await fetch(RECIPE_OCR_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: base64, mimeType }),
    });
  } catch (e) {
    // Mreža je pukla - vrijedi pokušati ponovo.
    const greska = new Error("Nema veze sa internetom.");
    greska.ponoviti = true;
    throw greska;
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const poruka = (data && data.error) || ("Greška servera (" + res.status + ").");
    const greska = new Error(poruka);
    // Worker javlja i sam da li se isplati ponoviti; ako ne javi, procjenjujemo po statusu/tekstu.
    greska.ponoviti = (data && typeof data.ponoviti === "boolean") ? data.ponoviti : vrijediPonoviti(res.status, poruka);
    throw greska;
  }
  return data || {};
}

// ---- Besplatna rezerva za čitanje teksta sa slike (bez AI), kad Gemini ne uspije ----
// Tesseract.js radi direktno u browseru (samo prvi put preuzme "jezički paket", pa radi bez
// interneta/troška poslije toga) - "vidi" slova, ali za razliku od AI ne razumije SADRŽAJ (ne zna
// šta je naziv, sastojak, ili korak pripreme). Zato solidno radi za OTKUCAN/štampan tekst (npr.
// screenshot recepta sa sajta), a znatno slabije za rukom pisan tekst. AI (Gemini) ostaje prvi
// izbor kad je dostupan - ovo je samo rezerva za kad Google javi da je privremeno preopterećen.
const TESSERACT_CDN_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
let tesseractLoadPromise = null;
function loadTesseractScript() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = TESSERACT_CDN_URL;
    s.onload = () => resolve();
    s.onerror = () => { tesseractLoadPromise = null; reject(new Error("Ne mogu da učitam lokalni čitač teksta.")); };
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}
async function localOcrFromImage(file) {
  await loadTesseractScript();
  const { data } = await window.Tesseract.recognize(file, "srp_latn+eng");
  return (data && data.text) || "";
}

function uid() {
  return Date.now().toString() + Math.random().toString(36).slice(2, 8);
}

// Propušta samo http(s) linkove. Sprječava npr. "javascript:..." u polju slike/videa
// da se iskoristi kao klik-XSS. Prazno polje ostaje prazno.
function safeUrl(u) {
  const s = (u || "").trim();
  if (!s) return "";
  return /^https?:\/\//i.test(s) ? s : "";
}

// ---- Cijena recepta ----
// Sastojak je sad objekat { naziv, kolicina, jedinica } umjesto obične riječi teksta (radi
// nazad-kompatibilnosti stari recepti imaju sastojke kao obične stringove - normalizeSastojak
// ih pretvara u isti oblik, samo bez količine/jedinice, pa se ništa staro ne pokvari).
// Cijena se računa preko posebnog "Cjenovnika" (lista cijena po jedinici mjere za namirnice koje
// se ponavljaju kroz recepte) - kad sastojak ima unesenu količinu+jedinicu I postoji u cjenovniku
// pod istim nazivom, cijena se sama izračuna; u suprotnom se taj sastojak jednostavno ne uračunava
// (a korisniku se pokazuje da cijena nije potpuna).
const JEDINICE = ["g", "kg", "ml", "l", "kom"];
const UNIT_BASE = {
  g: { base: "masa", factor: 1 },
  kg: { base: "masa", factor: 1000 },
  ml: { base: "zapremina", factor: 1 },
  l: { base: "zapremina", factor: 1000 },
  kom: { base: "komad", factor: 1 },
};

function normalizeSastojak(s) {
  if (typeof s === "string") return { naziv: s, kolicina: "", jedinica: "" };
  if (s && typeof s === "object") {
    return {
      naziv: s.naziv || "",
      kolicina: s.kolicina === undefined || s.kolicina === null ? "" : s.kolicina,
      jedinica: s.jedinica || "",
    };
  }
  return { naziv: "", kolicina: "", jedinica: "" };
}
function normalizeSastojci(arr) {
  return Array.isArray(arr) ? arr.map(normalizeSastojak) : [];
}

function fmtEUR(n) {
  const v = Number.isFinite(n) ? n : 0;
  return v.toFixed(2).replace(".", ",") + " €";
}

// Prepoznaje razne oblike riječi za jedinice mjere u slobodnom tekstu (npr. "grama", "kilograma",
// ali i balkanske mjere "dag"/deka i "dl" koje se svode na g/ml uz množilac - npr. "20 dag" = 200g).
// Kašika/kašičica su standardne metričke mjere (1 kašika = 15 ml, 1 kašičica = 5 ml) - za tečnosti
// (ulje, mlijeko...) se svode na ml, jer im je zapremina fiksna. Za par čestih suvih namirnica
// (KASIKA_GRAMI ispod) se posebno svode na grame, jer za njih ml ne odgovara stvarnoj težini.
const JEDINICA_ALIASES = {
  g: { jedinica: "g", mnozilac: 1 }, gr: { jedinica: "g", mnozilac: 1 }, gram: { jedinica: "g", mnozilac: 1 }, grama: { jedinica: "g", mnozilac: 1 }, grami: { jedinica: "g", mnozilac: 1 },
  dag: { jedinica: "g", mnozilac: 10 }, deka: { jedinica: "g", mnozilac: 10 }, dekagram: { jedinica: "g", mnozilac: 10 }, dekagrama: { jedinica: "g", mnozilac: 10 },
  kg: { jedinica: "kg", mnozilac: 1 }, kilogram: { jedinica: "kg", mnozilac: 1 }, kilograma: { jedinica: "kg", mnozilac: 1 },
  ml: { jedinica: "ml", mnozilac: 1 }, mililitar: { jedinica: "ml", mnozilac: 1 }, mililitra: { jedinica: "ml", mnozilac: 1 }, mililitara: { jedinica: "ml", mnozilac: 1 },
  dl: { jedinica: "ml", mnozilac: 100 }, decilitar: { jedinica: "ml", mnozilac: 100 }, decilitra: { jedinica: "ml", mnozilac: 100 }, decilitara: { jedinica: "ml", mnozilac: 100 },
  l: { jedinica: "l", mnozilac: 1 }, lit: { jedinica: "l", mnozilac: 1 }, litar: { jedinica: "l", mnozilac: 1 }, litra: { jedinica: "l", mnozilac: 1 }, litre: { jedinica: "l", mnozilac: 1 }, litara: { jedinica: "l", mnozilac: 1 },
  kom: { jedinica: "kom", mnozilac: 1 }, komad: { jedinica: "kom", mnozilac: 1 }, komada: { jedinica: "kom", mnozilac: 1 },
  kašika: { jedinica: "ml", mnozilac: 15, vrsta: "kasika" }, kašike: { jedinica: "ml", mnozilac: 15, vrsta: "kasika" }, kašiku: { jedinica: "ml", mnozilac: 15, vrsta: "kasika" }, kašikom: { jedinica: "ml", mnozilac: 15, vrsta: "kasika" },
  kasika: { jedinica: "ml", mnozilac: 15, vrsta: "kasika" }, kasike: { jedinica: "ml", mnozilac: 15, vrsta: "kasika" }, kasiku: { jedinica: "ml", mnozilac: 15, vrsta: "kasika" }, kasikom: { jedinica: "ml", mnozilac: 15, vrsta: "kasika" },
  kašičica: { jedinica: "ml", mnozilac: 5, vrsta: "kasicica" }, kašičice: { jedinica: "ml", mnozilac: 5, vrsta: "kasicica" }, kašičicu: { jedinica: "ml", mnozilac: 5, vrsta: "kasicica" }, kašičicom: { jedinica: "ml", mnozilac: 5, vrsta: "kasicica" },
  kasicica: { jedinica: "ml", mnozilac: 5, vrsta: "kasicica" }, kasicice: { jedinica: "ml", mnozilac: 5, vrsta: "kasicica" }, kasicicu: { jedinica: "ml", mnozilac: 5, vrsta: "kasicica" }, kasicicom: { jedinica: "ml", mnozilac: 5, vrsta: "kasicica" },
  // Šolja = standardna kuvarska mjera (1 šolja = 250 ml), čaša = uobičajena balkanska mjera (2 dl).
  // Kao i kod kašike, za tečnosti se svode na ml, a za suve namirnice na grame (vidi KASIKA_GRAMI).
  // "Šoljica" NIJE ovdje namjerno - ona nema standardnu zapreminu (kafena šoljica ~50ml, čajna
  // ~200ml), pa bi svako nagađanje davalo pogrešnu cijenu; za nju upiši količinu u ml ručno.
  šolja: { jedinica: "ml", mnozilac: 250, vrsta: "solja" }, šolje: { jedinica: "ml", mnozilac: 250, vrsta: "solja" }, šolju: { jedinica: "ml", mnozilac: 250, vrsta: "solja" }, šoljom: { jedinica: "ml", mnozilac: 250, vrsta: "solja" }, šolji: { jedinica: "ml", mnozilac: 250, vrsta: "solja" },
  solja: { jedinica: "ml", mnozilac: 250, vrsta: "solja" }, solje: { jedinica: "ml", mnozilac: 250, vrsta: "solja" }, solju: { jedinica: "ml", mnozilac: 250, vrsta: "solja" }, soljom: { jedinica: "ml", mnozilac: 250, vrsta: "solja" }, solji: { jedinica: "ml", mnozilac: 250, vrsta: "solja" },
  čaša: { jedinica: "ml", mnozilac: 200, vrsta: "casa" }, čaše: { jedinica: "ml", mnozilac: 200, vrsta: "casa" }, čašu: { jedinica: "ml", mnozilac: 200, vrsta: "casa" }, čašom: { jedinica: "ml", mnozilac: 200, vrsta: "casa" }, čaši: { jedinica: "ml", mnozilac: 200, vrsta: "casa" },
  casa: { jedinica: "ml", mnozilac: 200, vrsta: "casa" }, case: { jedinica: "ml", mnozilac: 200, vrsta: "casa" }, casu: { jedinica: "ml", mnozilac: 200, vrsta: "casa" }, casom: { jedinica: "ml", mnozilac: 200, vrsta: "casa" }, casi: { jedinica: "ml", mnozilac: 200, vrsta: "casa" },
};
function mapirajJedinicu(rawWord) {
  // Skida tačke prije provjere (npr. "kg." -> "kg", "gr." -> "gr") - dozvoljava i skraćenice sa
  // tačkama iz teksta sastojka (vidi napomenu uz regex u parsirajSastojakTekst ispod).
  return JEDINICA_ALIASES[(rawWord || "").toLowerCase().replace(/\./g, "")] || null;
}
function parsirajBroj(txt) {
  const n = parseFloat((txt || "").replace(",", "."));
  return isFinite(n) ? n : null;
}

// Čisti tekst iz polja za unos broja (Količina/Cijena) dok korisnik kuca - prihvata i zarez i tačku
// kao decimalni znak (na balkanskim tastaturama zarez je uobičajen), i dozvoljava samo cifre i JEDAN
// decimalni znak (zamijenjen tačkom, da bude spreman za Number()/parsirajBroj kasnije). Ova polja su
// "type=text" (ne "type=number") baš zato što HTML "number" polje na mnogim telefonima/browserima
// odbija zarez kao decimalni znak, pa se broj poslije zareza jednostavno izgubi i ne sačuva.
function normalizujBroj(v) {
  let x = (v || "").replace(",", ".").replace(/[^0-9.]/g, "");
  const prvaTacka = x.indexOf(".");
  if (prvaTacka !== -1) {
    x = x.slice(0, prvaTacka + 1) + x.slice(prvaTacka + 1).replace(/\./g, "");
  }
  return x;
}

// Vrijednosti su usklađene sa standardnim kuvarskim tablicama (npr. 1 kašika brašna = 8 g,
// kristalnog šećera = 12,5 g, meda = 21 g, 1 kašičica praška za pecivo = 4,5 g) i međusobno su
// dosljedne - iz težine kašike izvedena je gustina namirnice, pa iz nje težina kašičice, šolje i
// čaše, da ista namirnica ne bi davala različit rezultat zavisno od toga kojom je mjerom upisana.
// Približna težina RAVNE kašike/kašičice za par čestih suvih namirnica - gustina zavisi od
// namirnice (šećer, brašno, so... sve različito teže), pa se za njih kašika/kašičica posebno
// svodi na grame umjesto na zapreminu (ml) kao za tečnosti. Brojevi su po standardnoj kuvarskoj
// tablici mjera. Ovo je procjena za RAVNU kašiku; ako se u receptu misli na punu/nabreklu kašiku,
// stvarna težina može biti i skoro duplo veća.
const KASIKA_GRAMI = [
  { naziv: "šećer", kasika: 12.5, kasicica: 4.2, solja: 208, casa: 167 },
  { naziv: "šećer u prahu", kasika: 7.5, kasicica: 2.5, solja: 125, casa: 100 },
  { naziv: "brašno", kasika: 8, kasicica: 2.7, solja: 133, casa: 107 },
  { naziv: "griz", kasika: 12, kasicica: 4, solja: 200, casa: 160 },
  { naziv: "skrob", kasika: 7.5, kasicica: 2.5, solja: 125, casa: 100 },
  { naziv: "gustin", kasika: 7.5, kasicica: 2.5, solja: 125, casa: 100 },
  { naziv: "so", kasika: 16.5, kasicica: 5.5, solja: 275, casa: 220 },
  { naziv: "kakao", kasika: 5.5, kasicica: 1.8, solja: 92, casa: 73 },
  { naziv: "kafa", kasika: 5.5, kasicica: 1.8, solja: 92, casa: 73 },
  { naziv: "mlevena kafa", kasika: 5.5, kasicica: 1.8, solja: 92, casa: 73 },
  { naziv: "puter", kasika: 14, kasicica: 4.6, solja: 228, casa: 182 },
  { naziv: "med", kasika: 21, kasicica: 7, solja: 350, casa: 280 },
  { naziv: "pirinač", kasika: 12.5, kasicica: 4.2, solja: 208, casa: 167 },
  { naziv: "prašak", kasika: 13.5, kasicica: 4.5, solja: 225, casa: 180 },
  // Puni naziv stoji kao poseban unos jer se poređenje naziva namjerno drži strogim (kratak naziv
  // ne smije da hvata bilo koji duži koji tako počinje), pa "prašak" sam po sebi ne pokriva
  // "praška za pecivo" - a taj puni oblik je ono što se najčešće i piše u receptu.
  { naziv: "prašak za pecivo", kasika: 13.5, kasicica: 4.5, solja: 225, casa: 180 },
  { naziv: "želatin", kasika: 9, kasicica: 3, solja: 150, casa: 120 },
];
function nadjiKasikaGrame(naziv) {
  const y = (naziv || "").trim().toLowerCase();
  if (!y) return null;
  const kandidati = KASIKA_GRAMI.filter((k) => nazivOdgovara(k.naziv, y));
  if (!kandidati.length) return null;
  // Ako se poklopi više unosa, uzmi onaj NAJBLIŽI upisanom tekstu (najmanje Levenshtein rastojanje),
  // a ne prosto najduži naziv. Npr. "šećera" se zbog istog početka poklopi i sa "šećer" i sa
  // "šećer u prahu"; pravilo "najduži" bi tu pogrešno izabralo šećer u prahu (7,5 g po kašici)
  // umjesto kristalnog šećera (12,5 g). Kod izjednačenog rastojanja i dalje pobjeđuje duži naziv.
  const rastojanje = (k) => levenshteinRastojanje(skiniKvacice(k.naziv.toLowerCase()), skiniKvacice(y));
  return kandidati.reduce((best, k) => {
    const dK = rastojanje(k);
    const dB = rastojanje(best);
    if (dK !== dB) return dK < dB ? k : best;
    return k.naziv.length > best.naziv.length ? k : best;
  });
}

// Iz broja (npr. "2") i prepoznate jedinice (uInfo iz mapirajJedinicu) odredi konačnu
// količinu+jedinicu - posebno računa kašiku/kašičicu suvih namirnica u grame (vidi KASIKA_GRAMI),
// za sve ostalo samo primjenjuje množilac (npr. dag/dl/kg...).
function primijeniJedinicu(broj, uInfo, ostatakNaziva) {
  if (uInfo.vrsta && ostatakNaziva) {
    const suvo = nadjiKasikaGrame(ostatakNaziva);
    // Traži grame baš za tu vrstu mjere (kasika/kasicica/solja/casa) - ako za neku vrstu nema
    // upisane vrijednosti, pada nazad na obično računanje po zapremini (ml) ispod.
    if (suvo && suvo[uInfo.vrsta]) {
      return { kolicina: broj * suvo[uInfo.vrsta], jedinica: "g" };
    }
  }
  return { kolicina: broj * uInfo.mnozilac, jedinica: uInfo.jedinica };
}

// Pokušava da iz slobodnog teksta sastojka (npr. "500g brašna" ili "brašno 500g") SAM izvuče
// količinu, jedinicu mjere i preostali naziv namirnice - da korisnik NE MORA ručno da dijeli
// stare sastojke u posebna polja, nego samo unese Cjenovnik i cijena se sama nađe. Prepoznaje i
// oblik "3 jaja" (broj bez prave mjere - tretira se kao komad). Ako ne uspije da nađe broj na
// početku ili kraju teksta, vraća null (taj sastojak jednostavno ostaje bez automatske cijene,
// ništa se ne pokvari - korisnik i dalje može ručno unijeti Količinu/Jedinicu u formi ako želi).
function parsirajSastojakTekst(text) {
  const s = (text || "").trim();
  if (!s) return null;

  // Oblik "500g brašna" / "500 g brašna" / "3 jaja" / "2 kašike šećera" / "1/2 praška za pecivo"
  // (razlomak poslije cijelog broja je opcion - "1/2" se svede na 0.5 prije daljeg računanja).
  // Riječ poslije broja dozvoljava i tačku poslije svakog slova (npr. "p.z.p." ili "kg.") - inače bi
  // se čitanje prekinulo na prvoj tački i naziv bi ispao pogrešno podijeljen (npr. "p" + ".z.p.").
  let m = s.match(/^([0-9]+(?:[.,][0-9]+)?)(?:\s*\/\s*([0-9]+(?:[.,][0-9]+)?))?\s*((?:[a-zA-ZčćžšđČĆŽŠĐ]\.?)*)\s*(.*)$/);
  if (m && m[1]) {
    let broj = parsirajBroj(m[1]);
    if (broj !== null && m[2]) {
      const imenilac = parsirajBroj(m[2]);
      if (imenilac) broj = broj / imenilac;
    }
    if (broj && broj > 0) {
      let ostatak = (m[4] || "").trim();
      const uInfo = mapirajJedinicu(m[3]);
      let jedinica, kolicina;
      if (!uInfo) {
        if (m[3]) ostatak = (m[3] + " " + ostatak).trim();
        jedinica = "kom";
        kolicina = broj;
      } else {
        const rez = primijeniJedinicu(broj, uInfo, ostatak);
        jedinica = rez.jedinica;
        kolicina = rez.kolicina;
      }
      if (ostatak) return { kolicina: kolicina, jedinica: jedinica, naziv: ostatak };
    }
  }

  // Oblik "brašno 500g" / "brašno 500 g"
  m = s.match(/^(.*?)\s+([0-9]+(?:[.,][0-9]+)?)\s*((?:[a-zA-ZčćžšđČĆŽŠĐ]\.?)*)$/);
  if (m && m[2]) {
    const broj = parsirajBroj(m[2]);
    if (broj && broj > 0) {
      const ostatak = (m[1] || "").trim();
      const uInfo = mapirajJedinicu(m[3]);
      const rez = uInfo ? primijeniJedinicu(broj, uInfo, ostatak) : { kolicina: broj, jedinica: "kom" };
      if (ostatak) return { kolicina: rez.kolicina, jedinica: rez.jedinica, naziv: ostatak };
    }
  }

  return null;
}

// Da li su dva naziva "ista" namirnica - dozvoljava malu razliku na kraju riječi zbog padeža u
// srpskom/bosanskom/crnogorskom jeziku (npr. "brašno" iz Cjenovnika treba da prepozna "brašna" iz
// recepta). Zahtijeva da se bar prva 3 slova poklapaju I da se poklapa skoro cijela riječ (do 2
// slova razlike na kraju) - da ne bi slučajno spojio dvije različite namirnice.
// Skida naša slova sa kvačicama (š,č,ć,ž,đ) na obična latinična slova, da bi se npr. "brasno"
// (unešeno u Cjenovniku bez kvačica, česta pojava na telefonu bez podešene srpske/bosanske
// tastature) poklopilo sa "brašno" iz teksta recepta. Bez ovoga poređenje ispod broji "š" i "s"
// kao potpuno različita slova, pa se poklapanje lomi tačno na mjestu razlike.
function skiniKvacice(s) {
  return (s || "")
    .replace(/[šŠ]/g, "s")
    .replace(/[čćČĆ]/g, "c")
    .replace(/[žŽ]/g, "z")
    .replace(/[đĐ]/g, "dj");
}

// Uobičajene skraćenice iz recepata - prije poređenja naziva, skraćenica se zamijeni punim
// nazivom namirnice, da bi se prepoznala i cijena našla automatski bez obzira da li je
// skraćenica upisana u Cjenovniku, u receptu, ili u oba (npr. "p.z.p.", "pzp", "p z p" ->
// "prašak za pecivo"). Radi i kad je skraćenica dio duže fraze (npr. "kesica p.z.p."), a ne
// hvata je slučajno usred neke druge riječi (mora biti okružena razmakom/početkom/krajem/znakom).
const SKRACENICE = [{ obrazac: /(^|[^a-z])p\.?\s*z\.?\s*p\.?(?=$|[^a-z])/g, puno: "prasak za pecivo" }];
function prosiriSkracenice(s) {
  let rez = s || "";
  SKRACENICE.forEach(({ obrazac, puno }) => {
    rez = rez.replace(obrazac, (cijeli, pre) => pre + puno);
  });
  return rez;
}

// Skida riječ za PAKOVANJE sa početka naziva ("1 kesica vanil šećera" -> "vanil šećera"), jer ona
// govori u čemu je namirnica, a ne KOJA je namirnica - bez ovoga se "kesica vanil šećera" ne bi
// poklopilo sa "Vanilin šećer" iz Cjenovnika. Broj je već ranije odvojen (parsirajSastojakTekst),
// pa "1 kesica" ostaje kao količina 1, što je i tačno značenje. Skida se samo sa POČETKA i samo
// ako iza nje ostane još teksta - da sama riječ "kesica" (ako je neko tako nazove) ne nestane.
const PAKOVANJA = /^(?:kesic[aeu]|kesic[ei]ca|kes[aeu]|kese|vrecic[aeu]|vrecice|paket(?:a|i|ic|ica)?|pakovanj[ae]|kutij[aeu]|kutije|konzerv[aeu]|konzerve|flasic[aeu]|flas[aeu]|teglic[aeu]|tegl[aeu])\s+(?:od\s+)?(?=\S)/;
function skiniPakovanje(s) {
  const rez = (s || "").replace(PAKOVANJA, "");
  return rez.trim() ? rez.trim() : (s || "");
}

// Izbacuje NAPOMENE koje nisu dio imena namirnice, prije poređenja sa Cjenovnikom:
//  - tekst u zagradama: "p.z.p. (dodati u brašno)" -> "p.z.p."
//    (bez ovoga se "(dodati u brašno)" poklopi sa "Brašno" iz Cjenovnika, pa prašak za pecivo
//    dobije POGREŠNU cijenu - cijenu cijelog kilograma brašna)
//  - alternativu iza "ili": "vanil šećer ili aroma vanilije" -> "vanil šećer"
//    (računa se prva navedena, tj. ona koju je korisnik stavio kao osnovnu)
// Prikaz sastojka u receptu ostaje netaknut - ovo se koristi samo za traženje cijene.
function skiniNapomene(s) {
  let rez = (s || "").replace(/\([^)]*\)/g, " ");
  rez = rez.replace(/\s+ili\s+[\s\S]*$/, "");
  rez = rez.replace(/\s{2,}/g, " ").trim();
  return rez || (s || "");
}

// Levenshtein rastojanje - najmanji broj izmjena (dodaj/obriši/zamijeni jedno slovo) potrebnih da
// se riječ "a" pretvori u riječ "b". Koristi se kao rezervni pokušaj poklapanja naziva ispod.
function levenshteinRastojanje(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev = new Array(n + 1);
  let curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cijena = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cijena);
    }
    const tmp = prev; prev = curr; curr = tmp;
  }
  return prev[n];
}

function nazivPodudaranje(a, b) {
  const xSirovo = skiniPakovanje(skiniNapomene(skiniKvacice((a || "").trim().toLowerCase())));
  const ySirovo = skiniPakovanje(skiniNapomene(skiniKvacice((b || "").trim().toLowerCase())));
  const x = prosiriSkracenice(xSirovo);
  const y = prosiriSkracenice(ySirovo);
  if (!x || !y) return false;
  if (x === y) return true;
  // "Sadržana fraza" provjera (npr. "prasak za pecivo" unutar "kesica prasak za pecivo") se radi
  // SAMO kad je bar jedna strana stvarno nastala razvijanjem skraćenice (x/y se razlikuje od
  // sirovog teksta) - inače bi npr. "Šećer" lažno pokupio "Vanilin šećer" (obična riječ je skoro
  // uvijek "sadržana" u nekom dužem, srodnom ali RAZLIČITOM nazivu, pa opšte pravilo nije sigurno).
  const xPromijenjen = x !== xSirovo;
  const yPromijenjen = y !== ySirovo;
  if (xPromijenjen || yPromijenjen) {
    const kraci = x.length <= y.length ? x : y;
    const duzi = x.length <= y.length ? y : x;
    if (kraci.length >= 4) {
      const escapiran = kraci.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if (new RegExp("(^|[^a-z])" + escapiran + "($|[^a-z])").test(duzi)) return true;
    }
  }
  let common = 0;
  const maxCommon = Math.min(x.length, y.length);
  while (common < maxCommon && x[common] === y[common]) common++;
  // Zajednički početak mora da pokrije skoro cijelu DUŽU riječ (najviše 2 slova razlike), a ne
  // samo kraću. Ranije se gledala kraća riječ, pa je kratak naziv iz Cjenovnika hvatao bilo šta
  // što tako počinje: "Sir" je poklapao "sirup" i "sirće", "Papar" je poklapao "paprike", "Riba"
  // je poklapala "ribizle", "Mak" je poklapao "makarone" - i sastojak bi tiho dobio cijenu
  // POTPUNO druge namirnice.
  if (common >= 3 && common >= Math.max(x.length, y.length) - 2) return true;
  // Zajednički početak ne hvata promjene USRED riječi, npr. "prašak" (nominativ) -> "praška"
  // (genitiv, "pola praška") - slovo "a" se u srpskom/bosanskom jeziku kod ovakvih riječi pomjera
  // ili nestaje ("nepostojano a": prašak/praška, sastanak/sastanka, momak/momka...), pa se prekid
  // dogodi odmah na mjestu promjene i gornje pravilo ne prepozna da je u pitanju ista riječ. Prag
  // za Levenshtein rastojanje raste sa dužinom riječi, da kraće riječi ne bi lako lažno poklopile
  // nepovezane riječi slične dužine.
  // Levenshtein se koristi SAMO za duže riječi (bar 6 slova). Kod kratkih je jedno slovo razlike
  // sasvim druga namirnica ("riba"/"riža", "sok"/"sir"), pa bi tolerancija tu pravila štetu; a
  // ono zbog čega je Levenshtein i uveden - "nepostojano a" (prašak/praška, pirinač/pirinča) -
  // ionako se javlja samo kod dužih riječi.
  if (maxCommon < 6) return false;
  const prag = maxCommon <= 8 ? 2 : 3;
  return levenshteinRastojanje(x, y) <= prag;
}

// Isto kao nazivPodudaranje, uz dodatnu proveru za kratke osnovne nazive (npr. "So" iz Cjenovnika,
// 2 slova) kod kojih se padež samo dodaje na kraj (npr. "soli") - nazivPodudaranje sam po sebi to
// ne hvata jer je riječ prekratka za pravilo "bar 3 zajednička slova".
// Dodatak na kraju NIJE bilo koja slova, nego mora biti stvarni padežni nastavak iz spiska ispod.
// Bez toga bi "So" hvatalo "sok"/"soka", a "Sir" bi hvatalo "sirup" - dovoljno je jedno slovo
// viška da to bude sasvim druga namirnica, a cijena bi se tiho preuzela sa pogrešnog unosa.
// ("li"/"lju" su u spisku zbog nepravilne promjene riječi "so": so - soli - solju.)
const PADEZNI_NASTAVCI = /^(a|e|i|u|o|om|em|im|ju|li|lju|ovi|evi|ima|ama)$/;
function nazivOdgovara(bazniNaziv, sastojakNaziv) {
  const x = skiniPakovanje(skiniNapomene(skiniKvacice((bazniNaziv || "").trim().toLowerCase())));
  const y = skiniPakovanje(skiniNapomene(skiniKvacice((sastojakNaziv || "").trim().toLowerCase())));
  if (!x || !y) return false;
  if (y === x) return true;
  if (x.length <= 3 && y.indexOf(x) === 0 && PADEZNI_NASTAVCI.test(y.slice(x.length))) return true;
  return nazivPodudaranje(x, y);
}

// Nađi unos iz Cjenovnika koji odgovara nazivu sastojka. Ako ih odgovara više, uzima se NAJBLIŽI
// (najmanje Levenshtein rastojanje), a ne prvi po redu - isto pravilo kao u nadjiKasikaGrame.
// Ranije se uzimao prvi, a Cjenovnik je poređan po abecedi, pa je opštiji naziv uvijek bio ispred
// svoje posebne vrste i zasjenio je: "Šećer" je hvatao "šećer u prahu", "Ulje" je hvatalo "ulje
// maslinovo", "Čokolada" je hvatala "čokolada u prahu" - sastojak bi dobio cijenu jeftinije,
// obične varijante iako je u Cjenovniku postojao tačan unos.
function findCijenaEntry(naziv, cjenovnik) {
  const key = (naziv || "").trim();
  if (!key) return null;
  const kandidati = (cjenovnik || []).filter((c) => nazivOdgovara(c.naziv, key));
  if (!kandidati.length) return null;
  if (kandidati.length === 1) return kandidati[0];
  const cilj = skiniPakovanje(skiniNapomene(skiniKvacice(key.trim().toLowerCase())));
  const rastojanje = (c) => levenshteinRastojanje(skiniPakovanje(skiniNapomene(skiniKvacice(String(c.naziv || "").trim().toLowerCase()))), cilj);
  return kandidati.reduce((best, c) => {
    const dC = rastojanje(c);
    const dB = rastojanje(best);
    if (dC !== dB) return dC < dB ? c : best;
    return String(c.naziv || "").length > String(best.naziv || "").length ? c : best;
  });
}

// Efektivna količina/jedinica/naziv za računanje cijene: ako je korisnik u formi ručno unio
// Količinu i Jedinicu, to ima prednost (najpouzdanije). Ako nije, pokuša se automatsko čitanje
// iz teksta naziva sastojka (parsirajSastojakTekst) - ovo pokriva stare/slobodno-unesene sastojke
// bez ikakve dodatne izmjene recepta.
function efektivnaKolicinaJedinica(sastojak) {
  if (sastojak.kolicina && sastojak.jedinica) {
    return { kolicina: Number(sastojak.kolicina), jedinica: sastojak.jedinica, naziv: sastojak.naziv };
  }
  return parsirajSastojakTekst(sastojak.naziv);
}

// Cijena jednog sastojka (u €) na osnovu (ručno unesene ili automatski pročitane) količine i
// jedinice i cjenovnika, ili null ako se količina ne može odrediti, sastojak nije u cjenovniku,
// ili su jedinice nespojive (npr. grami naspram litara).
function sastojakCijena(sastojak, cjenovnik) {
  const eff = efektivnaKolicinaJedinica(sastojak);
  if (!eff || !eff.kolicina || !isFinite(eff.kolicina) || eff.kolicina <= 0 || !eff.jedinica) return null;
  const entry = findCijenaEntry(eff.naziv, cjenovnik);
  if (!entry || !entry.jedinica || !isFinite(Number(entry.cijena)) || Number(entry.cijena) < 0) return null;
  // entry.kolicina = koliko je namirnice bilo u pakovanju za koje je unesena entry.cijena
  // (npr. "10 jaja = 2,20€" -> entryKolicina=10, entry.cijena=2.20). Ako polje ne postoji (stariji
  // unosi iz prve verzije cjenovnika, gdje je cijena već bila po jedinici), tretira se kao 1.
  const entryKolicina = entry.kolicina === undefined || entry.kolicina === null || entry.kolicina === "" ? 1 : Number(entry.kolicina);
  if (!isFinite(entryKolicina) || entryKolicina <= 0) return null;
  const sUnit = UNIT_BASE[eff.jedinica];
  const eUnit = UNIT_BASE[entry.jedinica];
  if (!sUnit || !eUnit) return null;
  if (sUnit.base !== eUnit.base) {
    // Sastojak nema pravu mjeru (npr. "1 prašak za pecivo" ili "1/2 praška za pecivo" - samo broj
    // komada, bez grama/ml/kg jer u tekstu nije prepoznata nijedna jedinica), a ta namirnica je u
    // Cjenovniku unesena po težini/zapremini (npr. "12 g = 0,30 €" za cijelo pakovanje). Tada se
    // "1 komad" tumači kao "1 CIJELO pakovanje iz Cjenovnika" (po cijeni entry.cijena), a "0,5
    // komada" kao pola pakovanja - to je jedino razumno značenje kad korisnik napiše samo naziv bez
    // stvarne količine. Ako obje strane imaju "prave" ali nespojive mjere (npr. grami naspram
    // litara), i dalje se ništa ne računa (ostaje null) - tu nema sigurnog nagađanja.
    if (sUnit.base === "komad") return eff.kolicina * Number(entry.cijena);
    return null;
  }
  const kolicinaUBaznoj = eff.kolicina * sUnit.factor;
  const entryKolicinaUBaznoj = entryKolicina * eUnit.factor;
  const cijenaPoBaznoj = Number(entry.cijena) / entryKolicinaUBaznoj;
  return kolicinaUBaznoj * cijenaPoBaznoj;
}

// Ukupna (približna) cijena recepta - sabira cijene svih sastojaka koji se mogu izračunati.
// Vraća null ako se nijedan sastojak ne može izračunati (nema smisla prikazivati "0,00 €").
function receptCijena(recipe, cjenovnik) {
  const sastojci = recipe.sastojci || [];
  let ukupno = 0;
  let poznato = 0;
  let nepoznato = 0;
  sastojci.forEach((s) => {
    if (!s || !s.naziv) return;
    const c = sastojakCijena(s, cjenovnik);
    if (c === null) { nepoznato++; return; }
    ukupno += c;
    poznato++;
  });
  if (poznato === 0) return null;
  return { ukupno, poznato, nepoznato };
}

// Slika recepta sa sigurnim fallback-om: ako nema URL-a ili se slika ne učita
// (npr. slomljen link), prikazuje ikonicu kuvarske kape umjesto praznog sivog kvadrata.
function RecipeImage({ url, alt, iconSize }) {
  const [broken, setBroken] = useState(false);
  useEffect(() => { setBroken(false); }, [url]); // reset kad se recept izmijeni
  if (!url || broken) return chefHatIcon(iconSize);
  return (
    <img
      src={url}
      alt={alt || ""}
      style={{ width: "100%", height: "100%", objectFit: "cover" }}
      onError={() => setBroken(true)}
    />
  );
}

function emptyRecipeForm() {
  return {
    id: null,
    naziv: "",
    kategorija: "",
    slikaUrl: "",
    videoUrl: "",

const CATEGORY_COLORS = [
  { bg: "#DCEFE3", text: "#1F7A52" },
  { bg: "#E3ECF5", text: "#2F6690" },
  { bg: "#F3E8D9", text: "#B8895E" },
  { bg: "#EEE3F0", text: "#8E6C9E" },
  { bg: "#F5E1DC", text: "#C97B63" },
  { bg: "#E6F1F2", text: "#007991" },
];
function colorForCategory(name) {
  if (!name) return { bg: "#EAE6DC", text: "#8A8578" };
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return CATEGORY_COLORS[Math.abs(hash) % CATEGORY_COLORS.length];
}

function CategoryTag({ label }) {
  if (!label) return null;
  const c = colorForCategory(label);
  return (
    <span style={{ background: c.bg, color: c.text, fontSize: 12, fontWeight: 700, padding: "3px 10px", borderRadius: 999, whiteSpace: "nowrap" }}>
      {label}
    </span>
  );
}

// Prilagođena (custom) padajuća lista - zamjena za ugrađeni <datalist>, koji na iPhone/Safari-ju
// ne prikazuje ponuđene opcije (kucanje inače radi normalno). Isti obrazac kao u ostalim
// aplikacijama (raspored.html, shopping-list.html).
function AutocompleteInput({ value, onChange, options, placeholder, style, onKeyDown, onBlur, autoFocus }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", handleOutside);
    document.addEventListener("touchstart", handleOutside);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      document.removeEventListener("touchstart", handleOutside);
    };
  }, []);

  const q = (value || "").trim().toLowerCase();
  const filtered = q === "" ? options : options.filter((o) => o.toLowerCase().includes(q));

  return (
    <div
      ref={wrapRef}
      style={{
        position: "relative",
        width: style && style.width ? undefined : "100%",
        flex: style && style.flex ? style.flex : undefined,
      }}
    >
      <input
        autoFocus={autoFocus}
        autoComplete="off"
        value={value}
        placeholder={placeholder}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onClick={() => setOpen(true)}
        onKeyDown={(e) => {
          if (e.key === "Escape") setOpen(false);
          if (onKeyDown) onKeyDown(e);
        }}
        onBlur={(e) => { setOpen(false); if (onBlur) onBlur(e); }}
        style={{ width: "100%", boxSizing: "border-box", ...style }}
      />
      {open && filtered.length > 0 && (
        <div style={{ position: "absolute", top: "100%", left: 0, right: 0, zIndex: 30, background: "#fff", border: "1px solid #E6E1D8", borderRadius: 8, marginTop: 3, maxHeight: 190, overflowY: "auto", boxShadow: "0 8px 20px -8px rgba(27,58,74,0.3)" }}>
          {filtered.map((o) => (
            <div
              key={o}
              onMouseDown={(e) => { e.preventDefault(); onChange(o); setOpen(false); }}
              style={{ padding: "8px 10px", fontSize: 13.5, color: "#0F222B", cursor: "pointer" }}
              onMouseEnter={(e) => { e.currentTarget.style.background = "#FAF8F4"; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; }}
            >
              {o}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
