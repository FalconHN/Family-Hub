<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAK9h4XR4ozUsOvkqaVNOnn9PS5XOBizAg",
    authDomain: "family-hub-m.firebaseapp.com",
    projectId: "family-hub-m",

    messagingSenderId: "267839729754",
    appId: "1:267839729754:web:04625e020a8dcd2e0e6863"
  };
  firebase.initializeApp(firebaseConfig);
  // Auth guard: bounce to login page if not signed in.
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    // Djeca imaju pristup samo Rasporedu - ako se nadju ovdje, preusmjeri ih tamo (isto kao
    // shopping-list.html - Recepti su za sada samo za roditelje).
    firebase.firestore().collection('users').doc(user.uid).get().then((snap) => {
      const role = (snap.exists && snap.data().role) || 'parent';
      if (role === 'child') {
        window.location.href = "raspored.html";
        return;
      }
      if (typeof window.fhApplyRole === 'function') window.fhApplyRole(role);
    }).catch(() => { /* ako upit ne uspije, ne blokiramo postojeci pristup */ });
  });

const { useState, useEffect, useRef } = React;

// Firestore is used directly below for shared, real-time sync (isti obrazac kao shopping-list.html:

const db = firebase.firestore();

const DEFAULT_CATEGORIES = ["Doručak", "Ručak", "Večera", "Dezert", "Užina"];

// Cloudinary - besplatan servis za čuvanje slika koje korisnici otpremaju sa telefona/računara
// (bez kartice/naplate, sam po sebi CDN-uje i optimizuje slike). "Unsigned" upload preset znači
// da se otpremanje radi direktno iz browsera bez tajnog ključa.
const CLOUDINARY_CLOUD_NAME = "family-hub";
const CLOUDINARY_UPLOAD_PRESET = "recepti";

async function uploadImageToCloudinary(file) {
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/image/upload", {
    method: "POST",
    body: formData,
  });
  if (!res.ok) throw new Error("Cloudinary upload failed with status " + res.status);
  const data = await res.json();
  if (!data.secure_url) throw new Error("Cloudinary upload response missing secure_url");
  return data.secure_url;
}

// "Skeniraj recept": šalje fotografiju Cloudflare Worker-u (koji drži Gemini ključ)
// i dobija nazad strukturisan recept. VAŽNO: zamijeni URL ispod svojim Worker URL-om
// nakon što ga deployuješ (vidi recept-ocr-worker.js).
const RECIPE_OCR_WORKER_URL = "https://recept-ocr.ivanmitrovic82usa-503.workers.dev";

// Smanjuje sliku (radi brzine i limita) i vraća base64 (bez "data:" prefiksa).
function fileToDownscaledBase64(file, maxDim) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        resolve({ base64: dataUrl.split(",")[1], mimeType: "image/jpeg" });
      };
      img.onerror = () => reject(new Error("Ne mogu da učitam sliku."));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Ne mogu da pročitam fajl."));
    reader.readAsDataURL(file);
  });
}

async function scanRecipeFromImage(file) {
  if (!RECIPE_OCR_WORKER_URL || RECIPE_OCR_WORKER_URL.indexOf("REPLACE-WITH") !== -1) {
    throw new Error("Skener još nije podešen (Worker URL nije unešen u recepti.html).");
  }
  const { base64, mimeType } = await fileToDownscaledBase64(file, 1600);
  const res = await fetch(RECIPE_OCR_WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image: base64, mimeType }),
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    throw new Error((data && data.error) || ("Greška servera (" + res.status + ")."));
  }
  return data || {};
}

function uid() {
  return Date.now().toString() + Math.random().toString(36).slice(2, 8);
}

// Propušta samo http(s) linkove. Sprječava npr. "javascript:..." u polju slike/videa
// da se iskoristi kao klik-XSS. Prazno polje ostaje prazno.
function safeUrl(u) {
  const s = (u || "").trim();
  if (!s) return "";
  return /^https?:\/\//i.test(s) ? s : "";
}

// Slika recepta sa sigurnim fallback-om: ako nema URL-a ili se slika ne učita
// (npr. slomljen link), prikazuje ikonicu kuvarske kape umjesto praznog sivog kvadrata.
function RecipeImage({ url, alt, iconSize }) {
  const [broken, setBroken] = useState(false);
  useEffect(() => { setBroken(false); }, [url]); // reset kad se recept izmijeni
  if (!url || broken) return chefHatIcon(iconSize);
  return (
    <img
      src={url}
      alt={alt || ""}
      style={{ width: "100%", height: "100%", objectFit: "cover" }}
      onError={() => setBroken(true)}
    />
  );
}

const CATEGORY_COLORS = [
  { bg: "#DCEFE3", text: "#1F7A52" },
  { bg: "#E3ECF5", text: "#2F6690" },
  { bg: "#F3E8D9", text: "#B8895E" },
  { bg: "#EEE3F0", text: "#8E6C9E" },
  { bg: "#F5E1DC", text: "#C97B63" },
  { bg: "#E6F1F2", text: "#007991" },
];
function colorForCategory(name) {
  if (!name) return { bg: "#EAE6DC", text: "#8A8578" };
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return CATEGORY_COLORS[Math.abs(hash) % CATEGORY_COLORS.length];
}

function CategoryTag({ label }) {
  if (!label) return null;
  const c = colorForCategory(label);
  return (
    <span style={{ background: c.bg, color: c.text, fontSize: 12, fontWeight: 700, padding: "3px 10px", borderRadius: 999, whiteSpace: "nowrap" }}>

}

// Prilagođena (custom) padajuća lista - zamjena za ugrađeni <datalist>, koji na iPhone/Safari-ju
// ne prikazuje ponuđene opcije (kucanje inače radi normalno). Isti obrazac kao u ostalim
// aplikacijama (raspored.html, shopping-list.html).
function AutocompleteInput({ value, onChange, options, placeholder, style, onKeyDown, onBlur, autoFocus }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", handleOutside);
    document.addEventListener("touchstart", handleOutside);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      document.removeEventListener("touchstart", handleOutside);
    };
  }, []);

  const q = (value || "").trim().toLowerCase();
  const filtered = q === "" ? options : options.filter((o) => o.toLowerCase().includes(q));

  return (
    <div
      ref={wrapRef}
      style={{
        position: "relative",
        width: style && style.width ? undefined : "100%",
        flex: style && style.flex ? style.flex : undefined,
      }}
    >
      <input
        autoFocus={autoFocus}
        autoComplete="off"
        value={value}
        placeholder={placeholder}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onClick={() => setOpen(true)}
        onKeyDown={(e) => {
          if (e.key === "Escape") setOpen(false);
          if (onKeyDown) onKeyDown(e);
        }}
        onBlur={(e) => { setOpen(false); if (onBlur) onBlur(e); }}
        style={{ width: "100%", boxSizing: "border-box", ...style }}
      />
      {open && filtered.length > 0 && (
        <div style={{ position: "absolute", top: "100%", left: 0, right: 0, zIndex: 30, background: "#fff", border: "1px solid #E6E1D8", borderRadius: 8, marginTop: 3, maxHeight: 190, overflowY: "auto", boxShadow: "0 8px 20px -8px rgba(27,58,74,0.3)" }}>
          {filtered.map((o) => (
            <div
              key={o}
              onMouseDown={(e) => { e.preventDefault(); onChange(o); setOpen(false); }}
              style={{ padding: "8px 10px", fontSize: 13.5, color: "#0F222B", cursor: "pointer" }}
              onMouseEnter={(e) => { e.currentTarget.style.background = "#FAF8F4"; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; }}
            >
              {o}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

                }}
              >

}

function RecipeApp() {
  const [recipes, setRecipes] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [search, setSearch] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("Sve");
  const [detailId, setDetailId] = useState(null);
  const [form, setForm] = useState(null); // null = no form open, object = editing/adding
  const [toast, setToast] = useState(null); // null ili { msg, type: "success" | "error" }
  const [addingToCart, setAddingToCart] = useState(false);

  const lastSentRecipes = useRef(null);
  const saveTimer = useRef(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    const unsub = sharedDocRef.onSnapshot(
      (snap) => {
        if (snap.exists) {
          const data = snap.data() || {};
          if (typeof data.recepti === "string" && data.recepti !== lastSentRecipes.current) {
            try {
              const parsed = JSON.parse(data.recepti);
              if (Array.isArray(parsed)) {
                setRecipes(parsed.map((r, i) => ({ sastojci: [], priprema: "", kategorija: "", slikaUrl: "", videoUrl: "", omiljen: false, order: i, ...r })));
              }
            } catch (e) {}
          }
        } else {
          sharedDocRef.set({ recepti: JSON.stringify([]) });
        }
        setLoaded(true);
      },
      (err) => {
        console.error("Firestore sync error", err);
        showToast("Greška pri učitavanju recepata (" + (err && err.code ? err.code : "provjeri internet") + ").", "error");
        setLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const json = JSON.stringify(recipes);
      lastSentRecipes.current = json;
      sharedDocRef.set({ recepti: json }, { merge: true }).catch((e) => {
        console.error("Failed to save recepti", e);
        lastSentRecipes.current = null; // ne blokiraj ponovni pokušaj kasnije ako se doc ipak promijeni
        showToast("Snimanje nije uspjelo (" + (e && e.code ? e.code : "greška") + "). Recept NIJE sačuvan trajno — provjeri internet ili se javi.", "error");
      });
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [recipes, loaded]);

  function showToast(msg, type) {
    const t = type || "success";
    setToast({ msg, type: t });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), t === "error" ? 6000 : 3000);
  }

  const knownCategories = Array.from(
    new Set([...DEFAULT_CATEGORIES, ...recipes.map((r) => r.kategorija).filter(Boolean)])
  ).sort((a, b) => a.localeCompare(b, "sr"));

  const allCategoriesForFilter = ["Sve", "Omiljeni", ...knownCategories];

  const visibleRecipes = recipes
    .filter((r) => {
      if (categoryFilter === "Sve") return true;
      if (categoryFilter === "Omiljeni") return !!r.omiljen;
      return r.kategorija === categoryFilter;
    })
    .filter((r) => {
      const q = search.trim().toLowerCase();
      if (!q) return true;
      if (r.naziv.toLowerCase().includes(q)) return true;
      return (r.sastojci || []).some((s) => (s || "").toLowerCase().includes(q));
    })
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  function openAddForm() {
    setForm(emptyRecipeForm());
  }
  function openEditForm(recipe) {
    setForm({ ...recipe, sastojci: recipe.sastojci && recipe.sastojci.length ? recipe.sastojci.slice() : [""] });
    setDetailId(null);
  }
  function closeForm() {
    setForm(null);
  }
  function saveForm() {
    const naziv = (form.naziv || "").trim();
    if (!naziv) return;
    const cleanSastojci = (form.sastojci || []).map((s) => (s || "").trim()).filter(Boolean);
    const cleaned = {
      id: form.id || uid(),
      naziv: naziv,
      kategorija: (form.kategorija || "").trim(),
      slikaUrl: safeUrl(form.slikaUrl),
      videoUrl: safeUrl(form.videoUrl),
      sastojci: cleanSastojci,
      priprema: (form.priprema || "").trim(),
    };
    setRecipes((prev) => {
      const existingIdx = prev.findIndex((r) => r.id === cleaned.id);
      if (existingIdx >= 0) {
        const next = prev.slice();
        next[existingIdx] = { ...prev[existingIdx], ...cleaned };
        return next;
      }
      const maxOrder = prev.reduce((m, r) => Math.max(m, r.order || 0), 0);
      return prev.concat([{ ...cleaned, order: maxOrder + 1 }]);
    });
    setForm(null);
  }
  function deleteRecipe(id) {
    setRecipes((prev) => prev.filter((r) => r.id !== id));
    if (detailId === id) setDetailId(null);
  }
  function toggleFavorite(id) {
    setRecipes((prev) => prev.map((r) => (r.id === id ? { ...r, omiljen: !r.omiljen } : r)));
  }

  async function addIngredientsToShoppingList(recipe) {
    if (!recipe.sastojci || recipe.sastojci.length === 0) {
      showToast("Ovaj recept nema unešene sastojke.", "error");
      return;
    }
    setAddingToCart(true);
    try {
      const shoppingRef = db.collection("shopping-list").doc("shared");
      // Transakcija: čita i piše atomično, pa se stavke ne izgube ako neko u istom
      // trenutku mijenja kupovinu na drugom uređaju (sprječava "gaženje" liste).
      await db.runTransaction(async (tx) => {
        const snap = await tx.get(shoppingRef);
        const data = snap.exists ? snap.data() : {};
        let items = [];
        if (typeof data.items === "string") {
          try {
            const parsed = JSON.parse(data.items);
            if (Array.isArray(parsed)) items = parsed;
          } catch (e) {}
        }
        const maxOrder = items.reduce((m, it) => Math.max(m, it.order || 0), 0);
        const newItems = recipe.sastojci.map((naziv, i) => ({
          id: uid() + i,
          name: naziv,
          quantity: 1,
          store: "",
          category: "",
          price: 0,
          note: "",
          purchased: false,
          order: maxOrder + i + 1,
        }));
        const updated = items.concat(newItems);
        tx.set(shoppingRef, { items: JSON.stringify(updated) }, { merge: true });
      });
      showToast("Sastojci (" + recipe.sastojci.length + ") dodati u kupovinu!");
    } catch (e) {
      console.error("Failed to add ingredients to shopping list", e);
      showToast("Nije uspjelo dodavanje u kupovinu. Pokušaj ponovo.", "error");
    } finally {
      setAddingToCart(false);
    }
  }

  const detailRecipe = detailId ? recipes.find((r) => r.id === detailId) : null;

  return (
    <div style={{ background: "#F5F3EE", minHeight: "100%", color: "#0F222B", fontFamily: "'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" }}>
      <div style={{ width: "100%", maxWidth: 960, margin: "0 auto", padding: "28px 14px 60px" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#007991" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.042V20a1 1 0 0 0 1 1Z"/>
              <path d="M6 17h12"/>
            </svg>
            <div>
              <h1 style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 26, fontWeight: 700, color: "#0F222B", letterSpacing: "-0.02em", margin: 0 }}>Recepti</h1>
              <div style={{ color: "#8A8578", fontSize: 13.5, marginTop: 2 }}>{recipes.length} {recipes.length === 1 ? "recept" : "recepta"}</div>
            </div>
          </div>
          <button
            type="button"
            onClick={openAddForm}
            style={{ background: "#007991", color: "#fff", border: "1px solid #007991", borderRadius: 9, padding: "0 12px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit", flexShrink: 0, width: 160, height: 40, boxSizing: "border-box" }}
          >
            + Dodaj recept
          </button>
        </div>

        <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Pretraži po nazivu ili sastojku..."
            style={{ flex: "3 1 160px", minWidth: 0, height: 40, boxSizing: "border-box", border: "1px solid #E6E1D8", borderRadius: 9, padding: "0 12px", fontSize: 14, fontFamily: "inherit", background: "#fff", outline: "none" }}
          />
          <CategoryDropdown
            value={categoryFilter}
            onChange={setCategoryFilter}
            options={allCategoriesForFilter}
            wrapperStyle={{ flex: "0 1 160px", minWidth: 100, maxWidth: 160 }}
          />
        </div>

        {!loaded ? (
          <div style={{ color: "#8A8578", fontSize: 14, padding: "20px 4px" }}>Učitavanje...</div>
        ) : visibleRecipes.length === 0 ? (
          <div style={{ color: "#8A8578", fontSize: 14, padding: "30px 4px", textAlign: "center" }}>
            {recipes.length === 0 ? "Još nema dodanih recepata." : "Nema recepata koji odgovaraju pretrazi."}
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 12 }}>
            {visibleRecipes.map((r) => (
              <div
                key={r.id}
                onClick={() => setDetailId(r.id)}
                style={{ background: "#fff", borderRadius: 14, overflow: "hidden", cursor: "pointer", boxShadow: "0 1px 2px rgba(27,58,74,0.06), 0 8px 20px -10px rgba(27,58,74,0.1)" }}
              >
                <div style={{ position: "relative", width: "100%", aspectRatio: "1 / 1", background: "#F0EDE4", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
                  <RecipeImage url={r.slikaUrl} alt={r.naziv} iconSize={36} />
                  <button
                    type="button"
                    aria-label={r.omiljen ? "Ukloni iz omiljenih" : "Dodaj u omiljene"}
                    onClick={(e) => { e.stopPropagation(); toggleFavorite(r.id); }}
                    style={{ position: "absolute", top: 8, right: 8, width: 30, height: 30, borderRadius: "50%", background: "rgba(255,255,255,0.9)", color: r.omiljen ? "#E0555A" : "#8A8578", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 1px 4px rgba(15,34,43,0.18)", padding: 0 }}
                  >
                    {heartIcon(r.omiljen, 16)}
                  </button>
                </div>
                <div style={{ padding: "10px 12px 12px" }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: "#0F222B", marginBottom: 6, lineHeight: 1.25 }}>{r.naziv}</div>
                  <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                    <CategoryTag label={r.kategorija} />
                    <span style={{ color: "#8A8578", fontSize: 11.5 }}>{(r.sastojci || []).length} sastojaka</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {toast && (
        <div
          style={{
            position: "fixed", left: "50%", bottom: "calc(90px + env(safe-area-inset-bottom))", transform: "translateX(-50%)",
            background: toast.type === "error" ? "#B3413E" : "#1F7A52", color: "#fff", padding: "12px 16px", borderRadius: 10,
            fontSize: 13.5, fontWeight: 600, lineHeight: 1.4, textAlign: "center", boxShadow: "0 8px 20px -8px rgba(15,34,43,0.4)",
            zIndex: 10001, maxWidth: "calc(100vw - 32px)", boxSizing: "border-box",
          }}
        >
          {toast.msg}
        </div>
      )}

      {detailRecipe && !form && (
        <RecipeDetailModal
          recipe={detailRecipe}
          onClose={() => setDetailId(null)}
          onEdit={() => openEditForm(detailRecipe)}
          onDelete={() => deleteRecipe(detailRecipe.id)}
          onAddToCart={() => addIngredientsToShoppingList(detailRecipe)}
          onToggleFavorite={() => toggleFavorite(detailRecipe.id)}
          addingToCart={addingToCart}
        />
      )}

      {form && (
        <RecipeFormModal
          form={form}
          setForm={setForm}
          onSave={saveForm}
          onCancel={closeForm}
          knownCategories={knownCategories}
          isNew={!recipes.some((r) => r.id === form.id)}
        />
      )}
    </div>
  );
}

function RecipeDetailModal({ recipe, onClose, onEdit, onDelete, onAddToCart, onToggleFavorite, addingToCart }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  return (
    <div
      onClick={onClose}
      style={{ position: "fixed", inset: 0, background: "rgba(15,34,43,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 10000 }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: "#FFFDF8", width: "100%", maxWidth: 480, maxHeight: "90dvh", overflowY: "auto", borderRadius: "18px 18px 0 0", boxShadow: "0 -8px 30px rgba(15,34,43,0.25)" }}
      >
        <div style={{ position: "relative", width: "100%", aspectRatio: "4 / 3", background: "#F0EDE4", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
          <RecipeImage url={recipe.slikaUrl} alt={recipe.naziv} iconSize={48} />
          <button
            type="button"
            aria-label={recipe.omiljen ? "Ukloni iz omiljenih" : "Dodaj u omiljene"}
            onClick={onToggleFavorite}
            style={{ position: "absolute", top: 12, left: 12, width: 36, height: 36, borderRadius: "50%", background: "rgba(255,255,255,0.92)", color: recipe.omiljen ? "#E0555A" : "#8A8578", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 1px 6px rgba(15,34,43,0.2)", padding: 0 }}
          >
            {heartIcon(recipe.omiljen, 19)}
          </button>
          <button
            type="button"
            onClick={onClose}
            style={{ position: "absolute", top: 12, right: 12, width: 32, height: 32, borderRadius: "50%", background: "rgba(15,34,43,0.55)", color: "#fff", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
          >
            {xIcon()}
          </button>
        </div>

        <div style={{ padding: "18px 20px 24px" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, marginBottom: 8 }}>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 21, fontWeight: 600, color: "#0F222B", lineHeight: 1.25 }}>{recipe.naziv}</div>
          </div>
          <div style={{ marginBottom: 16 }}>
            <CategoryTag label={recipe.kategorija} />
          </div>

          {recipe.videoUrl && (
            <a
              href={recipe.videoUrl}
              target="_blank"
              rel="noopener noreferrer"
              style={{ display: "inline-flex", alignItems: "center", gap: 7, background: "#0F222B", color: "#fff", textDecoration: "none", padding: "8px 14px", borderRadius: 9, fontSize: 13, fontWeight: 600, marginBottom: 18 }}
            >
              {playIcon()} Pogledaj video
            </a>
          )}

          <div style={{ marginBottom: 20 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, color: "#0F222B", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.3 }}>Sastojci</div>
            {(recipe.sastojci || []).length === 0 ? (
              <div style={{ color: "#8A8578", fontSize: 13.5 }}>Nema unešenih sastojaka.</div>
            ) : (
              <ul style={{ margin: 0, paddingLeft: 20, color: "#3A362E", fontSize: 14, lineHeight: 1.7 }}>
                {recipe.sastojci.map((s, i) => (
                  <li key={i}>{s}</li>
                ))}
              </ul>
            )}
          </div>

          {recipe.priprema && (
            <div style={{ marginBottom: 22 }}>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: "#0F222B", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.3 }}>Priprema</div>
              <div style={{ color: "#3A362E", fontSize: 14, lineHeight: 1.65, whiteSpace: "pre-wrap" }}>{recipe.priprema}</div>
            </div>
          )}

          <button
            type="button"
            onClick={onAddToCart}
            disabled={addingToCart}
            style={{ width: "100%", background: "#007991", color: "#fff", border: "none", borderRadius: 10, padding: "13px 16px", fontWeight: 700, fontSize: 14.5, cursor: addingToCart ? "default" : "pointer", opacity: addingToCart ? 0.7 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, fontFamily: "inherit", marginBottom: 12 }}
          >
            {cartIcon()} {addingToCart ? "Dodavanje..." : "Dodaj sve sastojke u kupovinu"}
          </button>

          <div style={{ display: "flex", gap: 10 }}>
            <button
              type="button"
              onClick={onEdit}
              style={{ flex: 1, background: "#fff", color: "#0F222B", border: "1px solid #E4DFD3", borderRadius: 10, padding: "10px 12px", fontWeight: 600, fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontFamily: "inherit" }}
            >
              {pencilIcon()} Izmijeni
            </button>
            {!confirmDelete ? (
              <button
                type="button"
                onClick={() => setConfirmDelete(true)}
                style={{ flex: 1, background: "#fff", color: "#B3413E", border: "1px solid #E4DFD3", borderRadius: 10, padding: "10px 12px", fontWeight: 600, fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontFamily: "inherit" }}
              >
                {trashIcon()} Obriši
              </button>
            ) : (
              <button
                type="button"
                onClick={onDelete}
                style={{ flex: 1, background: "#B3413E", color: "#fff", border: "1px solid #B3413E", borderRadius: 10, padding: "10px 12px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit" }}
              >
                Potvrdi brisanje
              </button>
            )}
          </div>
        </div>
      </div>
    </div>

}

function RecipeFormModal({ form, setForm, onSave, onCancel, knownCategories, isNew }) {
  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const fileInputRef = useRef(null);
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState("");
  const scanInputRef = useRef(null);

  function updateField(field, value) {
    setForm((prev) => ({ ...prev, [field]: value }));
  }

  async function handleScanSelected(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // dozvoli ponovni odabir iste slike
    if (!file) return;
    setScanError("");
    setScanning(true);
    try {
      const r = await scanRecipeFromImage(file);
      setForm((prev) => {
        const sastojci = Array.isArray(r.sastojci) && r.sastojci.length
          ? r.sastojci.map((s) => String(s))
          : prev.sastojci;
        return {
          ...prev,
          naziv: r.naziv ? String(r.naziv) : prev.naziv,
          kategorija: r.kategorija ? String(r.kategorija) : prev.kategorija,
          sastojci: sastojci && sastojci.length ? sastojci : [""],
          priprema: r.priprema ? String(r.priprema) : prev.priprema,
        };
      });
    } catch (err) {
      console.error("Scan failed", err);
      setScanError((err && err.message) || "Skeniranje nije uspjelo. Unesi ručno.");
    } finally {
      setScanning(false);
    }
  }

  async function handleFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // omogući ponovni odabir istog fajla ako upload ne uspije
    if (!file) return;
    setUploadError("");
    setUploading(true);
    try {
      const url = await uploadImageToCloudinary(file);
      updateField("slikaUrl", url);
    } catch (err) {
      console.error("Cloudinary upload failed", err);
      setUploadError("Otpremanje slike nije uspjelo. Probaj ponovo ili zalijepi link ručno.");
    } finally {
      setUploading(false);
    }
  }
  function updateSastojak(idx, value) {
    setForm((prev) => {
      const next = prev.sastojci.slice();
      next[idx] = value;
      return { ...prev, sastojci: next };
    });
  }
  function removeSastojak(idx) {
    setForm((prev) => {
      const next = prev.sastojci.slice();
      next.splice(idx, 1);
      if (next.length === 0) next.push("");
      return { ...prev, sastojci: next };
    });
  }
  function addSastojak() {
    setForm((prev) => ({ ...prev, sastojci: prev.sastojci.concat([""]) }));
  }

  const inputStyle = { width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid #E4DFD3", fontSize: 14, fontFamily: "inherit", color: "#0F222B", background: "#fff" };
  const labelStyle = { fontWeight: 700, fontSize: 12.5, color: "#0F222B", marginBottom: 6, display: "block", textTransform: "uppercase", letterSpacing: 0.3 };

  return (
    <div
      onClick={onCancel}
      style={{ position: "fixed", inset: 0, background: "rgba(15,34,43,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 10000 }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: "#FFFDF8", width: "100%", maxWidth: 480, maxHeight: "90dvh", overflowY: "auto", borderRadius: "18px 18px 0 0", boxShadow: "0 -8px 30px rgba(15,34,43,0.25)", padding: "20px 20px 26px" }}
      >
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 600, color: "#0F222B" }}>{isNew ? "Dodaj recept" : "Izmijeni recept"}</div>
          <button
            type="button"
            onClick={onCancel}
            style={{ width: 30, height: 30, borderRadius: "50%", background: "#F0EDE4", color: "#0F222B", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
          >
            {xIcon()}
          </button>
        </div>

        <div style={{ marginBottom: 16, padding: "12px 14px", background: "#EAF3F4", border: "1px solid #CADEE1", borderRadius: 12 }}>
          {scanning ? (
            <div style={{ width: "100%", boxSizing: "border-box", background: "#007991", color: "#fff", borderRadius: 9, padding: "11px 12px", fontWeight: 700, fontSize: 14, opacity: 0.75, fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              {uploadIcon()} Čitam recept sa slike...
            </div>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <label style={{ position: "relative", overflow: "hidden", flex: 1, boxSizing: "border-box", background: "#007991", color: "#fff", borderRadius: 9, padding: "11px 10px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, WebkitTapHighlightColor: "transparent" }}>
                {cameraIcon()} Slikaj
                <input type="file" accept="image/*" capture="environment" onChange={handleScanSelected} style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, border: 0, padding: 0, margin: 0, cursor: "pointer" }} />
              </label>
              <label style={{ position: "relative", overflow: "hidden", flex: 1, boxSizing: "border-box", background: "#007991", color: "#fff", borderRadius: 9, padding: "11px 10px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, WebkitTapHighlightColor: "transparent" }}>
                {uploadIcon()} Galerija
                <input ref={scanInputRef} type="file" accept="image/*" onChange={handleScanSelected} style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, border: 0, padding: 0, margin: 0, cursor: "pointer" }} />
              </label>
            </div>
          )}
          <div style={{ color: "#5A6B6E", fontSize: 12, marginTop: 8, lineHeight: 1.4 }}>
„Slikaj" — fotografiši recept kamerom. „Galerija" — izaberi postojeću sliku ili screenshot. Polja se popune sama; provjeri prije nego sačuvaš.
          </div>
          {scanError && <div style={{ color: "#B3413E", fontSize: 12.5, marginTop: 8 }}>{scanError}</div>}
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Naziv</label>
          <input type="text" value={form.naziv} onChange={(e) => updateField("naziv", e.target.value)} placeholder="Naziv recepta" style={inputStyle} />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Kategorija</label>
          <AutocompleteInput
            value={form.kategorija}
            onChange={(v) => updateField("kategorija", v)}
            options={knownCategories}
            placeholder="Kategorija (upiši ili izaberi)"
            style={inputStyle}
          />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Slika</label>
          <input type="text" value={form.slikaUrl} onChange={(e) => updateField("slikaUrl", e.target.value)} placeholder="https://... (ili otpremi ispod)" style={inputStyle} />
          <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelected} style={{ display: "none" }} />
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8, flexWrap: "wrap" }}>
            <button
              type="button"
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              disabled={uploading}
              style={{ background: "#F0EDE4", color: "#0F222B", border: "none", borderRadius: 9, padding: "8px 12px", fontWeight: 600, fontSize: 13, cursor: uploading ? "default" : "pointer", fontFamily: "inherit", opacity: uploading ? 0.7 : 1, display: "flex", alignItems: "center", gap: 6 }}
            >
              {uploadIcon()} {uploading ? "Otpremanje..." : "Otpremi sliku"}
            </button>
            {form.slikaUrl && (
              <div style={{ width: 44, height: 44, borderRadius: 8, overflow: "hidden", background: "#F0EDE4", flexShrink: 0 }}>
                <img src={form.slikaUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={(e) => { e.target.style.display = "none"; }} />
              </div>
            )}
          </div>
          {uploadError && <div style={{ color: "#B3413E", fontSize: 12.5, marginTop: 6 }}>{uploadError}</div>}
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Video (URL)</label>
          <input type="text" value={form.videoUrl} onChange={(e) => updateField("videoUrl", e.target.value)} placeholder="https://..." style={inputStyle} />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Sastojci</label>
          {form.sastojci.map((s, i) => (
            <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <input
                type="text"
                value={s}
                onChange={(e) => updateSastojak(i, e.target.value)}
                placeholder={"Sastojak " + (i + 1)}
                style={inputStyle}
              />
              <button
                type="button"
                onClick={() => removeSastojak(i)}
                style={{ flexShrink: 0, width: 38, borderRadius: 9, border: "1px solid #E4DFD3", background: "#fff", color: "#8A8578", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}
              >
                {xIcon()}
              </button>
            </div>
          ))}
          <button
            type="button"
            onClick={addSastojak}
            style={{ background: "#F0EDE4", color: "#0F222B", border: "none", borderRadius: 9, padding: "8px 12px", fontWeight: 600, fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}
          >
            + Dodaj sastojak
          </button>
        </div>

        <div style={{ marginBottom: 20 }}>
          <label style={labelStyle}>Priprema</label>
          <textarea
            value={form.priprema}
            onChange={(e) => updateField("priprema", e.target.value)}
            placeholder="Koraci pripreme..."
            rows={5}
            style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit" }}
          />
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          <button
            type="button"
            onClick={onCancel}
            style={{ flex: 1, background: "#fff", color: "#0F222B", border: "1px solid #E4DFD3", borderRadius: 10, padding: "12px 12px", fontWeight: 600, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}
          >
            Otkaži
          </button>
          <button
            type="button"
            onClick={onSave}
            style={{ flex: 1, background: "#007991", color: "#fff", border: "none", borderRadius: 10, padding: "12px 12px", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}
          >
            Sačuvaj
          </button>
        </div>
      </div>
    </div>
  );
}

root.render(<RecipeApp />);
