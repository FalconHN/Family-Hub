function RecipeApp() {
  const [recipes, setRecipes] = useState([]);
  const [cjenovnik, setCjenovnik] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [search, setSearch] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("Sve");
  const [detailId, setDetailId] = useState(null);
  const [form, setForm] = useState(null); // null = no form open, object = editing/adding
  const [toast, setToast] = useState(null); // null ili { msg, type: "success" | "error" }
  const [addingToCart, setAddingToCart] = useState(false);
  const [cjenovnikOpen, setCjenovnikOpen] = useState(false);
  // true dok prikazani podaci dolaze iz lokalnog keša telefona (brzo, ali možda zastarjelo ako je
  // nešto izmijenjeno na drugom uređaju u međuvremenu), a baza još nije potvrdila da su
  // najsvježiji. Koristi se samo za mali, suptilni indikator - ne blokira ništa i ne mijenja kad
  // se šta iscrtava.
  const [syncing, setSyncing] = useState(false);
  // Režim rasporeda: dok je uključen, na svakoj kartici se pojave strelice za premještanje.
  // Namjerno nije stalno uključen - strelice bi inače stajale preko slika recepata.
  const [reorderMode, setReorderMode] = useState(false);
  // Koji se recept trenutno prevlači mišem. Prevlačenje radi SAMO na računaru: ugrađeni
  // "drag and drop" u browseru ne postoji na telefonima (dodir prstom se tumači kao listanje
  // stranice, ne kao prevlačenje). Zato strelice ostaju - one rade svuda isto.
  const [dragId, setDragId] = useState(null);

  const lastSentRecipes = useRef(null);
  const lastSentCjenovnik = useRef(null);
  // Da li smo IKAD stvarno dobili podatke iz baze. Ovo NIJE isto što i "loaded": ako se
  // učitavanje ne uspije (nema interneta, istekla prijava, greška u pravilima pristupa), ekran
  // se ipak mora otključati (da korisnik vidi poruku o grešci umjesto vječnog vrtića), ali tada
  // recepti/cjenovnik stoje na PRAZNOM početnom nizu - a to nije stvarno stanje baze, nego samo
  // "još ništa nismo pročitali". Bez ove zastavice automatsko snimanje bi taj prazan niz upisalo
  // preko stvarnih podataka i OBRISALO sve recepte na svim uređajima.
  const primljeniPodaci = useRef(false);
  // Id-evi recepata koje smo stvarno prikazali - da se pri snimanju razlikuje "ovaj sam ja
  // obrisao" od "ovaj je neko upravo dodao sa drugog telefona". Vidi spajanje kod snimanja.
  const vidjeniRecepti = useRef(new Set());
  function zapamtiVidjeneRecepte(niz) {
    (niz || []).forEach((r) => { if (r && r.id != null) vidjeniRecepti.current.add(r.id); });
  }
  const saveTimer = useRef(null);
  const cjenovnikSaveTimer = useRef(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    const unsub = sharedDocRef.onSnapshot(
      (snap) => {
        if (snap.exists) {
          const data = snap.data() || {};
          if (typeof data.recepti === "string" && data.recepti !== lastSentRecipes.current) {
            try {
              const parsed = JSON.parse(data.recepti);
              if (Array.isArray(parsed)) {
                const next = parsed.map((r, i) => ({ sastojci: [], priprema: "", kategorija: "", slikaUrl: "", videoUrl: "", omiljen: false, order: i, brojPorcija: "", ...r, sastojci: normalizeSastojci(r.sastojci) }));
                // Ako lokalno nešto čeka snimanje (upravo si obrisao recept, promijenio omiljeni,
                // sačuvao izmjenu), NE preuzimaj stanje iz baze - pregazilo bi tu izmjenu i ona se
                // nikad ne bi ni poslala, jer bi se tajmer ponovo naoružao već pregaženom
                // vrijednošću. Tuđi recepti se ne gube: spajaju se pri snimanju (transakcija dolje).
                if (saveTimer.current) return;
                // Ako su podaci koji su stigli iz baze suštinski isti kao ono što već prikazujemo
                // (npr. baza samo "odjekne" nazad naš vlastiti upis, ili stigne suvišni snapshot),
                // ne pravimo novi niz/objekte - to bi natjeralo cijelu listu i otvoreni prozorčić da
                // se iznova iscrtaju bez ikakve stvarne promjene, što se na sporijoj/nestabilnoj
                // mreži vidi kao kratak "trzaj"/treperenje ekrana.
                zapamtiVidjeneRecepte(next);
                setRecipes((prev) => (JSON.stringify(prev) === JSON.stringify(next) ? prev : next));
              }
            } catch (e) {}
          }
          if (typeof data.cjenovnik === "string" && data.cjenovnik !== lastSentCjenovnik.current) {
            try {
              const parsedC = JSON.parse(data.cjenovnik);
              if (Array.isArray(parsedC)) {
                setCjenovnik((prev) => (JSON.stringify(prev) === JSON.stringify(parsedC) ? prev : parsedC));
              }
            } catch (e) {}
          }
        } else {
          sharedDocRef.set({ recepti: JSON.stringify([]), cjenovnik: JSON.stringify([]) });
        }
        // Uspješno pročitano iz baze (bilo da dokument postoji ili smo ga tek napravili) - od sad
        // je bezbjedno automatski snimati.
        primljeniPodaci.current = true;
        setLoaded(true);
        // snap.metadata.fromCache je true dok je ovo lokalno sačuvana kopija (prije nego što
        // baza potvrdi da je najsvježija) - koristimo to samo da pokažemo mali indikator, ne za
        // ništa drugo.
        setSyncing(!!(snap.metadata && snap.metadata.fromCache));
      },
      (err) => {
        console.error("Firestore sync error", err);
        showToast("Greška pri učitavanju recepata (" + (err && err.code ? err.code : "provjeri internet") + ").", "error");
        setLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    // Ne snimaj dok stvarno ne pročitamo bazu - vidi objašnjenje uz primljeniPodaci gore.
    if (!loaded || !primljeniPodaci.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const lokalni = recipes;
      zapamtiVidjeneRecepte(lokalni);
      // Ne upisuje se slijepo cijeli lokalni spisak preko onoga u bazi, nego se u transakciji
      // spaja: recept koji je neko drugi dodao dok si ti nešto mijenjao (a ti ga nikad nisi
      // vidio) ostaje. Ranije bi zadnji upis obrisao sve što je stiglo u zadnjih pola sekunde.
      db.runTransaction(async (tx) => {
        const snap = await tx.get(sharedDocRef);
        let udaljeni = [];
        try {
          const raw = snap.exists ? (snap.data() || {}).recepti : null;
          if (typeof raw === "string") {
            const p = JSON.parse(raw);
            if (Array.isArray(p)) udaljeni = p;
          }
        } catch (e) {}
        const lokalniIds = new Set(lokalni.map((r) => r && r.id));
        const tudjiNovi = udaljeni.filter((r) => r && !lokalniIds.has(r.id) && !vidjeniRecepti.current.has(r.id));
        const spojeni = tudjiNovi.length
          ? lokalni.concat(tudjiNovi.map((r, i) => ({ sastojci: [], priprema: "", kategorija: "", slikaUrl: "", videoUrl: "", omiljen: false, order: lokalni.length + i, brojPorcija: "", ...r, sastojci: normalizeSastojci(r.sastojci) })))
          : lokalni;
        const json = JSON.stringify(spojeni);
        lastSentRecipes.current = json;
        tx.set(sharedDocRef, { recepti: json }, { merge: true });
        return spojeni;
      }).then((spojeni) => {
        saveTimer.current = null;
        if (!spojeni) return;
        zapamtiVidjeneRecepte(spojeni);
        setRecipes((prev) => (JSON.stringify(prev) === JSON.stringify(spojeni) ? prev : spojeni));
      }).catch((e) => {
        saveTimer.current = null;
        console.error("Failed to save recepti", e);
        lastSentRecipes.current = null; // ne blokiraj ponovni pokušaj kasnije ako se doc ipak promijeni
        showToast("Snimanje nije uspjelo (" + (e && e.code ? e.code : "greška") + "). Recept NIJE sačuvan trajno — provjeri internet ili se javi.", "error");
      });
    }, 400);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [recipes, loaded]);

  // Cjenovnik (cijene po jedinici mjere za namirnice) se čuva u istom dokumentu kao i recepti,
  // samo u drugom polju - isti obrazac autosnimanja (400ms poslije zadnje izmjene).
  useEffect(() => {
    if (!loaded || !primljeniPodaci.current) return;
    if (cjenovnikSaveTimer.current) clearTimeout(cjenovnikSaveTimer.current);
    cjenovnikSaveTimer.current = setTimeout(() => {
      const json = JSON.stringify(cjenovnik);
      lastSentCjenovnik.current = json;
      sharedDocRef.set({ cjenovnik: json }, { merge: true }).catch((e) => {
        console.error("Failed to save cjenovnik", e);
        lastSentCjenovnik.current = null;
        showToast("Snimanje cjenovnika nije uspjelo (" + (e && e.code ? e.code : "greška") + ").", "error");
      });
    }, 400);
    return () => clearTimeout(cjenovnikSaveTimer.current);
  }, [cjenovnik, loaded]);

  // Kad je otvoren neki od "modala" (detalji recepta, forma za dodavanje/izmjenu ili Cjenovnik),
  // gurni jedan dodatni unos u istoriju browsera. Tako dugme/gest "nazad" na telefonu prvo
  // zatvori modal (ostaješ na stranici Recepti), umjesto da odmah izađe sa cijele stranice na
  // prethodnu (npr. na početni ekran). Kad se modal zatvori preko X/Otkaži dugmeta, sami
  // "pojedemo" taj dodatni unos (history.back()) da se ne gomilaju prazni koraci u istoriji.
  const modalHistoryRef = useRef({ pushed: false, poppingFromBack: false });
  const modalOpen = !!(detailId || form || cjenovnikOpen);
  useEffect(() => {
    const st = modalHistoryRef.current;
    if (modalOpen && !st.pushed) {
      window.history.pushState({ fhModal: true }, "");
      st.pushed = true;
    } else if (!modalOpen && st.pushed) {
      st.pushed = false;
      if (!st.poppingFromBack) window.history.back();
      st.poppingFromBack = false;
    }
  }, [modalOpen]);

  useEffect(() => {
    function onPopState() {
      const st = modalHistoryRef.current;
      if (st.pushed) {
        st.pushed = false;
        st.poppingFromBack = true;
        setDetailId(null);
        setForm(null);
        setCjenovnikOpen(false);
      }
    }
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, []);

  function showToast(msg, type) {
    const t = type || "success";
    setToast({ msg, type: t });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), t === "error" ? 6000 : 3000);
  }

  // Isti "pun ekran" indikator učitavanja kao na ostalim stranicama (raspored.html),
  // da iskustvo bude jednoliko dok se ne poveže sa bazom.
  if (!loaded) {
    return (
      <div style={{ position: "fixed", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, background: "#F5F3EE", fontFamily: "'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" }}>
        <div style={{ width: 34, height: 34, border: "3px solid #DDE7E4", borderTopColor: "#007991", borderRadius: "50%", animation: "fhspin 0.8s linear infinite" }} />
        <div style={{ fontSize: 14, fontWeight: 600, color: "#5B6B70" }}>Učitavanje…</div>
      </div>
    );
  }

  const knownCategories = Array.from(
    new Set([...DEFAULT_CATEGORIES, ...recipes.map((r) => r.kategorija).filter(Boolean)])
  ).sort((a, b) => a.localeCompare(b, "sr"));

  const allCategoriesForFilter = ["Sve", "Omiljeni", ...knownCategories];

  const visibleRecipes = recipes
    .filter((r) => {
      if (categoryFilter === "Sve") return true;
      if (categoryFilter === "Omiljeni") return !!r.omiljen;
      return r.kategorija === categoryFilter;
    })
    .filter((r) => {
      const q = search.trim().toLowerCase();
      if (!q) return true;
      if (r.naziv.toLowerCase().includes(q)) return true;
      return (r.sastojci || []).some((s) => (s && s.naziv || "").toLowerCase().includes(q));
    })
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  function openAddForm() {
    setForm(emptyRecipeForm());
  }
  function openEditForm(recipe) {
    setForm({
      ...recipe,
      sastojci: recipe.sastojci && recipe.sastojci.length ? recipe.sastojci.map((s) => ({ ...s })) : [{ naziv: "", kolicina: "", jedinica: "" }],
      brojPorcija: recipe.brojPorcija || "",
    });
    setDetailId(null);
  }
  function closeForm() {
    setForm(null);
  }
  function saveForm() {
    const naziv = (form.naziv || "").trim();
    if (!naziv) return;
    const cleanSastojci = (form.sastojci || [])
      .map((s) => ({
        naziv: (s.naziv || "").trim(),
        kolicina: s.kolicina === "" || s.kolicina === null || s.kolicina === undefined ? "" : Number(s.kolicina),
        jedinica: s.jedinica || "",
      }))
      .filter((s) => s.naziv);
    const cleaned = {
      id: form.id || uid(),
      naziv: naziv,
      kategorija: (form.kategorija || "").trim(),
      slikaUrl: safeUrl(form.slikaUrl),
      videoUrl: safeUrl(form.videoUrl),
      sastojci: cleanSastojci,
      priprema: (form.priprema || "").trim(),
      brojPorcija: form.brojPorcija === "" || form.brojPorcija === null || form.brojPorcija === undefined ? "" : Number(form.brojPorcija),
    };
    setRecipes((prev) => {
      const existingIdx = prev.findIndex((r) => r.id === cleaned.id);
      if (existingIdx >= 0) {
        const next = prev.slice();
        next[existingIdx] = { ...prev[existingIdx], ...cleaned };
        return next;
      }
      const maxOrder = prev.reduce((m, r) => Math.max(m, r.order || 0), 0);
      return prev.concat([{ ...cleaned, order: maxOrder + 1 }]);
    });
    setForm(null);
  }
  function deleteRecipe(id) {
    setRecipes((prev) => prev.filter((r) => r.id !== id));
    if (detailId === id) setDetailId(null);
  }
  function toggleFavorite(id) {
    setRecipes((prev) => prev.map((r) => (r.id === id ? { ...r, omiljen: !r.omiljen } : r)));
  }

  // Premjesti recept na mjesto susjednog. Cijelom spisku se poslije toga ponovo dodijele redni
  // brojevi, pa raspored ostaje ispravan i kad su stari brojevi izmiješani ili se ponavljaju.
  function moveRecipeTo(id, susjedId) {
    if (!susjedId || id === susjedId) return;
    setRecipes((prev) => {
      const lista = [...prev].sort((a, b) => (a.order || 0) - (b.order || 0));
      const odakle = lista.findIndex((r) => r.id === id);
      const dokle = lista.findIndex((r) => r.id === susjedId);
      if (odakle === -1 || dokle === -1) return prev;
      const [pomjeren] = lista.splice(odakle, 1);
      lista.splice(dokle, 0, pomjeren);
      return lista.map((r, i) => ({ ...r, order: i }));
    });
  }

  async function addIngredientsToShoppingList(recipe) {
    if (!recipe.sastojci || recipe.sastojci.length === 0) {
      showToast("Ovaj recept nema unešene sastojke.", "error");
      return;
    }
    setAddingToCart(true);
    try {
      const shoppingRef = db.collection("shopping-list").doc("shared");
      // Transakcija: čita i piše atomično, pa se stavke ne izgube ako neko u istom
      // trenutku mijenja kupovinu na drugom uređaju (sprječava "gaženje" liste).
      await db.runTransaction(async (tx) => {
        const snap = await tx.get(shoppingRef);
        const data = snap.exists ? snap.data() : {};
        let items = [];
        if (typeof data.items === "string") {
          try {
            const parsed = JSON.parse(data.items);
            if (Array.isArray(parsed)) items = parsed;
          } catch (e) {}
        }
        const maxOrder = items.reduce((m, it) => Math.max(m, it.order || 0), 0);
        const newItems = recipe.sastojci.map((s, i) => {
          const kolicinaText = s.kolicina && s.jedinica ? (s.kolicina + " " + s.jedinica) : "";
          const noteParts = [];
          if (recipe.naziv) noteParts.push("Za: " + recipe.naziv);
          if (kolicinaText) noteParts.push(kolicinaText);
          return {
            id: uid() + i,
            name: s.naziv,
            quantity: 1,
            store: "",
            category: "",
            price: 0,
            note: noteParts.join(" · "),
            purchased: false,
            order: maxOrder + i + 1,
          };
        });
        const updated = items.concat(newItems);
        tx.set(shoppingRef, { items: JSON.stringify(updated) }, { merge: true });
      });
      showToast("Sastojci (" + recipe.sastojci.length + ") dodati u kupovinu!");
    } catch (e) {
      console.error("Failed to add ingredients to shopping list", e);
      showToast("Nije uspjelo dodavanje u kupovinu. Pokušaj ponovo.", "error");
    } finally {
      setAddingToCart(false);
    }
  }

  const detailRecipe = detailId ? recipes.find((r) => r.id === detailId) : null;

  return (
    <div style={{ background: "#F5F3EE", minHeight: "100%", color: "#0F222B", fontFamily: "'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" }}>
      <div style={{ width: "100%", maxWidth: 1120, margin: "0 auto", padding: "28px 14px 60px" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#007991" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.042V20a1 1 0 0 0 1 1Z"/>
              <path d="M6 17h12"/>
            </svg>
            <div>
              <h1 style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 26, fontWeight: 700, color: "#0F222B", letterSpacing: "-0.02em", margin: 0 }}>Recepti</h1>
              <div style={{ color: "#8A8578", fontSize: 13.5, marginTop: 2, display: "flex", alignItems: "center", gap: 6 }}>
                <span>{recipes.length} {recipes.length === 1 ? "recept" : "recepta"}</span>
                {syncing && (
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 4, color: "#A9A398" }}>
                    <span style={{ width: 5, height: 5, borderRadius: "50%", background: "#A9A398", animation: "fhpulse 1.2s ease-in-out infinite" }} />
                    <span style={{ fontSize: 11.5 }}>sinhronizuje se…</span>
                  </span>
                )}
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
            <button
              type="button"
              onClick={() => setReorderMode((v) => !v)}
              title={reorderMode ? "Završi raspoređivanje" : "Rasporedi recepte po svom redu"}
              aria-label={reorderMode ? "Završi raspoređivanje" : "Rasporedi recepte"}
              style={{ background: reorderMode ? "#E5F0ED" : "#fff", color: reorderMode ? "#00707F" : "#0F222B", border: "1px solid " + (reorderMode ? "#9FC6C9" : "#E4DFD3"), borderRadius: 9, height: 40, minWidth: 40, padding: reorderMode ? "0 12px" : 0, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, cursor: "pointer", boxSizing: "border-box", fontFamily: "inherit", fontSize: 13.5, fontWeight: 700 }}
            >
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M8 8L5 5 2 8M5 5v14M16 16l3 3 3-3M19 19V5"/>
              </svg>
              {reorderMode && <span>Gotovo</span>}
            </button>
            <button
              type="button"
              onClick={() => setCjenovnikOpen(true)}
              title="Cjenovnik namirnica"
              aria-label="Cjenovnik namirnica"
              style={{ background: "#fff", color: "#0F222B", border: "1px solid #E4DFD3", borderRadius: 9, width: 40, height: 40, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxSizing: "border-box" }}
            >
              {moneyIcon(27)}
            </button>
            <button
              type="button"
              onClick={openAddForm}
              style={{ background: "#007991", color: "#fff", border: "1px solid #007991", borderRadius: 9, padding: "0 12px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit", flexShrink: 0, width: 160, height: 40, boxSizing: "border-box" }}
            >
              + Dodaj recept
            </button>
          </div>
        </div>

        <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Pretraži po nazivu ili sastojku..."
            style={{ flex: "3 1 160px", minWidth: 0, height: 40, boxSizing: "border-box", border: "1px solid #E6E1D8", borderRadius: 9, padding: "0 12px", fontSize: 14, fontFamily: "inherit", background: "#fff", outline: "none" }}
          />
          <CategoryDropdown
            value={categoryFilter}
            onChange={setCategoryFilter}
            options={allCategoriesForFilter}
            wrapperStyle={{ flex: "0 1 160px", minWidth: 100, maxWidth: 160 }}
          />
        </div>

        {visibleRecipes.length === 0 ? (
          <div style={{ color: "#8A8578", fontSize: 14, padding: "30px 4px", textAlign: "center" }}>
            {recipes.length === 0 ? "Još nema dodanih recepata." : "Nema recepata koji odgovaraju pretrazi."}
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 12 }}>
            {visibleRecipes.map((r, idx) => (
              <div
                key={r.id}
                onClick={() => { if (!reorderMode || !dragId) setDetailId(r.id); }}
                draggable={reorderMode}
                onDragStart={() => setDragId(r.id)}
                onDragOver={(e) => { if (reorderMode && dragId && dragId !== r.id) e.preventDefault(); }}
                onDrop={(e) => { e.preventDefault(); if (dragId && dragId !== r.id) moveRecipeTo(dragId, r.id); setDragId(null); }}
                onDragEnd={() => setDragId(null)}
                style={{
                  background: "#fff", borderRadius: 14, overflow: "hidden",
                  cursor: reorderMode ? "grab" : "pointer",
                  opacity: dragId === r.id ? 0.45 : 1,
                  outline: reorderMode && dragId && dragId !== r.id ? "2px dashed #9FC6C9" : "none",
                  outlineOffset: 2,
                  boxShadow: "0 1px 2px rgba(27,58,74,0.06), 0 8px 20px -10px rgba(27,58,74,0.1)",
                }}
              >
                <div style={{ position: "relative", width: "100%", aspectRatio: "1 / 1", background: "#F0EDE4", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
                  <RecipeImage url={r.slikaUrl} alt={r.naziv} iconSize={36} />
                  <button
                    type="button"
                    aria-label={r.omiljen ? "Ukloni iz omiljenih" : "Dodaj u omiljene"}
                    onClick={(e) => { e.stopPropagation(); toggleFavorite(r.id); }}
                    style={{ position: "absolute", top: 8, right: 8, width: 30, height: 30, borderRadius: "50%", background: "rgba(255,255,255,0.9)", color: r.omiljen ? "#E0555A" : "#8A8578", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 1px 4px rgba(15,34,43,0.18)", padding: 0 }}
                  >
                    {heartIcon(r.omiljen, 16)}
                  </button>
                  {reorderMode && (() => {
                    // U mreži "gore/dolje" ne znači ništa jasno (skače preko cijelog reda), pa
                    // strelice pomjeraju na PRETHODNO odnosno SLJEDEĆE mjesto u nizu - isto kao
                    // kad bi ih ručno prevlačio. Susjedi se traže u trenutno VIDLJIVOM spisku,
                    // da raspoređivanje radi ispravno i kad je uključen filter ili pretraga.
                    const prethodni = idx > 0 ? visibleRecipes[idx - 1] : null;
                    const sljedeci = idx < visibleRecipes.length - 1 ? visibleRecipes[idx + 1] : null;
                    const dugme = (aktivan, naSta, oznaka, putanja) => (
                      <button
                        type="button"
                        aria-label={oznaka}
                        disabled={!aktivan}
                        onClick={(e) => { e.stopPropagation(); if (aktivan) moveRecipeTo(r.id, naSta.id); }}
                        style={{ width: 30, height: 30, borderRadius: "50%", background: "rgba(255,255,255,0.94)", color: "#0F222B", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: aktivan ? "pointer" : "default", boxShadow: "0 1px 4px rgba(15,34,43,0.18)", padding: 0, opacity: aktivan ? 1 : 0.35 }}
                      >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d={putanja} /></svg>
                      </button>
                    );
                    return (
                      <div style={{ position: "absolute", left: 8, right: 8, bottom: 8, display: "flex", justifyContent: "space-between", pointerEvents: "auto" }}>
                        {dugme(!!prethodni, prethodni, "Pomjeri unazad", "M15 18l-6-6 6-6")}
                        {dugme(!!sljedeci, sljedeci, "Pomjeri naprijed", "M9 18l6-6-6-6")}
                      </div>
                    );
                  })()}
                </div>
                <div style={{ padding: "10px 12px 12px" }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: "#0F222B", marginBottom: 6, lineHeight: 1.25 }}>{r.naziv}</div>
                  <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                    <CategoryTag label={r.kategorija} />
                    <span style={{ color: "#8A8578", fontSize: 11.5 }}>{(r.sastojci || []).length} sastojaka</span>
                    {(() => {
                      const c = receptCijena(r, cjenovnik);
                      return c ? (
                        <span style={{ color: "#007991", fontSize: 11.5, fontWeight: 700 }}>
                          {c.nepoznato > 0 ? "~" : ""}{fmtEUR(c.ukupno)}
                        </span>
                      ) : null;
                    })()}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {toast && (
        <div
          style={{
            position: "fixed", left: "50%", bottom: "calc(90px + env(safe-area-inset-bottom))", transform: "translateX(-50%)",
            background: toast.type === "error" ? "#B3413E" : "#1F7A52", color: "#fff", padding: "12px 16px", borderRadius: 10,
            fontSize: 13.5, fontWeight: 600, lineHeight: 1.4, textAlign: "center", boxShadow: "0 8px 20px -8px rgba(15,34,43,0.4)",
            zIndex: 10001, maxWidth: "calc(100vw - 32px)", boxSizing: "border-box",
          }}
        >
          {toast.msg}
        </div>
      )}

      {detailRecipe && !form && (
        <RecipeDetailModal
          recipe={detailRecipe}
          cjenovnik={cjenovnik}
          onClose={() => setDetailId(null)}
          onEdit={() => openEditForm(detailRecipe)}
          onDelete={() => deleteRecipe(detailRecipe.id)}
          onAddToCart={() => addIngredientsToShoppingList(detailRecipe)}
          onToggleFavorite={() => toggleFavorite(detailRecipe.id)}
          addingToCart={addingToCart}
        />
      )}

      {form && (
        <RecipeFormModal
          form={form}
          setForm={setForm}
          onSave={saveForm}
          onCancel={closeForm}
          knownCategories={knownCategories}
          cjenovnik={cjenovnik}
          isNew={!recipes.some((r) => r.id === form.id)}
        />
      )}

      {cjenovnikOpen && (
        <CjenovnikModal
          cjenovnik={cjenovnik}
          setCjenovnik={setCjenovnik}
          onClose={() => setCjenovnikOpen(false)}
        />
      )}
    </div>
  );
}

function RecipeDetailModal({ recipe, cjenovnik, onClose, onEdit, onDelete, onAddToCart, onToggleFavorite, addingToCart }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const cijena = receptCijena(recipe, cjenovnik);
  const porcije = Number(recipe.brojPorcija) > 0 ? Number(recipe.brojPorcija) : null;
  return (
    <div
      onClick={onClose}
      style={{ position: "fixed", inset: 0, background: "rgba(15,34,43,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 10000 }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: "#FFFDF8", width: "100%", maxWidth: 480, maxHeight: "90dvh", overflowY: "auto", borderRadius: "18px 18px 0 0", boxShadow: "0 -8px 30px rgba(15,34,43,0.25)" }}
      >
        <div style={{ position: "relative", width: "100%", aspectRatio: "4 / 3", background: "#F0EDE4", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
          <RecipeImage url={recipe.slikaUrl} alt={recipe.naziv} iconSize={48} />
          <button
            type="button"
            aria-label={recipe.omiljen ? "Ukloni iz omiljenih" : "Dodaj u omiljene"}
            onClick={onToggleFavorite}
            style={{ position: "absolute", top: 12, left: 12, width: 36, height: 36, borderRadius: "50%", background: "rgba(255,255,255,0.92)", color: recipe.omiljen ? "#E0555A" : "#8A8578", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 1px 6px rgba(15,34,43,0.2)", padding: 0 }}
          >
            {heartIcon(recipe.omiljen, 19)}
          </button>
          <button
            type="button"
            onClick={onClose}
            style={{ position: "absolute", top: 12, right: 12, width: 32, height: 32, borderRadius: "50%", background: "rgba(15,34,43,0.55)", color: "#fff", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
          >
            {xIcon()}
          </button>
        </div>

        <div style={{ padding: "18px 20px 24px" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, marginBottom: 8 }}>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 21, fontWeight: 600, color: "#0F222B", lineHeight: 1.25 }}>{recipe.naziv}</div>
          </div>
          <div style={{ marginBottom: 16, display: "flex", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <CategoryTag label={recipe.kategorija} />
            {porcije && <span style={{ color: "#8A8578", fontSize: 12.5 }}>{porcije} {porcije === 1 ? "porcija" : "porcije"}</span>}
          </div>

          {cijena && (
            <div style={{ background: "#EAF3F4", border: "1px solid #CADEE1", borderRadius: 12, padding: "12px 14px", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#007991", marginBottom: 10 }}>
                {moneyIcon(14)}
                <span style={{ fontSize: 11.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>Cijena recepta</span>
              </div>
              <div style={{ display: "flex", alignItems: "flex-end", gap: 22, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontSize: 21, fontWeight: 800, color: "#0F222B", lineHeight: 1 }}>
                    {cijena.nepoznato > 0 ? "~" : ""}{fmtEUR(cijena.ukupno)}
                  </div>
                  <div style={{ fontSize: 11, color: "#8A8578", marginTop: 3 }}>ukupno</div>
                </div>
                {porcije && (
                  <div>
                    <div style={{ fontSize: 17, fontWeight: 700, color: "#007991", lineHeight: 1 }}>
                      {cijena.nepoznato > 0 ? "~" : ""}{fmtEUR(cijena.ukupno / porcije)}
                    </div>
                    <div style={{ fontSize: 11, color: "#8A8578", marginTop: 3 }}>po porciji</div>
                  </div>
                )}
              </div>
              {cijena.nepoznato > 0 && (
                <div style={{ color: "#8A8578", fontSize: 11.5, marginTop: 9, lineHeight: 1.4 }}>
                  {cijena.nepoznato} {cijena.nepoznato === 1 ? "sastojak nije uračunat" : "sastojka nisu uračunata"} (nema ih u Cjenovniku)
                </div>
              )}
            </div>
          )}

          {recipe.videoUrl && (
            <a
              href={recipe.videoUrl}
              target="_blank"
              rel="noopener noreferrer"
              style={{ display: "inline-flex", alignItems: "center", gap: 7, background: "#0F222B", color: "#fff", textDecoration: "none", padding: "8px 14px", borderRadius: 9, fontSize: 13, fontWeight: 600, marginBottom: 18 }}
            >
              {playIcon()} Pogledaj video
            </a>
          )}

          <div style={{ marginBottom: 20 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, color: "#0F222B", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.3 }}>Sastojci</div>
            {(recipe.sastojci || []).length === 0 ? (
              <div style={{ color: "#8A8578", fontSize: 13.5 }}>Nema unešenih sastojaka.</div>
            ) : (
              <div>
                {recipe.sastojci.map((s, i) => {
                  const kolicinaText = s.kolicina && s.jedinica ? (s.kolicina + " " + s.jedinica) : "";
                  const cijenaSastojka = sastojakCijena(s, cjenovnik);
                  return (
                    <div
                      key={i}
                      style={{
                        display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12,
                        padding: "8px 0", borderBottom: i < recipe.sastojci.length - 1 ? "1px solid #F0EDE4" : "none",
                      }}
                    >
                      <span style={{ color: "#3A362E", fontSize: 14, lineHeight: 1.4 }}>
                        {kolicinaText && <span style={{ color: "#8A8578", fontWeight: 600 }}>{kolicinaText} </span>}
                        {s.naziv}
                      </span>
                      {cijenaSastojka !== null && (
                        <span style={{ color: "#5B6B70", fontSize: 12.5, fontWeight: 700, flexShrink: 0, whiteSpace: "nowrap" }}>{fmtEUR(cijenaSastojka)}</span>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {recipe.priprema && (
            <div style={{ marginBottom: 22 }}>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: "#0F222B", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.3 }}>Priprema</div>
              <div style={{ color: "#3A362E", fontSize: 14, lineHeight: 1.65, whiteSpace: "pre-wrap" }}>{recipe.priprema}</div>
            </div>
          )}

          <button
            type="button"
            onClick={onAddToCart}
            disabled={addingToCart}
            style={{ width: "100%", background: "#007991", color: "#fff", border: "none", borderRadius: 10, padding: "13px 16px", fontWeight: 700, fontSize: 14.5, cursor: addingToCart ? "default" : "pointer", opacity: addingToCart ? 0.7 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, fontFamily: "inherit", marginBottom: 12 }}
          >
            {cartIcon()} {addingToCart ? "Dodavanje..." : "Dodaj sve sastojke u kupovinu"}
          </button>

          <div style={{ display: "flex", gap: 10 }}>
            <button
              type="button"
              onClick={onEdit}
              style={{ flex: 1, background: "#fff", color: "#0F222B", border: "1px solid #E4DFD3", borderRadius: 10, padding: "10px 12px", fontWeight: 600, fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontFamily: "inherit" }}
            >
              {pencilIcon()} Izmijeni
            </button>
            {!confirmDelete ? (
              <button
                type="button"
                onClick={() => setConfirmDelete(true)}
                style={{ flex: 1, background: "#fff", color: "#B3413E", border: "1px solid #E4DFD3", borderRadius: 10, padding: "10px 12px", fontWeight: 600, fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontFamily: "inherit" }}
              >
                {trashIcon()} Obriši
              </button>
            ) : (
              <button
                type="button"
                onClick={onDelete}
                style={{ flex: 1, background: "#B3413E", color: "#fff", border: "1px solid #B3413E", borderRadius: 10, padding: "10px 12px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit" }}
              >
                Potvrdi brisanje
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function RecipeFormModal({ form, setForm, onSave, onCancel, knownCategories, cjenovnik, isNew }) {
  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const fileInputRef = useRef(null);
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState("");
  const [scanNotice, setScanNotice] = useState(""); // info (ne greška) kad se koristi rezerva bez AI
  const scanInputRef = useRef(null);
  const [listening, setListening] = useState(false);
  const [speechError, setSpeechError] = useState("");
  const recognitionRef = useRef(null);
  // Prati da li KORISNIK želi da diktiranje bude uključeno (razlika od "listening" state-a):
  // Chrome ponekad sam ugasi prepoznavanje poslije par sekundi tišine, čak i kad je continuous
  // uključeno. Kad se to desi, a korisnik nije sam kliknuo "Zaustavi", automatski ga ponovo
  // pokrećemo umjesto da diktiranje samo nestane čim korisnik napravi kraću pauzu.
  const shouldListenRef = useRef(false);

  // Glasovni unos za "Priprema" - koristi ugrađenu Web Speech API funkciju browsera (besplatno,
  // bez posebnog servera/ključa). Najbolje radi u Chrome-u na Androidu; na iPhone-u/Safari-ju
  // radi djelimično, a u nekim browserima uopšte nije podržano - zato uvijek ostaje moguće i
  // ručno kucanje, dugme za mikrofon je samo dodatna opcija. Jezik je hr-HR (hrvatski) jer je to
  // najpouzdaniji izbor za ijekavicu koji Chrome/Google prepoznavanje govora podržava - srpski
  // (sr-RS) prepoznaje na ekavici.
  useEffect(() => {
    return () => {
      shouldListenRef.current = false;
      if (recognitionRef.current) {
        try { recognitionRef.current.stop(); } catch (e) {}
      }
    };
  }, []);

  function startRecognition(SpeechRecognitionCtor) {
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = "hr-HR";
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = (event) => {
      let finalText = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      }
      finalText = finalText.trim();
      if (finalText) {
        setForm((prev) => {
          // Forma je u međuvremenu zatvorena (Sačuvaj/Otkaži/dugme nazad) - prepoznati tekst
          // nema gdje da ide. Bez ove provjere prev je null, čitanje prev.priprema baca grešku
          // usred React-ovog osvježavanja i cijela stranica ostane bijela.
          if (!prev) return prev;
          const existing = prev.priprema || "";
          const sep = existing && !/\s$/.test(existing) ? " " : "";
          return { ...prev, priprema: existing + sep + finalText };
        });
      }
    };
    recognition.onerror = (event) => {
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        setSpeechError("Dozvoli pristup mikrofonu da bi glasovni unos radio.");
        shouldListenRef.current = false;
      } else if (event.error !== "no-speech" && event.error !== "aborted") {
        setSpeechError("Glasovni unos nije uspio. Probaj ponovo.");
        shouldListenRef.current = false;
      }
      // "no-speech"/"aborted" ne gasimo shouldListenRef - to je samo kratka tišina, onend ispod
      // će sam ponovo pokrenuti slušanje ako je korisnik i dalje "uključen".
    };
    recognition.onend = () => {
      if (shouldListenRef.current) {
        try {
          recognition.start();
          return; // ostaje "Slušam..." - nije korisnik zaustavio
        } catch (e) {
          // rijedak slučaj (npr. restart prebrzo) - samo prekini uredno ispod
        }
      }
      setListening(false);
    };
    recognitionRef.current = recognition;
    recognition.start();
  }

  function toggleDictation() {
    if (listening) {
      shouldListenRef.current = false;
      if (recognitionRef.current) recognitionRef.current.stop();
      return;
    }
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionCtor) {
      setSpeechError("Glasovni unos nije podržan u ovom browseru. Probaj u Chrome-u na telefonu.");
      return;
    }
    setSpeechError("");
    shouldListenRef.current = true;
    try {
      startRecognition(SpeechRecognitionCtor);
      setListening(true);
    } catch (e) {
      shouldListenRef.current = false;
      setSpeechError("Glasovni unos nije uspio. Probaj ponovo.");
    }
  }

  function updateField(field, value) {
    setForm((prev) => ({ ...prev, [field]: value }));
  }

  // Pauze (ms) prije svakog sljedećeg pokušaja kad AI javi da je zauzet. Zbir je oko 19 sekundi,
  // što je u praksi dovoljno da prođe kratkotrajni "špic" na Google-ovoj strani. Ranije se
  // odustajalo poslije prvog odgovora, pa je korisnik odmah dobijao poruku o preopterećenju iako
  // bi drugi pokušaj za par sekundi najčešće prošao.
  const SCAN_PAUZE_MS = [3000, 6000, 10000];

  async function handleScanSelected(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // dozvoli ponovni odabir iste slike
    if (!file) return;
    setScanError("");
    setScanNotice("");
    setScanning(true);
    try {
      let r = null;
      let zadnjaGreska = null;
      for (let pokusaj = 0; pokusaj <= SCAN_PAUZE_MS.length; pokusaj++) {
        try {
          r = await scanRecipeFromImage(file);
          zadnjaGreska = null;
          break;
        } catch (greska) {
          zadnjaGreska = greska;
          const imaJos = pokusaj < SCAN_PAUZE_MS.length;
          if (!greska || !greska.ponoviti || !imaJos) break;
          const sekundi = Math.round(SCAN_PAUZE_MS[pokusaj] / 1000);
          setScanNotice(
            "AI je trenutno zauzet. Čekam " + sekundi + " s pa pokušavam ponovo… (" +
            (pokusaj + 2) + "/" + (SCAN_PAUZE_MS.length + 1) + ")"
          );
          await new Promise((res) => setTimeout(res, SCAN_PAUZE_MS[pokusaj]));
        }
      }
      if (zadnjaGreska) throw zadnjaGreska;
      // Ako je recept pročitao REZERVNI AI (glavni je bio nedostupan), reci to otvoreno.
      // Rezervni je slabiji i sklon da "popuni prazninu" kad je slika mutna, pa je bolje da
      // korisnik zna da treba pažljivije da pogleda šta se popunilo prije nego što sačuva.
      setScanNotice(
        r && r.izvor === "rezerva"
          ? "Glavni AI je bio zauzet, pa je recept pročitao rezervni. On je manje pouzdan — dobro provjeri naziv, sastojke i pripremu prije nego sačuvaš."
          : ""
      );
      setForm((prev) => {
        // Forma zatvorena dok je skeniranje trajalo - vidi objašnjenje uz govorni unos gore.
        if (!prev) return prev;
        // Skener vraća sastojke kao običan tekst (npr. "500g brašna") - količina/jedinica se ne
        // pogađaju automatski, korisnik ih po želji naknadno doda radi računanja cijene.
        const sastojci = Array.isArray(r.sastojci) && r.sastojci.length
          ? r.sastojci.map((s) => ({ naziv: String(s), kolicina: "", jedinica: "" }))
          : prev.sastojci;
        return {
          ...prev,
          naziv: r.naziv ? String(r.naziv) : prev.naziv,
          kategorija: r.kategorija ? String(r.kategorija) : prev.kategorija,
          sastojci: sastojci && sastojci.length ? sastojci : [{ naziv: "", kolicina: "", jedinica: "" }],
          priprema: r.priprema ? String(r.priprema) : prev.priprema,
        };
      });
    } catch (err) {
      console.error("AI skener nije uspio, probam lokalno prepoznavanje teksta (bez AI)...", err);
      try {
        const text = await localOcrFromImage(file);
        const cleaned = (text || "").split("\n").map((l) => l.trim()).filter(Boolean).join("\n");
        if (!cleaned) throw new Error("prazno");
        // Ovo je najduža radnja u aplikaciji (prvi put se preuzima i jezički paket), pa je ovdje
        // najvjerovatnije da korisnik u međuvremenu zatvori formu - vidi objašnjenje gore.
        setForm((prev) => (prev ? { ...prev, priprema: prev.priprema ? prev.priprema + "\n" + cleaned : cleaned } : prev));
        setScanNotice("AI trenutno nedostupan, pa je korišćeno osnovno prepoznavanje teksta (bez AI) - manje pouzdano, naročito za rukopis. Tekst je ubačen u „Priprema” ispod; provjeri ga i sam razdvoji sastojke ako treba.");
      } catch (err2) {
        console.error("I lokalno prepoznavanje nije uspjelo", err2);
        setScanError((err && err.message) || "Skeniranje nije uspjelo. Unesi ručno.");
      }
    } finally {
      setScanning(false);
    }
  }

  async function handleFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // omogući ponovni odabir istog fajla ako upload ne uspije
    if (!file) return;
    setUploadError("");
    setUploading(true);
    try {
      const url = await uploadImageToCloudinary(file);
      updateField("slikaUrl", url);
    } catch (err) {
      console.error("Cloudinary upload failed", err);
      setUploadError("Otpremanje slike nije uspjelo. Probaj ponovo ili zalijepi link ručno.");
    } finally {
      setUploading(false);
    }
  }
  function updateSastojak(idx, field, value) {
    setForm((prev) => {
      const next = prev.sastojci.slice();
      next[idx] = { ...next[idx], [field]: value };
      return { ...prev, sastojci: next };
    });
  }
  function removeSastojak(idx) {
    setForm((prev) => {
      const next = prev.sastojci.slice();
      next.splice(idx, 1);
      if (next.length === 0) next.push({ naziv: "", kolicina: "", jedinica: "" });
      return { ...prev, sastojci: next };
    });
  }
  function addSastojak() {
    setForm((prev) => ({ ...prev, sastojci: prev.sastojci.concat([{ naziv: "", kolicina: "", jedinica: "" }]) }));
  }

  const inputStyle = { width: "100%", boxSizing: "border-box", padding: "10px 12px", borderRadius: 9, border: "1px solid #E4DFD3", fontSize: 14, fontFamily: "inherit", color: "#0F222B", background: "#fff" };
  const labelStyle = { fontWeight: 700, fontSize: 12.5, color: "#0F222B", marginBottom: 6, display: "block", textTransform: "uppercase", letterSpacing: 0.3 };
  const cjenovnikNames = Array.from(new Set((cjenovnik || []).map((c) => c.naziv).filter(Boolean))).sort((a, b) => a.localeCompare(b, "sr"));
  const receptCijenaForm = receptCijena(form, cjenovnik);
  const porcijeForm = Number(form.brojPorcija) > 0 ? Number(form.brojPorcija) : null;

  return (
    <div
      onClick={onCancel}
      style={{ position: "fixed", inset: 0, background: "rgba(15,34,43,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 10000 }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: "#FFFDF8", width: "100%", maxWidth: 480, maxHeight: "90dvh", overflowY: "auto", borderRadius: "18px 18px 0 0", boxShadow: "0 -8px 30px rgba(15,34,43,0.25)", padding: "20px 20px 26px" }}
      >
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 600, color: "#0F222B" }}>{isNew ? "Dodaj recept" : "Izmijeni recept"}</div>
          <button
            type="button"
            onClick={onCancel}
            style={{ width: 30, height: 30, borderRadius: "50%", background: "#F0EDE4", color: "#0F222B", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
          >
            {xIcon()}
          </button>
        </div>

        <div style={{ marginBottom: 16, padding: "12px 14px", background: "#EAF3F4", border: "1px solid #CADEE1", borderRadius: 12 }}>
          {scanning ? (
            <div style={{ width: "100%", boxSizing: "border-box", background: "#007991", color: "#fff", borderRadius: 9, padding: "11px 12px", fontWeight: 700, fontSize: 14, opacity: 0.75, fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              {uploadIcon()} Čitam recept sa slike...
            </div>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <label style={{ position: "relative", overflow: "hidden", flex: 1, boxSizing: "border-box", background: "#007991", color: "#fff", borderRadius: 9, padding: "11px 10px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, WebkitTapHighlightColor: "transparent" }}>
                {cameraIcon()} Slikaj
                <input type="file" accept="image/*" capture="environment" onChange={handleScanSelected} style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, border: 0, padding: 0, margin: 0, cursor: "pointer" }} />
              </label>
              <label style={{ position: "relative", overflow: "hidden", flex: 1, boxSizing: "border-box", background: "#007991", color: "#fff", borderRadius: 9, padding: "11px 10px", fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 7, WebkitTapHighlightColor: "transparent" }}>
                {uploadIcon()} Galerija
                <input ref={scanInputRef} type="file" accept="image/*" onChange={handleScanSelected} style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0, border: 0, padding: 0, margin: 0, cursor: "pointer" }} />
              </label>
            </div>
          )}
          <div style={{ color: "#5A6B6E", fontSize: 12, marginTop: 8, lineHeight: 1.4 }}>
„Slikaj" — fotografiši recept kamerom. „Galerija" — izaberi postojeću sliku ili screenshot. Polja se popune sama; provjeri prije nego sačuvaš.
          </div>
          {scanError && <div style={{ color: "#B3413E", fontSize: 12.5, marginTop: 8 }}>{scanError}</div>}
          {scanNotice && <div style={{ color: "#007991", fontSize: 12.5, marginTop: 8, lineHeight: 1.4 }}>{scanNotice}</div>}
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Naziv</label>
          <input type="text" value={form.naziv} onChange={(e) => updateField("naziv", e.target.value)} placeholder="Naziv recepta" style={inputStyle} />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Kategorija</label>
          <AutocompleteInput
            value={form.kategorija}
            onChange={(v) => updateField("kategorija", v)}
            options={knownCategories}
            placeholder="Kategorija (upiši ili izaberi)"
            style={inputStyle}
          />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Slika</label>
          <input type="text" value={form.slikaUrl} onChange={(e) => updateField("slikaUrl", e.target.value)} placeholder="https://... (ili otpremi ispod)" style={inputStyle} />
          <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelected} style={{ display: "none" }} />
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8, flexWrap: "wrap" }}>
            <button
              type="button"
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              disabled={uploading}
              style={{ background: "#F0EDE4", color: "#0F222B", border: "none", borderRadius: 9, padding: "8px 12px", fontWeight: 600, fontSize: 13, cursor: uploading ? "default" : "pointer", fontFamily: "inherit", opacity: uploading ? 0.7 : 1, display: "flex", alignItems: "center", gap: 6 }}
            >
              {uploadIcon()} {uploading ? "Otpremanje..." : "Otpremi sliku"}
            </button>
            {form.slikaUrl && (
              <div style={{ width: 44, height: 44, borderRadius: 8, overflow: "hidden", background: "#F0EDE4", flexShrink: 0 }}>
                <img src={form.slikaUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={(e) => { e.target.style.display = "none"; }} />
              </div>
            )}
          </div>
          {uploadError && <div style={{ color: "#B3413E", fontSize: 12.5, marginTop: 6 }}>{uploadError}</div>}
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Video (URL)</label>
          <input type="text" value={form.videoUrl} onChange={(e) => updateField("videoUrl", e.target.value)} placeholder="https://..." style={inputStyle} />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Broj porcija (opciono)</label>
          <input
            type="number"
            inputMode="numeric"
            min="0"
            value={form.brojPorcija}
            onChange={(e) => updateField("brojPorcija", e.target.value)}
            placeholder="npr. 4"
            style={{ ...inputStyle, width: 90 }}
          />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle}>Sastojci</label>
          <div style={{ color: "#8A8578", fontSize: 12, marginBottom: 8, lineHeight: 1.4 }}>
            Količina i jedinica su opcione - unesi ih da bi se cijena sastojka sama izračunala (ako je namirnica u Cjenovniku).
          </div>
          {form.sastojci.map((s, i) => {
            const cijenaSastojka = sastojakCijena(s, cjenovnik);
            return (
              <div key={i} style={{ marginBottom: 10, paddingBottom: 10, borderBottom: i < form.sastojci.length - 1 ? "1px solid #F0EDE4" : "none" }}>
                <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                  <AutocompleteInput
                    value={s.naziv}
                    onChange={(v) => updateSastojak(i, "naziv", v)}
                    options={cjenovnikNames}
                    placeholder={"Sastojak " + (i + 1)}
                    style={inputStyle}
                  />
                  <button
                    type="button"
                    onClick={() => removeSastojak(i)}
                    style={{ flexShrink: 0, width: 38, borderRadius: 9, border: "1px solid #E4DFD3", background: "#fff", color: "#8A8578", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}
                  >
                    {xIcon()}
                  </button>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <input
                    type="text"
                    inputMode="decimal"
                    value={s.kolicina}
                    onChange={(e) => updateSastojak(i, "kolicina", normalizujBroj(e.target.value))}
                    placeholder="količina"
                    style={{ ...inputStyle, flex: "1 1 0", minWidth: 0, padding: "9px 10px" }}
                  />
                  <UnitDropdown value={s.jedinica} onChange={(v) => updateSastojak(i, "jedinica", v)} />
                  {cijenaSastojka !== null && (
                    <div style={{ color: "#007991", fontSize: 12.5, fontWeight: 700, whiteSpace: "nowrap", marginLeft: "auto", paddingLeft: 8 }}>≈ {fmtEUR(cijenaSastojka)}</div>
                  )}
                </div>
              </div>
            );
          })}
          <button
            type="button"
            onClick={addSastojak}
            style={{ background: "#F0EDE4", color: "#0F222B", border: "none", borderRadius: 9, padding: "8px 12px", fontWeight: 600, fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}
          >
            + Dodaj sastojak
          </button>
          {receptCijenaForm && (
            <div style={{ marginTop: 12, background: "#EAF3F4", border: "1px solid #CADEE1", borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 16, flexWrap: "wrap" }}>
                <div style={{ fontSize: 15, fontWeight: 800, color: "#0F222B" }}>
                  {receptCijenaForm.nepoznato > 0 ? "~" : ""}{fmtEUR(receptCijenaForm.ukupno)}
                  <span style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", marginLeft: 4 }}>ukupno</span>
                </div>
                {porcijeForm && (
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: "#007991" }}>
                    {receptCijenaForm.nepoznato > 0 ? "~" : ""}{fmtEUR(receptCijenaForm.ukupno / porcijeForm)}
                    <span style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", marginLeft: 4 }}>po porciji</span>
                  </div>
                )}
              </div>
              {receptCijenaForm.nepoznato > 0 && (
                <div style={{ fontSize: 11.5, color: "#8A8578", marginTop: 5 }}>
                  {receptCijenaForm.nepoznato} {receptCijenaForm.nepoznato === 1 ? "sastojak nije" : "sastojka nisu"} u cjenovniku
                </div>
              )}
            </div>
          )}
        </div>

        <div style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
            <label style={{ ...labelStyle, marginBottom: 0 }}>Priprema</label>
            <button
              type="button"
              onClick={toggleDictation}
              style={{
                display: "flex", alignItems: "center", gap: 6, border: "none", borderRadius: 999,
                padding: "5px 11px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
                background: listening ? "#B3413E" : "#EAF3F4", color: listening ? "#fff" : "#007991",
              }}
            >
              {micIcon(14)} {listening ? "Zaustavi" : "Izdiktiraj"}
            </button>
          </div>
          <textarea
            value={form.priprema}
            onChange={(e) => updateField("priprema", e.target.value)}
            placeholder="Koraci pripreme..."
            rows={5}
            style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit" }}
          />
          {listening && (
            <div style={{ color: "#007991", fontSize: 12, marginTop: 6, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
              {micIcon(13)} Slušam... izgovori korake pripreme.
            </div>
          )}
          {speechError && <div style={{ color: "#B3413E", fontSize: 12.5, marginTop: 6 }}>{speechError}</div>}
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          <button
            type="button"
            onClick={onCancel}
            style={{ flex: 1, background: "#fff", color: "#0F222B", border: "1px solid #E4DFD3", borderRadius: 10, padding: "12px 12px", fontWeight: 600, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}
          >
            Otkaži
          </button>
          <button
            type="button"
            onClick={onSave}
            style={{ flex: 1, background: "#007991", color: "#fff", border: "none", borderRadius: 10, padding: "12px 12px", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}
          >
            Sačuvaj
          </button>
        </div>
      </div>
    </div>
  );
}

// Cjenovnik - lista namirnica koje se ponavljaju kroz recepte. Ovdje se ne unosi direktno cijena
// po jedinici mjere (npr. €/kg), nego onako kako se stvarno kupuje - npr. "10 jaja = 2,20 €" ili
// "1 kg brašna = 0,55 €" - aplikacija sama izračuna cijenu po jedinici mjere dijeljenjem
// (cijena pakovanja / količina u pakovanju), i to koristi za automatsko računanje cijene recepta.
function CjenovnikModal({ cjenovnik, setCjenovnik, onClose }) {
  // Spisak se poređa po abecedi (nazivu) - lakše je pronaći namirnicu u dužem spisku po slovima nego
  // pamtiti kojim je redom unesena. Prazan red za novi unos ostaje na dnu dok se ne popuni i sačuva -
  // poslije čuvanja i ponovnog otvaranja i on se uklopi na svoje mjesto po abecedi.
  const [rows, setRows] = useState(() =>
    (cjenovnik && cjenovnik.length
      ? cjenovnik
          .map((c) => ({ ...c, kolicina: c.kolicina === undefined || c.kolicina === null || c.kolicina === "" ? 1 : c.kolicina }))
          .sort((a, b) => (a.naziv || "").localeCompare(b.naziv || "", "sr", { sensitivity: "base" }))
      : []
    ).concat([{ naziv: "", kolicina: 1, jedinica: "kg", cijena: "" }])
  );

  const inputStyle = { width: "100%", boxSizing: "border-box", padding: "9px 11px", borderRadius: 9, border: "1px solid #E4DFD3", fontSize: 13.5, fontFamily: "inherit", color: "#0F222B", background: "#fff" };

  // Cijena po jedinici mjere za jedan red (npr. "10 jaja = 2,20€" -> 0,22 €/kom), samo za prikaz -
  // ne čuva se posebno, uvijek se računa iz kolicina+cijena kad zatreba (ovdje i pri računanju
  // cijene recepta), tako korisnik uvijek vidi/uređuje brojeve onako kako ih je i unio.
  function jedinicnaCijena(row) {
    const k = Number(row.kolicina);
    const c = row.cijena === "" || row.cijena === null || row.cijena === undefined ? NaN : Number(row.cijena);
    if (!row.kolicina || !isFinite(k) || k <= 0 || !isFinite(c) || c < 0 || !row.jedinica) return null;
    return c / k;
  }

  function updateRow(idx, field, value) {
    setRows((prev) => {
      const next = prev.slice();
      next[idx] = { ...next[idx], [field]: value };
      return next;
    });
  }
  function removeRow(idx) {
    setRows((prev) => {
      const next = prev.slice();
      next.splice(idx, 1);
      return next;
    });
  }
  function addRow() {
    setRows((prev) => prev.concat([{ naziv: "", kolicina: 1, jedinica: "kg", cijena: "" }]));
  }
  function handleSave() {
    const cleaned = rows
      .map((r) => ({
        naziv: (r.naziv || "").trim(),
        kolicina: r.kolicina === "" || r.kolicina === null || r.kolicina === undefined ? "" : Number(r.kolicina),
        jedinica: r.jedinica || "kg",
        cijena: r.cijena === "" || r.cijena === null || r.cijena === undefined ? "" : Number(r.cijena),
      }))
      .filter((r) => r.naziv && r.kolicina !== "" && isFinite(r.kolicina) && r.kolicina > 0 && r.cijena !== "" && isFinite(r.cijena) && r.cijena >= 0);
    setCjenovnik(cleaned);
    onClose();
  }

  return (
    <div
      onClick={onClose}
      style={{ position: "fixed", inset: 0, background: "rgba(15,34,43,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 10000 }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: "#FFFDF8", width: "100%", maxWidth: 480, maxHeight: "90dvh", overflowY: "auto", borderRadius: "18px 18px 0 0", boxShadow: "0 -8px 30px rgba(15,34,43,0.25)", padding: "20px 20px 26px" }}
      >
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 600, color: "#0F222B" }}>Cjenovnik</div>
          <button
            type="button"
            onClick={onClose}
            style={{ width: 30, height: 30, borderRadius: "50%", background: "#F0EDE4", color: "#0F222B", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
          >
            {xIcon()}
          </button>
        </div>
        <div style={{ color: "#8A8578", fontSize: 12.5, marginBottom: 16, lineHeight: 1.45 }}>
          Unesi kako si stvarno kupio/la - npr. 10 jaja = 2,20 €, ili 1 kg brašna = 0,55 €. Cijena po jedinici mjere se sama izračuna. Naziv mora biti isti kao naziv sastojka u receptu da bi se cijena prepoznala.
        </div>

        {rows.map((r, i) => {
          const jc = jedinicnaCijena(r);
          return (
            <div key={i} style={{ marginBottom: 12, paddingBottom: 12, borderBottom: i < rows.length - 1 ? "1px solid #F0EDE4" : "none" }}>
              <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                <input
                  type="text"
                  value={r.naziv}
                  onChange={(e) => updateRow(i, "naziv", e.target.value)}
                  placeholder="Naziv namirnice"
                  style={inputStyle}
                />
                <button
                  type="button"
                  onClick={() => removeRow(i)}
                  style={{ flexShrink: 0, width: 36, borderRadius: 9, border: "1px solid #E4DFD3", background: "#fff", color: "#8A8578", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}
                >
                  {xIcon()}
                </button>
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <input
                  type="text"
                  inputMode="decimal"
                  value={r.kolicina}
                  onChange={(e) => updateRow(i, "kolicina", normalizujBroj(e.target.value))}
                  placeholder="količina"
                  style={{ ...inputStyle, flex: "1 1 0", minWidth: 0, padding: "9px 10px" }}
                />
                <UnitDropdown value={r.jedinica} onChange={(v) => updateRow(i, "jedinica", v)} />
                <span style={{ color: "#8A8578", fontSize: 13.5, flexShrink: 0 }}>=</span>
                <input
                  type="text"
                  inputMode="decimal"
                  value={r.cijena}
                  onChange={(e) => updateRow(i, "cijena", normalizujBroj(e.target.value))}
                  placeholder="cijena"
                  style={{ ...inputStyle, flex: "1 1 0", minWidth: 0, padding: "9px 10px" }}
                />
                <span style={{ color: "#0F222B", fontSize: 16, fontWeight: 400, flexShrink: 0 }}>€</span>
              </div>
              {jc !== null && (
                <div style={{ color: "#007991", fontSize: 12.5, marginTop: 5, fontWeight: 700 }}>
                  = {fmtEUR(jc)} / {r.jedinica}
                </div>
              )}
            </div>
          );
        })}
        <button
          type="button"
          onClick={addRow}
          style={{ background: "#F0EDE4", color: "#0F222B", border: "none", borderRadius: 9, padding: "8px 12px", fontWeight: 600, fontSize: 13, cursor: "pointer", fontFamily: "inherit", marginBottom: 20 }}
        >
          + Dodaj namirnicu
        </button>

        <div style={{ display: "flex", gap: 10 }}>
          <button
            type="button"
            onClick={onClose}
            style={{ flex: 1, background: "#fff", color: "#0F222B", border: "1px solid #E4DFD3", borderRadius: 10, padding: "12px 12px", fontWeight: 600, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}
          >
            Otkaži
          </button>
          <button
            type="button"
            onClick={handleSave}
            style={{ flex: 1, background: "#007991", color: "#fff", border: "none", borderRadius: 10, padding: "12px 12px", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}
          >
            Sačuvaj
          </button>
        </div>
      </div>
    </div>
  );
}

root.render(<RecipeApp />);
