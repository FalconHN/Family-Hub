  "Food & Groceries": { bg: "#123d2e", text: "#5ce89c", emoji: "🥦" },
  "Home & Furniture": { bg: "#4a1620", text: "#e85c6e", emoji: "🛋️" },

};

const CATEGORY_LIST = Object.keys(CATEGORY_META);

function colorForStore(name) {
  if (!name) return null;
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return STORE_COLORS[Math.abs(hash) % STORE_COLORS.length];
}

function metaForCategory(name) {
  if (!name) return null;
  if (CATEGORY_META[name]) return CATEGORY_META[name];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const c = STORE_COLORS[Math.abs(hash) % STORE_COLORS.length];
  return { ...c, emoji: "🏷️" };
}

function fmtEUR(n) {
  const v = Number.isFinite(n) ? n : 0;
  return "\u20AC" + v.toFixed(2);
}

function Tag({ label, color }) {
  if (!label) return <span style={{ color: "#555", fontSize: 13 }}>—</span>;
  const c = color || { bg: "#2a2a2a", text: "#a8a8a0" };
  return (
    <span
      style={{
        background: c.bg,
        color: c.text,
        fontSize: 12,
        fontWeight: 500,
        padding: "2px 8px",
        borderRadius: 4,
        whiteSpace: "nowrap",
        display: "inline-block",
      }}
    >
      {label}
    </span>
  );
}

function SmartShoppingList() {
  const [items, setItems] = useState(SAMPLE_ITEMS);
  const [favorites, setFavorites] = useState(DEFAULT_FAVORITES);
  const [budget, setBudget] = useState(null);
  const [budgetInput, setBudgetInput] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("all");
  const [hidePurchased, setHidePurchased] = useState(false);
  const [newName, setNewName] = useState("");
  const [editingCell, setEditingCell] = useState(null);
  const [showExport, setShowExport] = useState(false);
  const [copyStatus, setCopyStatus] = useState("");
  const [dragId, setDragId] = useState(null);
  const saveTimer = useRef(null);

  const lastSentItems = useRef(null);
  const lastSentFavorites = useRef(null);
  const lastSentBudget = useRef(null);

  // Live two-way sync via Firestore onSnapshot: any change made by either
  // person (on any device) pushes here in real time.
  useEffect(() => {
    const unsub = sharedDocRef.onSnapshot(
      (snap) => {
        if (snap.exists) {
          const data = snap.data() || {};
          if (typeof data.items === "string" && data.items !== lastSentItems.current) {
            try {
              const parsed = JSON.parse(data.items);
              if (Array.isArray(parsed)) {
                setItems(parsed.map((it, i) => ({ note: "", order: i, ...it })));
              }
            } catch (e) {}
          }
          if (typeof data.favorites === "string" && data.favorites !== lastSentFavorites.current) {
            try {
              const parsed = JSON.parse(data.favorites);
              if (Array.isArray(parsed)) setFavorites(parsed);
            } catch (e) {}
          }
          if (typeof data.budget === "string" && data.budget !== lastSentBudget.current) {
            try {
              const parsed = JSON.parse(data.budget);
              if (typeof parsed === "number" || parsed === null) {
                setBudget(parsed);
                setBudgetInput(parsed === null ? "" : String(parsed));
              }
            } catch (e) {}
          }
        } else {
          // First run ever: seed the shared document with current (sample) data.
          sharedDocRef.set({
            items: JSON.stringify(items),
            favorites: JSON.stringify(favorites),
            budget: JSON.stringify(budget),
          });
        }
        setLoaded(true);
      },
      (err) => {
        console.error("Firestore sync error", err);
        setLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const json = JSON.stringify(items);
      lastSentItems.current = json;
      sharedDocRef.set({ items: json }, { merge: true }).catch((e) => console.error("Failed to save shopping list", e));
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [items, loaded]);

  useEffect(() => {
    if (!loaded) return;
    const json = JSON.stringify(favorites);
    lastSentFavorites.current = json;
    sharedDocRef.set({ favorites: json }, { merge: true }).catch(() => {});
  }, [favorites, loaded]);

  useEffect(() => {
    if (!loaded) return;
    const json = JSON.stringify(budget);
    lastSentBudget.current = json;
    sharedDocRef.set({ budget: json }, { merge: true }).catch(() => {});
  }, [budget, loaded]);

  function updateItem(id, patch) {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));
  }

  function deleteItem(id) {
    setItems((prev) => prev.filter((it) => it.id !== id));
  }

  function addItem(name) {
    const finalName = (name !== undefined ? name : newName).trim();
    if (!finalName) return;
    const id = Date.now().toString() + Math.random().toString(36).slice(2, 6);
    const maxOrder = items.reduce((m, it) => Math.max(m, it.order || 0), 0);
    setItems((prev) => [
      ...prev,
      { id, name: finalName, quantity: 1, store: "", category: "", price: 0, note: "", purchased: false, order: maxOrder + 1 },
    ]);
    if (name === undefined) setNewName("");
  }

  function clearPurchased() {
    setItems((prev) => prev.filter((it) => !it.purchased));
  }

  function toggleFavorite(name) {
    setFavorites((prev) =>
      prev.includes(name) ? prev.filter((f) => f !== name) : [...prev, name]
    );
  }

  function totalCost(it) {
    return (Number(it.quantity) || 0) * (Number(it.price) || 0);
  }

  const visibleItems = hidePurchased ? items.filter((it) => !it.purchased) : items;

  const sortedForAll = [...visibleItems].sort((a, b) => {
    if (!!a.purchased !== !!b.purchased) return a.purchased ? 1 : -1;
    return (a.order || 0) - (b.order || 0);
  });

  const grandTotal = items.reduce((sum, it) => sum + totalCost(it), 0);
  const remainingTotal = items.filter((it) => !it.purchased).reduce((sum, it) => sum + totalCost(it), 0);

  const knownStores = Array.from(
    new Set(["Voli", "Lidl", "Kaufland", "Idea", "Aroma", "Temu", "Okov", "Kips", ...items.map((it) => it.store).filter(Boolean)])
  );
  const knownCategories = Array.from(
    new Set([...CATEGORY_LIST, ...items.map((it) => it.category).filter(Boolean)])
  );

  function groupBy(key) {
    const groups = {};
    visibleItems.forEach((it) => {
      const k = it[key] || "Unassigned";
      if (!groups[k]) groups[k] = [];
      groups[k].push(it);
    });
    return groups;
  }

  const storeTotals = {};
  items.forEach((it) => {
    const k = it.store || "Unassigned";
    storeTotals[k] = (storeTotals[k] || 0) + totalCost(it);
  });

  function buildExportText() {
    const lines = [];
    lines.push("🛒 Smart Shopping List");
    const byStore = {};
    items
      .filter((it) => !it.purchased)
      .forEach((it) => {
        const k = it.store || "Ostalo";
        if (!byStore[k]) byStore[k] = [];
        byStore[k].push(it);
      });
    Object.entries(byStore).forEach(([store, list]) => {
      lines.push("");
      lines.push(`${store}:`);
      list.forEach((it) => {
        const qty = it.quantity ? `${it.quantity}x ` : "";
        const price = it.price ? ` (${fmtEUR(totalCost(it))})` : "";
        lines.push(`- ${qty}${it.name}${price}`);
      });
    });
    lines.push("");
    lines.push(`Ukupno preostalo: ${fmtEUR(remainingTotal)}`);
    return lines.join("\n");
  }

  async function handleCopyExport() {
    const text = buildExportText();
    try {
      await navigator.clipboard.writeText(text);
      setCopyStatus("Kopirano!");
    } catch (e) {
      setCopyStatus("Nije uspjelo kopiranje");
    }
    setTimeout(() => setCopyStatus(""), 2000);
  }

  function handleDragStart(id) {
    setDragId(id);
  }

  function handleDragOver(e, overId) {
    e.preventDefault();
    if (dragId === null || dragId === overId) return;
  }

  function handleDrop(overId) {
    if (dragId === null || dragId === overId) {
      setDragId(null);
      return;
    }
    setItems((prev) => {
      const list = [...prev].sort((a, b) => (a.order || 0) - (b.order || 0));
      const fromIdx = list.findIndex((it) => it.id === dragId);
      const toIdx = list.findIndex((it) => it.id === overId);
      if (fromIdx === -1 || toIdx === -1) return prev;
      const [moved] = list.splice(fromIdx, 1);
      list.splice(toIdx, 0, moved);
      return list.map((it, i) => ({ ...it, order: i }));
    });
    setDragId(null);
  }

  const inputStyle = {
    background: "transparent",
    border: "1px solid transparent",
    color: "#e8e8e6",
    fontSize: 14,
    padding: "2px 4px",
    borderRadius: 4,
    width: "100%",
    outline: "none",
    boxSizing: "border-box",
  };

  const selectStyle = {
    background: "#232323",
    border: "1px solid #333",
    color: "#e8e8e6",
    fontSize: 12,
    padding: "3px 4px",
    borderRadius: 4,
    width: "100%",
    boxSizing: "border-box",
  };

  const ROW_GRID = "24px 36px minmax(140px, 1fr) 60px 110px 150px 80px 90px 140px 32px";
  const ROW_MIN_WIDTH = 860;

  const header = (
    <div
      style={{
        display: "grid",
        gridTemplateColumns: ROW_GRID,
        minWidth: ROW_MIN_WIDTH,
        padding: "6px 8px",
        borderBottom: "1px solid #333",
        color: "#8a8a86",
        fontSize: 12,
        fontWeight: 500,
      }}
    >
      <span></span>
      <span></span>
      <span>Name</span>
      <span>Qty</span>
      <span>Store</span>
      <span>Category</span>
      <span style={{ textAlign: "right" }}>Price</span>
      <span style={{ textAlign: "right" }}>Total</span>
      <span>Note</span>
      <span></span>
    </div>
  );

  const renderRow = (it) => {
    const over = totalCost(it) > HIGH_COST_THRESHOLD;
    const isDragging = dragId === it.id;
    return (
      <div
        key={it.id}
        draggable
        onDragStart={() => handleDragStart(it.id)}
        onDragOver={(e) => handleDragOver(e, it.id)}
        onDrop={() => handleDrop(it.id)}
        onDragEnd={() => setDragId(null)}
        style={{
          display: "grid",
          gridTemplateColumns: ROW_GRID,
          minWidth: ROW_MIN_WIDTH,
          alignItems: "center",
          padding: "7px 8px",
          borderBottom: "1px solid #2a2a2a",
          background: isDragging ? "rgba(35,131,226,0.12)" : over ? "rgba(224,70,70,0.08)" : "transparent",
          fontSize: 14,
          opacity: it.purchased ? 0.55 : 1,
          cursor: "default",
        }}
      >
        <span style={{ color: "#555", cursor: "grab", fontSize: 14, textAlign: "center" }}>⠿</span>
        <input
          type="checkbox"
          checked={!!it.purchased}
          onChange={(e) => updateItem(it.id, { purchased: e.target.checked })}
          style={{ width: 16, height: 16, cursor: "pointer" }}
        />
        <span
          onClick={() => setEditingCell(`name-${it.id}`)}
          style={{
            textDecoration: it.purchased ? "line-through" : "none",
            color: it.purchased ? "#6f6f6c" : "#e8e8e6",
            cursor: "text",
            whiteSpace: "nowrap",
            overflow: "hidden",
            textOverflow: "ellipsis",
          }}
        >
          {editingCell === `name-${it.id}` ? (
            <input
              autoFocus
              defaultValue={it.name}
              onBlur={(e) => {
                updateItem(it.id, { name: e.target.value });
                setEditingCell(null);
              }}
              onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
              style={inputStyle}
            />
          ) : (
            it.name
          )}
        </span>
        <input
          type="number"
          min="0"
          value={it.quantity}
          onChange={(e) => updateItem(it.id, { quantity: e.target.value === "" ? "" : Number(e.target.value) })}
          style={{ ...inputStyle, width: 50, textAlign: "right" }}
        />
        <input
          list="store-options"
          value={it.store || ""}
          placeholder="—"
          onChange={(e) => updateItem(it.id, { store: e.target.value })}
          style={selectStyle}
        />
        <input
          list="category-options"
          value={it.category || ""}
          placeholder="—"
          onChange={(e) => updateItem(it.id, { category: e.target.value })}
          style={selectStyle}
        />
        <input
          type="number"
          min="0"
          step="0.01"
          value={it.price}
          onChange={(e) => updateItem(it.id, { price: e.target.value === "" ? "" : Number(e.target.value) })}
          style={{ ...inputStyle, width: 70, textAlign: "right" }}
        />
        <span style={{ textAlign: "right", color: over ? "#f08a8a" : "#e8e8e6", fontWeight: over ? 600 : 400 }}>
          {fmtEUR(totalCost(it))}
        </span>
        <input
          value={it.note || ""}
          placeholder="napomena..."
          onChange={(e) => updateItem(it.id, { note: e.target.value })}
          style={{ ...inputStyle, color: "#9a9a96", fontSize: 13 }}
        />
        <button
          onClick={() => deleteItem(it.id)}
          title="Delete"
          style={{
            background: "transparent",
            border: "none",
            color: "#6f6f6c",
            cursor: "pointer",
            fontSize: 16,
          }}
        >
          ×
        </button>
      </div>
    );
  };

  const budgetPct = budget && budget > 0 ? Math.min(100, (remainingTotal / budget) * 100) : 0;
  const budgetOver = budget !== null && remainingTotal > budget;

  return (
    <div
      style={{
        background: "#191919",
        minHeight: "100%",
        color: "#e8e8e6",
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif",
      }}
    >
      <datalist id="store-options">
        {knownStores.map((s) => (
          <option key={s} value={s} />
        ))}
      </datalist>
      <datalist id="category-options">
        {knownCategories.map((c) => (
          <option key={c} value={c} />
        ))}
      </datalist>

      <div
        style={{
          height: 160,
          background: "#191919",
          backgroundImage: `url(${BANNER_IMAGE})`,
          backgroundSize: "cover",
          backgroundPosition: "center",
          position: "relative",
        }}
      ></div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: "24px 20px 60px" }}>
        <h1 style={{ fontSize: 34, fontWeight: 700, margin: "0 0 20px" }}>Smart Shopping List</h1>

        <div
          style={{
            background: "#1f3d2e",
            border: "1px solid #2a5a40",
            borderRadius: 8,
            padding: "14px 16px",
            marginBottom: 20,
            fontSize: 14,
            lineHeight: 1.5,
            color: "#c8e8d4",
          }}
        >
          📌 <strong>Smart Shopping List</strong> – Organize items by category, store, quantity, and price. Check items off as you buy them; totals over {fmtEUR(HIGH_COST_THRESHOLD)} are highlighted for quick spotting.
        </div>

        <div
          style={{
            display: "flex",
            flexWrap: "wrap",
            gap: 10,
            alignItems: "center",
            marginBottom: 20,
            background: "#1c1c1c",
            border: "1px solid #2e2e2e",
            borderRadius: 8,
            padding: "10px 14px",
          }}
        >
          <span style={{ fontSize: 13, color: "#a8a8a0" }}>💰 Budžet:</span>
          <input
            type="number"
            min="0"
            step="1"
            value={budgetInput}
            placeholder="npr. 50"
            onChange={(e) => setBudgetInput(e.target.value)}
            onBlur={() => {
              const v = budgetInput === "" ? null : Number(budgetInput);
              setBudget(Number.isFinite(v) ? v : null);
            }}
            onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
            style={{ ...selectStyle, width: 80 }}
          />
          {budget !== null && budget > 0 && (
            <>
              <div style={{ flex: 1, minWidth: 120, height: 8, background: "#2a2a2a", borderRadius: 4, overflow: "hidden" }}>
                <div
                  style={{
                    height: "100%",
                    width: `${budgetPct}%`,
                    background: budgetOver ? "#e04646" : "#2383e2",
                    transition: "width 0.2s",
                  }}
                />
              </div>
              <span style={{ fontSize: 13, color: budgetOver ? "#f08a8a" : "#a8a8a0" }}>
                {fmtEUR(remainingTotal)} / {fmtEUR(budget)}
                {budgetOver ? " ⚠️ preko budžeta" : ""}
              </span>
            </>
          )}
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12, alignItems: "center" }}>
          {[
            { key: "all", label: "All items" },
            { key: "category", label: "By category" },
            { key: "store", label: "By store" },
          ].map((t) => (
            <button
              key={t.key}
              onClick={() => setTab(t.key)}
              style={{
                background: tab === t.key ? "#2a2a2a" : "transparent",
                border: "1px solid #333",
                color: tab === t.key ? "#fff" : "#a8a8a0",
                borderRadius: 6,
                padding: "6px 14px",
                fontSize: 13,
                cursor: "pointer",
              }}
            >
              {t.label}
            </button>
          ))}

          <div style={{ flex: 1 }} />

          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: "#a8a8a0", cursor: "pointer" }}>
            <input type="checkbox" checked={hidePurchased} onChange={(e) => setHidePurchased(e.target.checked)} />
            Sakrij kupljeno
          </label>

          <button
            onClick={clearPurchased}
            style={{
              background: "transparent",
              border: "1px solid #333",
              color: "#a8a8a0",
              borderRadius: 6,
              padding: "6px 12px",
              fontSize: 13,
              cursor: "pointer",
            }}
          >
            🧹 Očisti kupljeno
          </button>

          <button
            onClick={() => setShowExport((s) => !s)}
            style={{
              background: "transparent",
              border: "1px solid #333",
              color: "#a8a8a0",
              borderRadius: 6,
              padding: "6px 12px",
              fontSize: 13,
              cursor: "pointer",
            }}
          >
            📤 Export
          </button>
        </div>

        {showExport && (
          <div
            style={{
              background: "#1c1c1c",
              border: "1px solid #2e2e2e",
              borderRadius: 8,
              padding: 14,
              marginBottom: 16,
            }}
          >
            <textarea
              readOnly
              value={buildExportText()}
              style={{
                width: "100%",
                minHeight: 140,
                background: "#111",
                color: "#e8e8e6",
                border: "1px solid #2e2e2e",
                borderRadius: 6,
                padding: 10,
                fontSize: 13,
                fontFamily: "monospace",
                boxSizing: "border-box",
                resize: "vertical",
              }}
            />
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button
                onClick={handleCopyExport}
                style={{
                  background: "#2383e2",
                  border: "none",
                  color: "#fff",
                  borderRadius: 6,
                  padding: "6px 14px",
                  fontSize: 13,
                  cursor: "pointer",
                }}
              >
                Kopiraj tekst
              </button>
              {copyStatus && <span style={{ fontSize: 13, color: "#a8e8b0", alignSelf: "center" }}>{copyStatus}</span>}
            </div>
          </div>
        )}

        <div
          style={{
            display: "flex",
            flexWrap: "wrap",
            gap: 8,
            marginBottom: 16,
            alignItems: "center",
          }}
        >
          <span style={{ fontSize: 13, color: "#a8a8a0", marginRight: 4 }}>⭐ Favoriti:</span>
          {favorites.map((f) => (
            <button
              key={f}
              onClick={() => addItem(f)}
              title="Dodaj u listu"
              style={{
                background: "#232323",
                border: "1px solid #333",
                color: "#e8e8e6",
                borderRadius: 14,
                padding: "4px 10px 4px 10px",
                fontSize: 12,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                gap: 6,
              }}
            >
              + {f}
              <span
                onClick={(e) => {
                  e.stopPropagation();
                  toggleFavorite(f);
                }}
                title="Ukloni iz favorita"
                style={{ color: "#6f6f6c", fontSize: 13 }}
              >
                ×
              </span>
            </button>
          ))}
          <button
            onClick={() => {
              const name = (newName || "").trim();
              if (name && !favorites.includes(name)) {
                toggleFavorite(name);
              }
            }}
            title="Dodaj trenutni unos u favorite"
            style={{
              background: "transparent",
              border: "1px dashed #444",
              color: "#6f6f6c",
              borderRadius: 14,
              padding: "4px 10px",
              fontSize: 12,
              cursor: "pointer",
            }}
          >
            + sačuvaj kao favorit
          </button>
        </div>

        <div style={{ border: "1px solid #333", borderRadius: 8, overflowX: "auto" }}>
          {tab === "all" && (
            <>
              {header}
              {sortedForAll.map(renderRow)}
            </>
          )}

          {tab === "category" &&
            Object.entries(groupBy("category")).map(([cat, list]) => {
              const meta = metaForCategory(cat === "Unassigned" ? null : cat);
              const groupTotal = list.reduce((s, it) => s + totalCost(it), 0);
              return (
                <div key={cat}>
                  <div
                    style={{
                      padding: "8px 12px",
                      background: "#202020",
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                      minWidth: ROW_MIN_WIDTH,
                      boxSizing: "border-box",
                    }}
                  >
                    <span>{meta ? meta.emoji : "🏷️"}</span>
                    <Tag label={cat} color={meta} />
                    <span style={{ color: "#6f6f6c", fontSize: 12 }}>{list.length} item(s)</span>
                    <span style={{ flex: 1 }} />
                    <span style={{ color: "#8a8a86", fontSize: 12 }}>{fmtEUR(groupTotal)}</span>
                  </div>
                  {header}
                  {list
                    .sort((a, b) => (a.order || 0) - (b.order || 0))
                    .map(renderRow)}
                </div>
              );
            })}

          {tab === "store" &&
            Object.entries(groupBy("store")).map(([store, list]) => {
              const groupTotal = list.reduce((s, it) => s + totalCost(it), 0);
              return (
                <div key={store}>
                  <div
                    style={{
                      padding: "8px 12px",
                      background: "#202020",
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                      minWidth: ROW_MIN_WIDTH,
                      boxSizing: "border-box",
                    }}
                  >
                    <Tag label={store} color={colorForStore(store === "Unassigned" ? null : store)} />
                    <span style={{ color: "#6f6f6c", fontSize: 12 }}>{list.length} item(s)</span>
                    <span style={{ flex: 1 }} />
                    <span style={{ color: "#8a8a86", fontSize: 12 }}>{fmtEUR(groupTotal)}</span>
                  </div>
                  {header}
                  {list
                    .sort((a, b) => (a.order || 0) - (b.order || 0))
                    .map(renderRow)}
                </div>
              );
            })}

          <div style={{ display: "flex", alignItems: "center", padding: "8px 12px", borderTop: "1px solid #2a2a2a", minWidth: ROW_MIN_WIDTH, boxSizing: "border-box" }}>
            <input
              value={newName}
              onChange={(e) => setNewName(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addItem()}
              placeholder="+ New item"
              style={{
                background: "transparent",
                border: "none",
                color: "#e8e8e6",
                fontSize: 14,
                outline: "none",
                flex: 1,
              }}
            />
            <button
              onClick={() => addItem()}
              style={{
                background: "#2383e2",
                border: "none",
                color: "#fff",
                borderRadius: 6,
                padding: "5px 12px",
                fontSize: 13,
                cursor: "pointer",
              }}
            >
              Add
            </button>
          </div>

          <div
            style={{
              display: "flex",
              justifyContent: "flex-end",
              gap: 8,
              padding: "10px 12px",
              borderTop: "1px solid #333",
              background: "#1c1c1c",
              fontSize: 13,
              color: "#a8a8a0",
              minWidth: ROW_MIN_WIDTH,
              boxSizing: "border-box",
            }}
          >
            <span>SUM (preostalo)</span>
            <span style={{ color: "#fff", fontWeight: 600 }}>{fmtEUR(remainingTotal)}</span>
            <span style={{ marginLeft: 16 }}>SUM (sve)</span>
            <span style={{ color: "#fff", fontWeight: 600 }}>{fmtEUR(grandTotal)}</span>
          </div>
        </div>

        {Object.keys(storeTotals).length > 1 && (
          <div
            style={{
              marginTop: 20,
              border: "1px solid #2e2e2e",
              borderRadius: 8,
              padding: "14px 16px",
              background: "#1c1c1c",
            }}
          >
            <div style={{ fontSize: 13, color: "#a8a8a0", marginBottom: 8, fontWeight: 500 }}>
              💵 Trošak po prodavnici
            </div>
            {Object.entries(storeTotals)
              .sort((a, b) => b[1] - a[1])
              .map(([store, total]) => (
                <div
                  key={store}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    padding: "4px 0",
                    fontSize: 13,
                  }}
                >
                  <div style={{ width: 90 }}>
                    <Tag label={store} color={colorForStore(store === "Unassigned" ? null : store)} />
                  </div>
                  <div style={{ flex: 1, height: 6, background: "#2a2a2a", borderRadius: 3, overflow: "hidden" }}>
                    <div
                      style={{
                        height: "100%",
                        width: `${grandTotal > 0 ? (total / grandTotal) * 100 : 0}%`,
                        background: "#2383e2",
                      }}
                    />
                  </div>
                  <span style={{ color: "#e8e8e6", minWidth: 60, textAlign: "right" }}>{fmtEUR(total)}</span>
                </div>
              ))}
          </div>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SmartShoppingList />);
</script>
<script>
  // Manually transform with the classic JSX runtime so Babel does NOT
  // inject an ES "import" statement (which breaks in a plain, non-module script).
  const __src = document.getElementById('app-source-code').textContent;
  const __out = Babel.transform(__src, { presets: [["react", { runtime: "classic" }]] }).code;
  const __script = document.createElement('script');
  __script.textContent = __out;
  document.body.appendChild(__script);
</script>
<script src="nav-bar.js"></script>
</body>
</html>
