  };
  firebase.initializeApp(firebaseConfig);
  // Auth guard: bounce to login page if not signed in.
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    // Djeca imaju pristup samo Rasporedu - ako se nadju ovdje, preusmjeri ih tamo.
    firebase.firestore().collection('users').doc(user.uid).get().then((snap) => {
      const role = (snap.exists && snap.data().role) || 'parent';
      if (role === 'child') {
        window.location.href = "raspored.html";
        return;
      }
      if (typeof window.fhApplyRole === 'function') window.fhApplyRole(role);
    }).catch(() => { /* ako upit ne uspije, ne blokiramo postojeci pristup */ });
  });
  // Odjava - poziva se iz zajednicke nav trake (nav-bar.js).
  window.fhLogout = function () {
    firebase.auth().signOut().catch(() => {}).finally(() => {
      window.location.href = "index.html";
    });
  };
</script>

function colorForStore(name) {
  if (!name) return null;
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return STORE_COLORS[Math.abs(hash) % STORE_COLORS.length];
}

function metaForCategory(name) {
  if (!name) return null;
  if (CATEGORY_META[name]) return CATEGORY_META[name];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const c = STORE_COLORS[Math.abs(hash) % STORE_COLORS.length];
  return { ...c, emoji: "🏷️" };
}

function fmtEUR(n) {
  const v = Number.isFinite(n) ? n : 0;
  return v.toFixed(2).replace(".", ",") + " €";
}

function Tag({ label, color }) {
  if (!label) return <span style={{ color: "#B5AFA0", fontSize: 13 }}>—</span>;
  const c = color || { bg: "#EAE6DC", text: "#8A8578" };
  return (
    <span
      style={{
        background: c.bg,
        color: c.text,
        border: `1px solid ${c.text}33`,
        fontSize: 12,
        fontWeight: 650,
        padding: "3px 8px",
        borderRadius: 6,
        whiteSpace: "nowrap",
        display: "inline-block",
      }}
    >
      {label}
    </span>
  );
}

// Prilagođena (custom) padajuća lista - zamjena za ugrađeni <datalist>, koji na iPhone/Safari-ju
// ne prikazuje ponuđene opcije (kucanje samo po sebi radi, ali se prijedlozi ne pojavljuju).
// Radi identično na desktopu, Android-u i iPhone-u: klik/fokus prikazuje sve opcije, kucanje ih
// filtrira, a slobodno se može upisati i naziv koji nije na listi.
function AutocompleteInput({ value, onChange, options, placeholder, style, onKeyDown, onBlur, autoFocus }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", handleOutside);
    document.addEventListener("touchstart", handleOutside);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      document.removeEventListener("touchstart", handleOutside);
    };
  }, []);

  const q = (value || "").trim().toLowerCase();
  const filtered = q === "" ? options : options.filter((o) => o.toLowerCase().includes(q));

  return (
    <div
      ref={wrapRef}
      style={{
        position: "relative",
        width: style && style.width ? undefined : "100%",
        flex: style && style.flex ? style.flex : undefined,
      }}
    >
      <input
        autoFocus={autoFocus}
        autoComplete="off"
        value={value}
        placeholder={placeholder}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onKeyDown={(e) => {
          if (e.key === "Escape") setOpen(false);
          if (onKeyDown) onKeyDown(e);
        }}
        onBlur={(e) => { setOpen(false); if (onBlur) onBlur(e); }}
        style={{ width: "100%", boxSizing: "border-box", ...style }}
      />
      {open && filtered.length > 0 && (
        <div
          style={{
            position: "absolute",
            top: "100%",
            left: 0,
            right: 0,
            zIndex: 30,
            background: "#fff",
            border: "1px solid #E6E1D8",
            borderRadius: 8,
            marginTop: 3,
            maxHeight: 190,
            overflowY: "auto",
            boxShadow: "0 8px 20px -8px rgba(27,58,74,0.3)",
          }}
        >
          {filtered.map((o) => (
            <div
              key={o}
              onMouseDown={(e) => {
                // sprječava da input izgubi fokus (blur) prije nego što se klik registruje
                e.preventDefault();
                onChange(o);
                setOpen(false);
              }}
              style={{
                padding: "8px 10px",
                fontSize: 13.5,
                color: "#0F222B",
                cursor: "pointer",
              }}
              onMouseEnter={(e) => { e.currentTarget.style.background = "#FAF8F4"; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; }}
            >
              {o}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Track whether we're on a phone-width screen (cards) vs desktop (table).
function useIsMobile(breakpoint = 720) {
  const query = `(max-width: ${breakpoint}px)`;
  const [isMobile, setIsMobile] = useState(
    typeof window !== "undefined" && window.matchMedia
      ? window.matchMedia(query).matches
      : false
  );
  useEffect(() => {
    if (!window.matchMedia) return;
    const mql = window.matchMedia(query);
    const onChange = (e) => setIsMobile(e.matches);
    if (mql.addEventListener) mql.addEventListener("change", onChange);
    else mql.addListener(onChange);
    setIsMobile(mql.matches);
    return () => {
      if (mql.removeEventListener) mql.removeEventListener("change", onChange);
      else mql.removeListener(onChange);
    };
  }, [query]);
  return isMobile;
}

            <div style={{fontSize:11,color:'#7a878c',marginTop:3}}>Limit za ovu kupovinu</div>
          </div>
          <input className="budget-input" type="number" min="0" step="1" value={budgetInput} placeholder="npr. 50 €" onChange={(e)=>setBudgetInput(e.target.value)} onBlur={()=>{const v=budgetInput===""?null:Number(budgetInput);setBudget(Number.isFinite(v)?v:null)}} onKeyDown={(e)=>e.key==='Enter'&&e.target.blur()} />
          {budget!==null&&budget>0&&<><div className="budget-track"><div className="budget-fill" style={{width:`${budgetPct}%`,background:budgetOver?'#c34a43':'#2d8a70'}}/></div><span style={{fontSize:11,color:budgetOver?'#b04741':'#657278',fontWeight:700}}>{fmtEUR(remainingTotal)} / {fmtEUR(budget)}{budgetOver?' · preko budžeta':''}</span></>}
        </div>

        <div className="composer">
          <div className="search-add">
            <span style={{fontSize:18,color:'#839095',marginRight:7}}>＋</span>
            <AutocompleteInput value={newName} options={knownItemNames} onChange={setNewName} onKeyDown={(e)=>e.key==='Enter'&&addItem()} placeholder="Dodaj proizvod…" style={{background:'transparent',border:'none',color:'#17252b',fontSize:15,outline:'none',flex:1}} />
            <button onClick={()=>addItem()} className="primary"><IconPlus/> Dodaj</button>
          </div>

          <div className="detail-row">
            <div className="detail-field"><IconStore/><AutocompleteInput value={newStore} options={knownStores} onChange={setNewStore} placeholder="Prodavnica" style={{background:'transparent',border:'none',fontSize:12,color:'#344b52',flex:1}} /><button className="field-action" onClick={()=>{const v=prompt('Naziv nove prodavnice'); if(v) addCustomStore(v)}}>+ Nova</button></div>
            <div className="detail-field"><IconTag/><AutocompleteInput value={newCategory} options={knownCategories} onChange={setNewCategory} placeholder="Kategorija" style={{background:'transparent',border:'none',fontSize:12,color:'#344b52',flex:1}} /><button className="field-action" onClick={()=>{const v=prompt('Naziv nove kategorije'); if(v) addCustomCategory(v)}}>+ Nova</button></div>
          </div>

          <div className="action-row">
            <button className="action-btn" onClick={()=>setHidePurchased(v=>!v)}><IconCircle checked={hidePurchased} color="#176b76"/><span>{hidePurchased?'Prikaži kupljeno':'Sakrij kupljeno'}</span></button>
            <button className="action-btn" onClick={clearPurchased}><IconBroom/><span>Očisti</span></button>
            <button className="action-btn" onClick={()=>setShowExport(s=>!s)}><IconExport/><span>Export</span></button>
            <button className="action-btn" onClick={()=>setShowManageLabels(s=>!s)}><IconPin/><span>Oznake i boje</span></button>
          </div>
        </div>

        {showManageLabels&&<div className="manage-panel">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{fontSize:15,fontWeight:800,color:'#19363f'}}>Kategorije i prodavnice</div>
            <button className="ghost" onClick={()=>setShowManageLabels(false)}>Zatvori</button>
          </div>
          <div className="manage-grid">
            <div>
              <div className="manage-title"><IconTag/> Kategorije — izaberi boju</div>
              {[...new Set([...CATEGORY_LIST,...customCategories,...items.map(i=>i.category).filter(Boolean)])].filter(cat=>!hiddenCategories.includes(cat)).map(cat=>{
                const meta=resolveCategoryMeta(cat); const open=colorPickerFor===`manage-cat:${cat}`;
                return <div className="manage-item" key={cat}>
                  <button className="color-dot" title="Promijeni boju" onClick={(e)=>{e.stopPropagation();setColorPickerFor(open?null:`manage-cat:${cat}`)}} style={{background:meta.bg}} />
                  <span className="manage-name"><Tag label={cat} color={meta}/></span>
                  <div className="manage-actions">
                    <button type="button" className="manage-icon" title="Uredi kategoriju" aria-label="Uredi kategoriju" onClick={()=>renameCategory(cat)}>✎</button>
                    <button type="button" className="manage-icon danger" title="Izbriši kategoriju" aria-label="Izbriši kategoriju" onClick={()=>deleteCategory(cat)}>×</button>
                  </div>
                  {open&&<div className="palette">{PICKER_COLORS.map(c=><button key={c.bg} style={{background:c.bg}} onClick={()=>{setCategoryColor(cat,c);setColorPickerFor(null)}} />)}</div>}
                </div>
              })}
              <div style={{display:'flex',gap:7,marginTop:8}}><input value={newCategory} onChange={e=>setNewCategory(e.target.value)} placeholder="Nova kategorija" style={{flex:1,border:'1px solid #dce6e2',borderRadius:10,padding:'8px 9px',minWidth:0}}/><button className="primary" onClick={()=>addCustomCategory(newCategory)}>Dodaj</button></div>
            </div>
            <div>
              <div className="manage-title"><IconStore/> Prodavnice — izaberi boju</div>
              {[...new Set([...knownStores])].filter(Boolean).map(store=>{
                const meta=resolveStoreColor(store); const open=colorPickerFor===`manage-store:${store}`;
                return <div className="manage-item" key={store}>
                  <button className="color-dot" title="Promijeni boju" onClick={(e)=>{e.stopPropagation();setColorPickerFor(open?null:`manage-store:${store}`)}} style={{background:meta?meta.bg:'#EAE6DC'}} />
                  <span className="manage-name"><Tag label={store} color={meta}/></span>
                  <div className="manage-actions">
                    <button type="button" className="manage-icon" title="Uredi prodavnicu" aria-label="Uredi prodavnicu" onClick={()=>renameStore(store)}>✎</button>
                    <button type="button" className="manage-icon danger" title="Izbriši prodavnicu" aria-label="Izbriši prodavnicu" onClick={()=>deleteStore(store)}>×</button>
                  </div>
                  {open&&<div className="palette">{PICKER_COLORS.map(c=><button key={c.bg} style={{background:c.bg}} onClick={()=>{setStoreColor(store,c);setColorPickerFor(null)}} />)}</div>}
                </div>
              })}
              <div style={{display:'flex',gap:7,marginTop:8}}><input value={newStore} onChange={e=>setNewStore(e.target.value)} placeholder="Nova prodavnica" style={{flex:1,border:'1px solid #dce6e2',borderRadius:10,padding:'8px 9px',minWidth:0}}/><button className="primary" onClick={()=>addCustomStore(newStore)}>Dodaj</button></div>
            </div>
          </div>
          <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid #edf1ef',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <div style={{flex:1,minWidth:180}}><div style={{fontSize:12,fontWeight:800,color:'#4e646a'}}>Upozorenje za visoku cijenu</div><div style={{fontSize:11,color:'#849196',marginTop:2}}>Ako je prazno, pojedinačne stavke se ne boje crveno.</div></div>
            <input type="number" min="0" step="1" value={priceAlertInput} placeholder="isključeno" onChange={e=>setPriceAlertInput(e.target.value)} onBlur={()=>{const v=priceAlertInput.trim()===''?null:Number(priceAlertInput);setPriceAlertThreshold(Number.isFinite(v)&&v>0?v:null)}} style={{width:100,border:'1px solid #dce6e2',borderRadius:10,padding:'8px 9px'}} />
            <span style={{fontSize:12,color:'#6b7c82'}}>€</span>
          </div>
        </div>}

        <div className="tabs-row">
          {[{key:'all',label:'Sve stavke'},{key:'category',label:'Kategorije'},{key:'store',label:'Prodavnice'}].map(t=><button key={t.key} onClick={()=>setTab(t.key)} className={`tab-btn ${tab===t.key?'active':''}`}>{t.label}</button>)}
          <div className="mini-actions">
            <label><input type="checkbox" checked={hidePurchased} onChange={e=>setHidePurchased(e.target.checked)}/> Sakrij kupljeno</label>
            <button onClick={clearPurchased} className="ghost"><IconBroom/> Očisti</button>
            <button onClick={()=>setShowExport(s=>!s)} className="ghost"><IconExport/> Export</button>
          </div>
        </div>

        {showExport&&<div className="panel" style={{padding:15,marginTop:12}}><textarea readOnly value={buildExportText()} style={{width:'100%',minHeight:140,background:'#f7f9f7',color:'#17252b',border:'1px solid #e1e7e3',borderRadius:11,padding:10,fontSize:13,fontFamily:'monospace',boxSizing:'border-box',resize:'vertical'}}/><div style={{display:'flex',gap:8,marginTop:8}}><button onClick={handleCopyExport} className="primary">Kopiraj tekst</button>{copyStatus&&<span style={{fontSize:13,color:'#287152',alignSelf:'center'}}>{copyStatus}</span>}</div></div>}

        <div className="favorites" style={{marginTop:15}}>
          <span style={{fontSize:12,color:'#748187',fontWeight:700,whiteSpace:'nowrap'}}>⭐ Brzi dodaci</span>
          {favorites.map(f=><button key={f} onClick={()=>addItem(f)} className="favorite-pill">+ {f}<span onClick={e=>{e.stopPropagation();toggleFavorite(f)}} style={{color:'#9aa4a7',marginLeft:4}}>×</span></button>)}
          <button onClick={()=>{const name=(newName||'').trim();if(name&&!favorites.includes(name))toggleFavorite(name)}} className="favorite-pill" style={{borderStyle:'dashed!important'}}>+ sačuvaj unos</button>
        </div>

        <div className="panel list-panel">
          {tab==='all'&&(isMobile?<div>{sortedForAll.map(renderCard)}</div>:<>{header}{sortedForAll.map(renderRow)}</>)}
          {tab==='category'&&isMobile&&Object.entries(groupBy('category')).map(([cat,list])=>{const meta=resolveCategoryMeta(cat==='Unassigned'?null:cat);return <div key={cat}>{renderCardGroupHeader(cat,meta,list,'cat')}{list.sort((a,b)=>(a.order||0)-(b.order||0)).map(renderCard)}</div>})}
          {tab==='category'&&!isMobile&&Object.entries(groupBy('category')).map(([cat,list])=>{const meta=resolveCategoryMeta(cat==='Unassigned'?null:cat);const groupTotal=list.reduce((s,it)=>s+totalCost(it),0);return <div key={cat}><div className="group-header" style={{padding:'12px 14px',display:'flex',alignItems:'center',gap:8,minWidth:ROW_MIN_WIDTH,boxSizing:'border-box'}}><span>{meta?meta.emoji:'🏷️'}</span><Tag label={cat} color={meta}/><span style={{color:'#7d898e',fontSize:12}}>{list.length} stavki</span><span style={{flex:1}}/><span style={{color:'#4d5d63',fontSize:12,fontWeight:650}}>{fmtEUR(groupTotal)}</span></div>{header}{list.sort((a,b)=>(a.order||0)-(b.order||0)).map(renderRow)}</div>})}
          {tab==='store'&&isMobile&&Object.entries(groupBy('store')).map(([store,list])=>{const meta=resolveStoreColor(store==='Unassigned'?null:store);return <div key={store}>{renderCardGroupHeader(store,meta,list,'store')}{list.sort((a,b)=>(a.order||0)-(b.order||0)).map(renderCard)}</div>})}
          {tab==='store'&&!isMobile&&Object.entries(groupBy('store')).map(([store,list])=>{const groupTotal=list.reduce((s,it)=>s+totalCost(it),0);return <div key={store}><div className="group-header" style={{padding:'12px 14px',display:'flex',alignItems:'center',gap:8,minWidth:ROW_MIN_WIDTH,boxSizing:'border-box'}}><Tag label={store} color={resolveStoreColor(store==='Unassigned'?null:store)}/><span style={{color:'#7d898e',fontSize:12}}>{list.length} stavki</span><span style={{flex:1}}/><span style={{color:'#4d5d63',fontSize:12,fontWeight:650}}>{fmtEUR(groupTotal)}</span></div>{header}{list.sort((a,b)=>(a.order||0)-(b.order||0)).map(renderRow)}</div>})}

          <div style={{display:'flex',alignItems:'center',padding:isMobile?'12px 12px':'12px 15px',borderTop:'1px solid #e5ebe7',gap:10,background:'#f7faf8',flexWrap:'wrap'}}>
            <div style={{flex:1,fontSize:12,color:'#748187'}}>Preostalo <strong style={{color:'#17252b',fontSize:14}}>{fmtEUR(remainingTotal)}</strong></div>
            <div style={{fontSize:12,color:'#748187'}}>Ukupno <strong style={{color:'#17252b',fontSize:14}}>{fmtEUR(grandTotal)}</strong></div>
          </div>
        </div>

        {Object.keys(storeTotals).length>1&&<div className="panel secondary-panel"><div className="section-title" style={{display:'flex',alignItems:'center',gap:7}}><IconWallet/> <span>Trošak po prodavnici</span></div>{Object.entries(storeTotals).sort((a,b)=>b[1]-a[1]).map(([store,total])=>{const storeMeta=resolveStoreColor(store==='Unassigned'?null:store);return <div key={store} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 0',fontSize:13}}><div style={{width:100}}><Tag label={store} color={storeMeta}/></div><div style={{flex:1,height:7,background:'#dfe7e3',borderRadius:99,overflow:'hidden'}}><div style={{height:'100%',width:`${grandTotal>0?(total/grandTotal)*100:0}%`,background:storeMeta?.text||'#176b62'}}/></div><span style={{color:'#17252b',minWidth:65,textAlign:'right',fontWeight:650}}>{fmtEUR(total)}</span></div>})}</div>}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SmartShoppingList />);
</script>
<script>
  // Manually transform with the classic JSX runtime so Babel does NOT
  // inject an ES "import" statement (which breaks in a plain, non-module script).
  const __src = document.getElementById('app-source-code').textContent;
  const __out = Babel.transform(__src, { presets: [["react", { runtime: "classic" }]] }).code;
  const __script = document.createElement('script');
  __script.textContent = __out;
  document.body.appendChild(__script);
</script>
<script src="nav-bar.js"></script>
</body>
</html>
