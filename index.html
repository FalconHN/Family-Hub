<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Family Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=3" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png?v=3" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=3" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F5F3EE" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Family Hub" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#F5F3EE; min-height:100%; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color:#0F222B; }
  h1, .brand-title { font-family: 'Fraunces', Georgia, serif; }
  #app { max-width: 420px; margin: 0 auto; padding: 60px 20px; }
  h1 { font-size: 26px; margin-bottom: 6px; }
  p.sub { color: #8A8578; margin-top:0; margin-bottom: 28px; font-size: 14px; }

  .login-wrap { padding-top: 24px; text-align: center; max-width: 380px; margin: 0 auto; }
  .brand-badge {
    width: 220px; height: 220px; border-radius: 34px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px; box-shadow: 0 10px 26px rgba(0,121,145,0.18);
    overflow: hidden;
  }
  .brand-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .login-wrap .sub { text-align: center; margin-bottom: 26px; margin-top: 4px; }
  .login-card {
    background: #FFFFFF; border: 1px solid #E6E1D8; border-radius: 14px;
    padding: 24px; text-align: left; box-shadow: 0 8px 24px rgba(15,34,43,0.06);
  }

  input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 6px;
    border: 1px solid #E6E1D8; background: #F5F3EE; color: #0F222B; font-size: 14px;
  }
  input::placeholder { color: #8A8578; }
  button.primary {
    width: 100%; padding: 10px 12px; border-radius: 6px; border: none;
    background: #007991; color: #fff; font-size: 14px; cursor: pointer; font-weight: 500;
  }
  button.primary:hover { background: #00636F; }
  .error { color: #B0524A; font-size: 13px; margin-bottom: 12px; min-height: 16px; }
  .card {
    border: 1px solid #E6E1D8; border-radius: 10px; padding: 20px; margin-bottom: 14px;
    background: #FFFFFF; cursor: pointer; display:flex; align-items:center; gap:14px;
    text-decoration: none; color: #0F222B; transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(15,34,43,0.04);
  }
  .card:hover { border-color: #007991; box-shadow: 0 4px 14px rgba(15,34,43,0.08); }
  .card.disabled { cursor: default; }
  .card.disabled:hover { border-color: #E6E1D8; box-shadow: 0 2px 8px rgba(15,34,43,0.04); }
  .card.disabled .title, .card.disabled .desc { color: #B7B2A4; }
  .card-icon {
    width: 44px; height: 44px; min-width: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: #DEE9E3; color: #007991;
  }
  .card.disabled .card-icon { background: #F0EDE5; color: #C9C3B5; }
  .card-icon svg { display: block; }
  .card .title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .card .desc { font-size: 13px; color: #8A8578; }
  .soon-badge {
    display: inline-block; margin-left: 8px; font-size: 9px; font-weight: 700;
    background: #D6D1C6; color: #fff; padding: 2px 6px; border-radius: 6px; vertical-align: middle;
  }
  .topbar { display:flex; justify-content: space-between; align-items:center; margin-bottom: 24px; }
  .logout-btn {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; border-radius: 10px;
    border: 1px solid #E6E1D8; background: #FFFFFF; color: #8A8578; cursor: pointer;
  }
  .logout-btn:hover { color: #B0524A; border-color: #E7C9C4; background: #FBF3F2; }
  .logout-btn svg { display: block; }
  .hidden { display: none; }

  /* --- Desktop optimizacija (siri ekrani), isto kao i ostale stranice --- */
  @media (min-width: 900px) {
    #app { max-width: 1120px; }
    h1 { font-size: 30px; }
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(2, auto);
      grid-auto-flow: column;
      gap: 16px;
    }
    .cards-grid .card { margin-bottom: 0; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="login-screen">
    <div class="login-wrap">
      <div class="brand-badge"><img src="icons/login-badge.png" alt="Family Hub" /></div>
      <p class="sub">Uloguj se da pristupiš aplikacijama</p>
      <div class="login-card">
        <div class="error" id="login-error"></div>
        <input type="email" id="email" placeholder="Email" autocomplete="username" />
        <input type="password" id="password" placeholder="Lozinka" autocomplete="current-password" />
        <button class="primary" onclick="doLogin()">Prijava</button>
      </div>
    </div>
  </div>

  <div id="menu-screen" class="hidden">
    <div class="topbar">
      <div>
        <h1 style="margin-bottom:2px;">Family Hub</h1>
        <p class="sub" id="welcome-text" style="margin-bottom:0;"></p>
      </div>
      <button class="logout-btn" onclick="doLogout()" aria-label="Odjava" title="Odjava">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>

    <div class="cards-grid">
    <a class="card" href="shopping-list.html">
      <span class="card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span>
      <div>
        <div class="title">Trgovina</div>
        <div class="desc">Zajednička lista za kupovinu</div>
      </div>
    </a>

    <a class="card" href="recepti.html">
      <span class="card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.042V20a1 1 0 0 0 1 1Z"/><path d="M6 17h12"/></svg></span>
      <div>
        <div class="title">Recepti</div>
        <div class="desc">Moja kuvarska knjiga</div>
      </div>
    </a>

    <a class="card" href="raspored.html" id="cardRaspored">
      <span class="card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="8" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/></svg></span>
      <div>
        <div class="title">Raspored časova</div>
        <div class="desc">Raspored i obaveze</div>
      </div>
    </a>

    <a class="card" href="potrosnja-vode.html">
      <span class="card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></svg></span>
      <div>
        <div class="title">Potrošnja vode</div>
        <div class="desc">Praćenje potrošnje vode - Igalo</div>
      </div>
    </a>

    <!-- Nove aplikacije se dodaju ovdje kao novi .card linkovi (postavi enabled ako je gotova) -->
    </div>

  </div>

</div>

<script>
// ==== PASTE YOUR FIREBASE CONFIG HERE ====
const firebaseConfig = {
  apiKey: "AIzaSyAK9h4XR4ozUsOvkqaVNOnn9PS5XOBizAg",
  authDomain: "family-hub-m.firebaseapp.com",
  projectId: "family-hub-m",
  storageBucket: "family-hub-m.firebasestorage.app",
  messagingSenderId: "267839729754",
  appId: "1:267839729754:web:04625e020a8dcd2e0e6863"
};
firebase.initializeApp(firebaseConfig);

const loginScreen = document.getElementById('login-screen');
const menuScreen = document.getElementById('menu-screen');
const errorBox = document.getElementById('login-error');
const welcomeText = document.getElementById('welcome-text');

function doLogin() {
  errorBox.textContent = "";
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) {
    errorBox.textContent = "Unesi email i lozinku.";
    return;
  }
  firebase.auth().signInWithEmailAndPassword(email, password)
    .catch((err) => {
      errorBox.textContent = "Pogrešan email ili lozinka.";
    });
}

function doLogout() {
  firebase.auth().signOut();
}

document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

function applyRoleToMenu(role) {
  if (role !== "child") return; // roditelji (ili nalozi bez profila) vide sve kartice
  document.querySelectorAll('#menu-screen .card').forEach((card) => {
    if (card.getAttribute('href') !== 'raspored.html') {
      card.style.display = 'none';
    }
  });
}

firebase.auth().onAuthStateChanged((user) => {
  if (user) {
    loginScreen.classList.add('hidden');
    menuScreen.classList.remove('hidden');
    welcomeText.textContent = "Ulogovan/a kao " + user.email;
    firebase.firestore().collection('users').doc(user.uid).get().then((snap) => {
      // Ako profil (users/{uid}) ne postoji, podrazumijevamo "roditelj" da se ne bi
      // slucajno zakljucao postojeci nalog dok se ne doda profil za njega.
      const role = (snap.exists && snap.data().role) || 'parent';
      applyRoleToMenu(role);
    }).catch(() => { /* ako upit ne uspije, ostaje podrazumijevani prikaz (sve kartice) */ });
  } else {
    loginScreen.classList.remove('hidden');
    menuScreen.classList.add('hidden');
  }
});
</script>
</body>
</html>
