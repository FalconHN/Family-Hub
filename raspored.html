<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Public Sans', sans-serif;
    background: #F5F3EE;
    color: #26313A;
    min-height: 100vh;
    padding: 28px 14px 60px;
  }
  .wrap { width: 100%; max-width: 480px; margin: 0 auto; }
  @media (min-width: 900px) {
    .wrap { max-width: 1120px; }
    h1 { font-size: 30px; }
    .cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .cards-row .card { margin-top: 0 !important; }
  }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 700; color: #0F222B; letter-spacing: -0.02em; }
  .sub { color: #8A8578; font-size: 13.5px; margin-top: 2px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .header-left { display: flex; align-items: center; gap: 10px; }

  .tabs-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .tab-pill {
    flex: 0 0 auto; padding: 8px 16px; border-radius: 999px; border: 1px solid #E6E1D8;
    background: #fff; color: #8A8578; font-weight: 600; font-size: 13.5px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .tab-pill.active { background: #007991; border-color: #007991; color: #fff; }

  .day-select-row { display: flex; align-items: center; gap: 8px; margin-top: 0; margin-bottom: 12px; }
  .day-select-row .day-select-label { font-size: 12.5px; font-weight: 700; color: #8A8578; white-space: nowrap; }
  .day-select-row select.day-select {
    flex: 0 0 auto; min-width: 150px; border: 1px solid #E6E1D8; border-radius: 9px; padding: 8px 10px;
    font-size: 14px; font-family: inherit; background: #FAF8F4; outline: none; color: #0F222B; font-weight: 600;
  }
  .day-select-row select.day-select:focus { border-color: #007991; }

  .shift-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: #FAF8F4; border: 1px solid #E6E1D8; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px; font-size: 13.5px; color: #8A8578;
  }
  .shift-banner.active-ok { color: #1F7A52; background: #DCEFE3; border-color: #DCEFE3; }
  .shift-banner button {
    background: #007991; color: #fff; border: none; border-radius: 8px; padding: 7px 14px;
    font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .shift-banner button:hover { background: #00636F; }

  .casovi-col { display: flex; flex-direction: column; gap: 12px; }

  .week-grid-card { padding: 16px 12px 14px; }
  .week-grid { display: flex; gap: 10px; overflow-x: auto; padding: 2px 4px 8px; scroll-snap-type: x proximity; }
  .week-day-col { flex: 0 0 128px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; }
  .week-day-header { display: flex; align-items: center; gap: 6px; padding: 2px 2px 6px; border-bottom: 2px solid #F0EDE5; margin-bottom: 2px; }
  .week-day-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .week-day-name { font-weight: 700; font-size: 12.5px; color: #0F222B; white-space: nowrap; }
  .week-day-empty { color: #8A8578; font-size: 12px; padding: 6px 2px; }
  .week-cas-card {
    border-radius: 10px; padding: 9px 10px; cursor: pointer; border-left: 3px solid transparent;
    transition: transform 0.08s ease;
  }
  .week-cas-card:hover { transform: translateY(-1px); }
  .week-cas-card:active { transform: scale(0.97); }
  .week-cas-time { font-size: 11px; font-weight: 700; margin-bottom: 3px; }
  .week-cas-name { font-size: 13px; font-weight: 600; color: #0F222B; line-height: 1.25; }
  .week-cas-room { font-size: 11px; color: #8A8578; margin-top: 3px; }
  @media (min-width: 900px) {
    .week-day-col { flex: 1 1 0; min-width: 0; }
  }

  .detail-overlay {
    position: fixed; inset: 0; background: rgba(15,34,43,0.45); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .detail-modal {
    background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 360px;
    box-shadow: 0 20px 50px -18px rgba(27,58,74,0.35);
  }
  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .detail-title { font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 700; color: #0F222B; }
  .detail-close { background: none; border: none; cursor: pointer; color: #8A8578; padding: 4px; flex: 0 0 auto; }
  .detail-close:hover { color: #0F222B; }
  .detail-prop { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #F0EDE5; font-size: 14px; }
  .detail-prop:last-of-type { border-bottom: none; }
  .detail-prop-label { color: #8A8578; font-weight: 600; }
  .detail-prop-value { color: #0F222B; font-weight: 600; text-align: right; }
  .detail-note-title { font-size: 12px; font-weight: 700; color: #8A8578; text-transform: uppercase; letter-spacing: 0.03em; margin: 14px 0 6px; }
  .detail-note-body { font-size: 14px; color: #0F222B; background: #FAF8F4; border-radius: 10px; padding: 10px 12px; min-height: 20px; line-height: 1.4; }
  .detail-btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .detail-edit-btn, .detail-save-btn {
    flex: 1; background: #007991; color: #fff; border: none; border-radius: 10px; padding: 10px;
    font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .detail-edit-btn:hover, .detail-save-btn:hover { background: #00636F; }
  .detail-delete-btn {
    flex: 1; background: #fff; border: 1px solid #B0524A; color: #B0524A;
    border-radius: 10px; padding: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .detail-delete-btn:hover { background: #FBEEEC; }
  .detail-cancel-btn {
    flex: 0 0 auto; background: none; border: 1px solid #E6E1D8; color: #8A8578; border-radius: 10px;
    padding: 10px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .detail-cancel-btn:hover { border-color: #C9C3B6; color: #0F222B; }
  .detail-edit-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .detail-edit-row input, .detail-field {
    border: 1px solid #E6E1D8; border-radius: 9px; padding: 8px 10px; font-size: 14px;
    font-family: inherit; background: #FAF8F4; outline: none; color: #0F222B;
  }
  .detail-edit-row input { flex: 1; min-width: 0; }
  .detail-field { width: 100%; display: block; margin-top: 8px; }
  .detail-edit-row input:focus, .detail-field:focus { border-color: #007991; }

  .predmet-manage-row { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; flex-basis: 100%; width: 100%; }
  .add-row .manage-link {
    background: none !important; border: none; color: #007991 !important; font-size: 12.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; text-decoration: underline; padding: 4px 0 !important; white-space: nowrap;
  }
  .predmeti-manage-panel {
    background: #FAF8F4; border: 1px solid #E6E1D8; border-radius: 10px; padding: 8px 12px;
    margin-bottom: 12px; flex-basis: 100%; width: 100%;
  }
  .predmeti-manage-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #F0EDE5; }
  .predmeti-manage-row:last-child { border-bottom: none; }
  .predmeti-manage-row .pm-name { flex: 1; font-size: 13.5px; color: #0F222B; }
  .predmeti-manage-row input.pm-edit-input {
    flex: 1; border: 1px solid #007991; border-radius: 7px; padding: 5px 8px; font-size: 13.5px;
    font-family: inherit; outline: none;
  }
  .add-row .pm-icon-btn {
    background: none !important; border: none; cursor: pointer; padding: 4px !important; display: flex;
    align-items: center; color: #8A8578 !important; flex: 0 0 auto;
  }
  .add-row .pm-icon-btn:hover { color: #007991 !important; }
  .add-row .pm-icon-btn.pm-delete:hover { color: #B0524A !important; }
  .predmeti-empty { color: #8A8578; font-size: 13px; padding: 4px 0; }

  .card {
    background: #fff; border-radius: 14px; padding: 16px; margin-top: 12px;
    box-shadow: 0 1px 2px rgba(27,58,74,0.06), 0 8px 20px -10px rgba(27,58,74,0.1);
  }
  .card:first-child { margin-top: 0; }
  .section-title { font-family: 'Fraunces', Georgia, serif; font-size: 17px; font-weight: 700; color: #0F222B; margin-bottom: 10px; }

  .cards-row { margin-top: 12px; }

  .entry-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F0EDE5; }
  .entry-row:last-child { border-bottom: none; }
  .entry-time { display: flex; flex-direction: column; font-weight: 700; color: #007991; font-size: 13.5px; min-width: 92px; }
  .entry-time .cas-broj { font-weight: 700; color: #007991; font-size: 13px; }
  .entry-time .cas-time { font-weight: 500; color: #8A8578; font-size: 12px; margin-top: 1px; }
  .entry-name { flex: 1; color: #0F222B; font-size: 14.5px; }
  .entry-name .entry-sub { display: block; color: #8A8578; font-size: 12px; margin-top: 2px; }
  .entry-name .entry-sub.entry-note { font-style: italic; }

<script>
// ==== Centralni login (isti nalog kao za sve ostale aplikacije, projekat family-hub-m) ====
const firebaseConfig = {
  apiKey: "AIzaSyAK9h4XR4ozUsOvkqaVNOnn9PS5XOBizAg",
  authDomain: "family-hub-m.firebaseapp.com",
  projectId: "family-hub-m",
  storageBucket: "family-hub-m.firebasestorage.app",
  messagingSenderId: "267839729754",
  appId: "1:267839729754:web:04625e020a8dcd2e0e6863"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Odjava - poziva se iz zajednicke nav trake (nav-bar.js).
window.fhLogout = function () {
  auth.signOut().catch(() => {}).finally(() => {
    window.location.href = "index.html";
  });
};

const CHILDREN = [
  { id: "filip", name: "Filip" },
  { id: "jaksa", name: "Jakša" },
  { id: "miljan", name: "Miljan" },
  { id: "relja", name: "Relja" },
];
const DAYS = [
  { key: "pon", label: "Ponedjeljak", short: "Pon", color: "#2F6690" },
  { key: "uto", label: "Utorak", short: "Uto", color: "#5E8B7E" },
  { key: "sre", label: "Srijeda", short: "Sre", color: "#B8895E" },
  { key: "cet", label: "Četvrtak", short: "Čet", color: "#8E6C9E" },
  { key: "pet", label: "Petak", short: "Pet", color: "#007991" },
  { key: "sub", label: "Subota", short: "Sub", color: "#C97B63" },
  { key: "ned", label: "Nedjelja", short: "Ned", color: "#6B7280" },
];
const SMJENE = [
  { key: "prva", label: "Prva smjena" },
  { key: "druga", label: "Druga smjena" },
];

let role = null; // "parent" | "child"
let myChildId = null;
let selectedChildId = CHILDREN[0].id;
let selectedDay = "pon";
let selectedSmjena = "prva"; // koja smjena se trenutno gleda/uredjuje
let smjenaUserOverride = false; // true kad roditelj rucno izabere smjenu za pregled, dok ne promijeni dijete
let scheduleData = null;
let unsubscribeSnapshot = null;
let predmetiList = []; // zapamćeni nazivi predmeta (zajednički za svu djecu), za brzo dodavanje bez kucanja
let unsubscribePredmeti = null;
let predmetiPanelOpen = false; // da li je otvoren panel za uređivanje liste predmeta
let editingPredmet = null; // naziv predmeta koji se trenutno uređuje (preimenovanje) u panelu

function hexToRgba(hex, alpha) {
  const h = (hex || "#8A8578").replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}
function escapeHtml(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function trashIcon() {
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
}
function pencilIcon() {
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
}
function checkIcon() {
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
}
function xIcon() {
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
}

auth.onAuthStateChanged((user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }
  db.collection("users").doc(user.uid).get().then((snap) => {
    const data = snap.exists ? snap.data() : null;
    // Ako profil (users/{uid}) ne postoji, podrazumijevamo "roditelj" - da ne bismo
    // slucajno zakljucali postojece naloge dok se ne doda profil za njih.
    role = (data && data.role) || "parent";
    if (role === "child") {
      myChildId = data.childId;
      if (!myChildId || !CHILDREN.some((c) => c.id === myChildId)) {
        document.getElementById("blockedRoot").style.display = "block";
        return;
      }
      selectedChildId = myChildId;
    }
    if (typeof window.fhApplyRole === "function") window.fhApplyRole(role);
    initUI();
  }).catch(() => {
    role = "parent"; // ako upit ne uspije (npr. offline), ne blokiramo postojeci pristup
    initUI();
  });
});

function initUI() {
  document.getElementById("appRoot").style.display = "block";
  renderChildTabs();
  renderChildLabel();
  renderDaySelectors();
  subscribeToChild(selectedChildId);
  if (role === "parent") subscribePredmeti();
}

// Zajednička (za svu djecu) zapamćena lista predmeta - da se jednom unešen predmet ne kuca ponovo.
function subscribePredmeti() {
  if (unsubscribePredmeti) unsubscribePredmeti();
  unsubscribePredmeti = db.collection("raspored").doc("_predmeti").onSnapshot(
    (snap) => {
      const lista = snap.exists && Array.isArray(snap.data().lista) ? snap.data().lista : [];
      predmetiList = lista.slice().sort((a, b) => a.localeCompare(b, "sr"));
      // Samo osvježi listu/panel predmeta - ne diraj ostatak forme koju roditelj možda kuca.
      refreshPredmetSelectAndPanel("casoviAddRow");
    },
    () => {
      predmetiList = [];
    }
  );
}

function rememberPredmet(naziv) {
  if (!naziv) return;
  db.collection("raspored").doc("_predmeti").set(
    { lista: firebase.firestore.FieldValue.arrayUnion(naziv) },
    { merge: true }
  );
}

// Lista zapamćenih predmeta je samo pomoć za brže dodavanje - uređivanje ove liste
// (brisanje/preimenovanje) NE dira već unešene časove, samo mijenja ponuđene stavke ubuduće.
function overwritePredmetiList(newList) {
  const deduped = [];
  newList.forEach((p) => {
    const t = (p || "").trim();
    if (t && deduped.indexOf(t) === -1) deduped.push(t);
  });
  db.collection("raspored").doc("_predmeti").set({ lista: deduped }, { merge: true });
}

function deletePredmetFromList(naziv) {
  predmetiList = predmetiList.filter((p) => p !== naziv);
  refreshPredmetSelectAndPanel("casoviAddRow");
  overwritePredmetiList(predmetiList);
}

function renamePredmetInList(oldNaziv, newNaziv) {
  const trimmed = (newNaziv || "").trim();
  editingPredmet = null;
  if (!trimmed || trimmed === oldNaziv) {
    refreshPredmetSelectAndPanel("casoviAddRow");
    return;
  }
  predmetiList = predmetiList.map((p) => (p === oldNaziv ? trimmed : p));
  refreshPredmetSelectAndPanel("casoviAddRow");
  overwritePredmetiList(predmetiList);
}

function renderChildTabs() {
  const wrap = document.getElementById("childTabs");
  if (role !== "parent") {
    wrap.style.display = "none";
    return;
  }
  wrap.style.display = "flex";
  wrap.innerHTML = CHILDREN.map((c) =>
    '<button type="button" class="tab-pill' + (c.id === selectedChildId ? " active" : "") + '" data-child="' + c.id + '">' + escapeHtml(c.name) + '</button>'
  ).join("");
  wrap.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedChildId = btn.dataset.child;
      renderChildTabs();
      renderChildLabel();
      subscribeToChild(selectedChildId);
    });
  });
}

function renderChildLabel() {
  const child = CHILDREN.find((c) => c.id === selectedChildId);
  document.getElementById("childLabel").textContent = child ? child.name : "";
}

// Dani se biraju padajućom listom na dva mjesta (u kartici "Dodaj čas" i u kartici "Obaveze")
// umjesto dugmadi - oba mjesta dijele isti selectedDay i ostaju sinhronizovana. Opcije i change
// listener se grade samo jednom po elementu, poslije se samo sinhronizuje izabrana vrijednost.
const DAY_SELECT_TARGETS = ["daySelectCasovi", "daySelectObaveze"];

function renderDaySelectors() {
  DAY_SELECT_TARGETS.forEach((elId) => {
    const selectEl = document.getElementById(elId);
    if (!selectEl) return;
    if (selectEl.dataset.built !== "1") {
      selectEl.innerHTML = DAYS.map((d) => '<option value="' + d.key + '">' + escapeHtml(d.label) + '</option>').join("");
      selectEl.addEventListener("change", () => {
        selectedDay = selectEl.value;
        renderDaySelectors();
        renderLists();
      });
      selectEl.dataset.built = "1";
    }
    selectEl.value = selectedDay;
  });
}

function normalizeScheduleData(raw) {
  if (raw && raw.smjene) {
    return {
      aktivnaSmjena: raw.aktivnaSmjena === "druga" ? "druga" : "prva",
      smjene: {
        prva: raw.smjene.prva || { casovi: {}, obaveze: {} },
        druga: raw.smjene.druga || { casovi: {}, obaveze: {} },
      },
    };
  }
  // Stara struktura (prije uvodjenja smjena), ili nema podataka - prebaci u "prva smjena".
  return {
    aktivnaSmjena: "prva",
    smjene: {
      prva: { casovi: (raw && raw.casovi) || {}, obaveze: (raw && raw.obaveze) || {} },
      druga: { casovi: {}, obaveze: {} },
    },
  };
}

function syncSelectedSmjena() {
  // Dijete uvijek gleda smjenu koju je roditelj postavio kao aktivnu.
  // Roditelj ostaje na smjeni koju je rucno izabrao, dok ne promijeni dijete.
  if (role !== "parent" || !smjenaUserOverride) {
    selectedSmjena = scheduleData.aktivnaSmjena;
  }
}

function subscribeToChild(childId) {
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  scheduleData = null;
  smjenaUserOverride = false;
  renderSmjenaTabs();
  renderShiftBanner();
  renderLists();
  unsubscribeSnapshot = db.collection("raspored").doc(childId).onSnapshot(
    (snap) => {
      scheduleData = normalizeScheduleData(snap.exists ? snap.data() : null);
      syncSelectedSmjena();
      renderSmjenaTabs();
      renderShiftBanner();
      renderLists();
    },
    () => {
      scheduleData = normalizeScheduleData(null);
      syncSelectedSmjena();
      renderSmjenaTabs();
      renderShiftBanner();
      renderLists();
    }
  );
}

function renderSmjenaTabs() {
  const wrap = document.getElementById("smjenaTabs");
  wrap.style.display = "flex";
  if (role === "parent") {
    wrap.innerHTML = SMJENE.map((s) =>
      '<button type="button" class="tab-pill' + (s.key === selectedSmjena ? " active" : "") + '" data-smjena="' + s.key + '">' + s.label + '</button>'
    ).join("");
    wrap.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedSmjena = btn.dataset.smjena;
        smjenaUserOverride = true;
        renderSmjenaTabs();
        renderShiftBanner();
        renderLists();
      });
    });
  } else {
    const current = SMJENE.find((s) => s.key === selectedSmjena);
    wrap.innerHTML = '<span class="tab-pill active" style="cursor:default;">' + (current ? current.label : "") + '</span>';
  }
}

function renderShiftBanner() {
  const el = document.getElementById("shiftBanner");
  if (role !== "parent" || !scheduleData) {
    el.style.display = "none";
    return;
  }
  el.style.display = "flex";
  const child = CHILDREN.find((c) => c.id === selectedChildId);
  const childName = child ? child.name : "";
  const viewingLabel = (SMJENE.find((s) => s.key === selectedSmjena) || {}).label || "";
  if (selectedSmjena === scheduleData.aktivnaSmjena) {
    el.className = "shift-banner active-ok";
    el.innerHTML = '<span>Ovo je trenutno aktivna smjena za ' + escapeHtml(childName) + '.</span>';
  } else {
    el.className = "shift-banner";
    el.innerHTML =
      '<span>' + escapeHtml(childName) + ' trenutno vidi drugu smjenu. Ti uređuješ: ' + escapeHtml(viewingLabel) + '.</span>' +
      '<button type="button" id="activateSmjenaBtn">Aktiviraj ovu smjenu</button>';
    document.getElementById("activateSmjenaBtn").addEventListener("click", activateSelectedSmjena);
  }
}

function activateSelectedSmjena() {
  db.collection("raspored").doc(selectedChildId).set({ aktivnaSmjena: selectedSmjena }, { merge: true });
}

let casoviAddRowContext = null; // "childId|smjena|dan" za koji je forma "Dodaj čas" trenutno izgrađena
let obavezeAddRowContext = null;

function renderLists() {
  renderWeekGrid();
  renderEntryList("obaveze", "obavezeList");

  const addCard = document.getElementById("casoviAddCard");
  if (addCard) addCard.style.display = role === "parent" ? "block" : "none";

  const casoviAddRowEl = document.getElementById("casoviAddRow");
  const obavezeAddRowEl = document.getElementById("obavezeAddRow");

  if (!scheduleData || role !== "parent") {
    if (casoviAddRowEl) casoviAddRowEl.innerHTML = "";
    if (obavezeAddRowEl) obavezeAddRowEl.innerHTML = "";
    casoviAddRowContext = null;
    obavezeAddRowContext = null;
    return;
  }

  const smjenaData = scheduleData.smjene[selectedSmjena] || { casovi: {}, obaveze: {} };
  const casoviEntries = (smjenaData.casovi && smjenaData.casovi[selectedDay]) || [];

  // Forma za dodavanje se NE gradi iznova na svaku sitnicu (npr. promjenu liste predmeta u pozadini) -
  // samo kad se stvarno promijeni dijete/smjena/dan. Time se ne briše ono što roditelj trenutno kuca.
  ensureCasoviAddRowSkeleton(casoviAddRowEl, "casoviAddRow", casoviEntries);
  ensureObavezeAddRowSkeleton(obavezeAddRowEl, "obavezeAddRow", "Vrijeme (npr. 17:00)", "Naziv obaveze");
}

function formatCasTime(e) {
  if (e.od || e.do) {
    return (e.od || "?") + "–" + (e.do || "?");
  }
  return e.vrijeme || ""; // fallback za stavke unešene prije uvodjenja Od/Do polja
}

function nextCasBroj(entries) {
  let max = 0;
  entries.forEach((e) => {
    const n = parseInt(e.broj, 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return String(max + 1);
}

function sortedCasoviIndexed(entries) {
  const indexed = entries.map((e, i) => ({ e: e, i: i }));
  indexed.sort((a, b) => {
    const brA = a.e.broj !== undefined && a.e.broj !== "" && !isNaN(parseFloat(a.e.broj)) ? parseFloat(a.e.broj) : Infinity;
    const brB = b.e.broj !== undefined && b.e.broj !== "" && !isNaN(parseFloat(b.e.broj)) ? parseFloat(b.e.broj) : Infinity;
    if (brA !== brB) return brA - brB;
    return a.i - b.i;
  });
  return indexed;
}

// Sedmični pregled - stubovi po danu (kao sto je uradjeno sa bojama mjerila u potrosnja-vode.html),
// svaki dan ima svoju boju koja se koristi za akcenat kartice i naslov kolone.
function renderWeekGrid() {
  const wrap = document.getElementById("weekGrid");
  if (!wrap) return;
  if (!scheduleData) {
    wrap.innerHTML = '<div class="week-day-empty">Učitavanje...</div>';
    return;
  }

  const smjenaData = scheduleData.smjene[selectedSmjena] || { casovi: {}, obaveze: {} };

  wrap.innerHTML = DAYS.map((d) => {
    const entries = (smjenaData.casovi && smjenaData.casovi[d.key]) || [];
    const indexed = sortedCasoviIndexed(entries);
    const cardsHtml =
      indexed.length === 0
        ? '<div class="week-day-empty">Nema časova.</div>'
        : indexed.map(({ e, i }) => {
            const brojPart = e.broj ? e.broj + ". čas" : "";
            const timePart = formatCasTime(e);
            const timeLine = [brojPart, timePart].filter(Boolean).join(" · ");
            return (
              '<div class="week-cas-card" style="background:' + hexToRgba(d.color, 0.08) + ';border-left-color:' + d.color + ';" data-day="' + d.key + '" data-index="' + i + '">' +
                (timeLine ? '<div class="week-cas-time" style="color:' + d.color + ';">' + escapeHtml(timeLine) + '</div>' : "") +
                '<div class="week-cas-name">' + escapeHtml(e.naziv) + '</div>' +
                (e.ucionica ? '<div class="week-cas-room">' + escapeHtml(e.ucionica) + '</div>' : "") +
              '</div>'
            );
          }).join("");
    return (
      '<div class="week-day-col">' +
        '<div class="week-day-header"><span class="week-day-dot" style="background:' + d.color + ';"></span><span class="week-day-name">' + d.short + '</span></div>' +
        cardsHtml +
      '</div>'
    );
  }).join("");

  wrap.querySelectorAll(".week-cas-card").forEach((card) => {
    card.addEventListener("click", () => openCasDetail(card.dataset.day, parseInt(card.dataset.index, 10)));
  });
}

function openCasDetail(dayKey, idx) {
  renderDetailModal(dayKey, idx, "view");
  document.getElementById("detailOverlay").style.display = "flex";
}

function renderDetailModal(dayKey, idx, mode) {
  const smjenaData = (scheduleData && scheduleData.smjene[selectedSmjena]) || { casovi: {}, obaveze: {} };
  const entries = (smjenaData.casovi && smjenaData.casovi[dayKey]) || [];
  const e = entries[idx];
  const modal = document.getElementById("detailModal");
  if (!e) {
    modal.innerHTML = "";
    return;
  }
  const day = DAYS.find((d) => d.key === dayKey);

  if (mode === "edit" && role === "parent") {
    modal.innerHTML =
      '<div class="detail-header">' +
        '<span class="detail-title">Izmijeni čas</span>' +
        '<button type="button" class="detail-close" id="detailCloseBtn" aria-label="Zatvori">' + xIcon() + '</button>' +
      '</div>' +
      '<div class="detail-edit-row">' +
        '<input type="number" min="1" placeholder="Čas" title="Broj časa" value="' + escapeHtml(e.broj || "") + '" id="detailEdit_broj" />' +
        '<input type="time" title="Od" value="' + escapeHtml(e.od || "") + '" id="detailEdit_od" />' +
        '<input type="time" title="Do" value="' + escapeHtml(e.do || "") + '" id="detailEdit_do" />' +
      '</div>' +
      '<input type="text" class="detail-field" placeholder="Predmet" value="' + escapeHtml(e.naziv || "") + '" id="detailEdit_naziv" />' +
      '<input type="text" class="detail-field" placeholder="Učionica (opciono)" value="' + escapeHtml(e.ucionica || "") + '" id="detailEdit_ucionica" />' +
      '<input type="text" class="detail-field" placeholder="Napomena (opciono)" value="' + escapeHtml(e.napomena || "") + '" id="detailEdit_napomena" />' +
      '<div class="detail-btn-row">' +
        '<button type="button" class="detail-save-btn" id="detailSaveBtn">Sačuvaj</button>' +
        '<button type="button" class="detail-cancel-btn" id="detailCancelBtn">Otkaži</button>' +
      '</div>';

    document.getElementById("detailCloseBtn").addEventListener("click", closeCasDetail);
    document.getElementById("detailCancelBtn").addEventListener("click", () => renderDetailModal(dayKey, idx, "view"));
    document.getElementById("detailSaveBtn").addEventListener("click", () => {
      const naziv = document.getElementById("detailEdit_naziv").value.trim();
      if (!naziv) return;
      const updatedEntry = {
        broj: document.getElementById("detailEdit_broj").value.trim(),
        od: document.getElementById("detailEdit_od").value,
        do: document.getElementById("detailEdit_do").value,
        naziv: naziv,
        ucionica: document.getElementById("detailEdit_ucionica").value.trim(),
        napomena: document.getElementById("detailEdit_napomena").value.trim(),
      };
      rememberPredmet(naziv);
      updateEntryForDay(dayKey, idx, updatedEntry);
      closeCasDetail();
    });
    return;
  }

  const brojPart = e.broj ? e.broj + ". čas" : "";
  const timePart = formatCasTime(e);
  const timeLine = [brojPart, timePart].filter(Boolean).join(" · ") || "–";

  modal.innerHTML =
    '<div class="detail-header">' +
      '<span class="detail-title">' + escapeHtml(e.naziv) + '</span>' +
      '<button type="button" class="detail-close" id="detailCloseBtn" aria-label="Zatvori">' + xIcon() + '</button>' +
    '</div>' +
    '<div class="detail-prop"><span class="detail-prop-label">Dan</span><span class="detail-prop-value">' + escapeHtml(day ? day.label : "") + '</span></div>' +
    '<div class="detail-prop"><span class="detail-prop-label">Vrijeme</span><span class="detail-prop-value">' + escapeHtml(timeLine) + '</span></div>' +
    '<div class="detail-prop"><span class="detail-prop-label">Učionica</span><span class="detail-prop-value">' + (e.ucionica ? escapeHtml(e.ucionica) : "–") + '</span></div>' +
    '<div class="detail-note-title">Napomena</div>' +
    '<div class="detail-note-body">' + (e.napomena ? escapeHtml(e.napomena) : '<span style="color:#8A8578;">Nema napomene.</span>') + '</div>' +
    (role === "parent"
      ? '<div class="detail-btn-row">' +
          '<button type="button" class="detail-edit-btn" id="detailEditBtn">Izmijeni</button>' +
          '<button type="button" class="detail-delete-btn" id="detailDeleteBtn">Obriši</button>' +
        '</div>'
      : "");

  document.getElementById("detailCloseBtn").addEventListener("click", closeCasDetail);
  if (role === "parent") {
    document.getElementById("detailEditBtn").addEventListener("click", () => renderDetailModal(dayKey, idx, "edit"));
    document.getElementById("detailDeleteBtn").addEventListener("click", () => {
      deleteEntryForDay(dayKey, idx);
      closeCasDetail();
    });
  }
}

function closeCasDetail() {
  document.getElementById("detailOverlay").style.display = "none";
}

document.getElementById("detailOverlay").addEventListener("click", (e) => {
  if (e.target.id === "detailOverlay") closeCasDetail();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("detailOverlay").style.display !== "none") {
    closeCasDetail();
  }
});

function deleteEntryForDay(dayKey, index) {
  const smjenaData = (scheduleData && scheduleData.smjene[selectedSmjena]) || { casovi: {}, obaveze: {} };
  const current = (smjenaData.casovi && smjenaData.casovi[dayKey]) || [];
  const updated = current.slice();
  updated.splice(index, 1);
  const payload = { smjene: {} };
  payload.smjene[selectedSmjena] = {};
  payload.smjene[selectedSmjena].casovi = {};
  payload.smjene[selectedSmjena].casovi[dayKey] = updated;
  db.collection("raspored").doc(selectedChildId).set(payload, { merge: true });
}

function updateEntryForDay(dayKey, index, updatedEntry) {
  const smjenaData = (scheduleData && scheduleData.smjene[selectedSmjena]) || { casovi: {}, obaveze: {} };
  const current = (smjenaData.casovi && smjenaData.casovi[dayKey]) || [];
  const updated = current.slice();
  updated[index] = updatedEntry;
  const payload = { smjene: {} };
  payload.smjene[selectedSmjena] = {};
  payload.smjene[selectedSmjena].casovi = {};
  payload.smjene[selectedSmjena].casovi[dayKey] = updated;
  db.collection("raspored").doc(selectedChildId).set(payload, { merge: true });
}

function renderEntryList(field, listElId) {
  const listEl = document.getElementById(listElId);
  const isCasovi = field === "casovi";

  if (!scheduleData) {
    listEl.innerHTML = '<div class="entry-empty">Učitavanje...</div>';
    return;
  }

  const smjenaData = scheduleData.smjene[selectedSmjena] || { casovi: {}, obaveze: {} };
  const entries = (smjenaData[field] && smjenaData[field][selectedDay]) || [];

  // Za casove sortiramo po broju casa radi preglednosti, cuvajuci pravi indeks u nizu (za brisanje).
  const indexed = entries.map((e, i) => ({ e: e, i: i }));
  if (isCasovi) {
    indexed.sort((a, b) => {
      const brA = a.e.broj !== undefined && a.e.broj !== "" && !isNaN(parseFloat(a.e.broj)) ? parseFloat(a.e.broj) : Infinity;
      const brB = b.e.broj !== undefined && b.e.broj !== "" && !isNaN(parseFloat(b.e.broj)) ? parseFloat(b.e.broj) : Infinity;
      if (brA !== brB) return brA - brB;
      return a.i - b.i;
    });
  }

  if (entries.length === 0) {
    listEl.innerHTML = '<div class="entry-empty">Nema unešenih stavki za ovaj dan.</div>';
    return;
  }

  listEl.innerHTML = indexed.map(({ e, i }) => {
    const timeHtml = isCasovi
      ? '<span class="entry-time">' +
          (e.broj ? '<span class="cas-broj">' + escapeHtml(e.broj) + '. čas</span>' : "") +
          (formatCasTime(e) ? '<span class="cas-time">' + escapeHtml(formatCasTime(e)) + '</span>' : "") +
        '</span>'
      : '<span class="entry-time">' + escapeHtml(e.vrijeme) + '</span>';
    const subLines = isCasovi
      ? (e.ucionica ? '<span class="entry-sub">Učionica: ' + escapeHtml(e.ucionica) + '</span>' : "") +
        (e.napomena ? '<span class="entry-sub entry-note">' + escapeHtml(e.napomena) + '</span>' : "")
      : "";
    return (
      '<div class="entry-row">' +
        timeHtml +
        '<span class="entry-name">' + escapeHtml(e.naziv) + subLines + '</span>' +
        (role === "parent" ? '<button type="button" class="entry-del" data-field="' + field + '" data-index="' + i + '" aria-label="Obriši">' + trashIcon() + '</button>' : "") +
      '</div>'
    );
  }).join("");

  if (role === "parent") {
    listEl.querySelectorAll(".entry-del").forEach((btn) => {
      btn.addEventListener("click", () => {
        deleteEntry(btn.dataset.field, parseInt(btn.dataset.index, 10));
      });
    });
  }
}

// Gradi "kostur" forme za dodavanje časa SAMO kad se promijeni kontekst (dijete/smjena/dan) -
// da se ne bi brisalo ono što je roditelj već upisao dok se lista predmeta mijenja u pozadini.
function ensureCasoviAddRowSkeleton(addRowEl, addRowElId, entries) {
  const contextKey = selectedChildId + "|" + selectedSmjena + "|" + selectedDay;
  if (casoviAddRowContext === contextKey && document.getElementById(addRowElId + "_name")) {
    return;
  }

  addRowEl.innerHTML =
    '<div class="predmet-manage-row">' +
      '<button type="button" class="manage-link" id="' + addRowElId + '_toggleManage"></button>' +
    '</div>' +
    '<div id="' + addRowElId + '_managePanelWrap"></div>' +
    '<input type="number" min="1" class="broj-input" placeholder="Čas" title="Broj časa" value="' + escapeHtml(nextCasBroj(entries)) + '" id="' + addRowElId + '_broj" />' +
    '<input type="time" class="od-do-input" title="Od" id="' + addRowElId + '_od" />' +
    '<input type="time" class="od-do-input" title="Do" id="' + addRowElId + '_do" />' +
    '<input type="text" class="name-input" placeholder="Predmet (upiši ili izaberi)" id="' + addRowElId + '_name" list="' + addRowElId + '_predmetOptions" autocomplete="off" />' +
    '<datalist id="' + addRowElId + '_predmetOptions"></datalist>' +
    '<input type="text" class="room-input" placeholder="Učionica (opciono)" id="' + addRowElId + '_ucionica" />' +
    '<input type="text" class="note-input" placeholder="Napomena (opciono)" id="' + addRowElId + '_napomena" />' +
    '<button type="button" class="submit-btn">Dodaj</button>';

  document.getElementById(addRowElId + "_toggleManage").addEventListener("click", () => {
    predmetiPanelOpen = !predmetiPanelOpen;
    editingPredmet = null;
    refreshPredmetSelectAndPanel(addRowElId);
  });

  addRowEl.querySelector(".submit-btn").addEventListener("click", () => addEntry("casovi", addRowElId));
  document.getElementById(addRowElId + "_name").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addEntry("casovi", addRowElId);
  });

  casoviAddRowContext = contextKey;
  refreshPredmetSelectAndPanel(addRowElId);
}

// Osvježava SAMO ponuđene predmete (datalist ispod polja "Predmet") i panel za uređivanje - ne dira
// broj/od/do/predmet/učionicu/napomenu, pa roditelj ne gubi ono što trenutno kuca kad se lista
// predmeta promijeni (npr. sa drugog uređaja). Polje "Predmet" je obično tekstualno polje sa
// datalist-om: klik/kucanje nudi zapamćene predmete, ali se slobodno može upisati i potpuno nov naziv.
function refreshPredmetSelectAndPanel(addRowElId) {
  const datalistEl = document.getElementById(addRowElId + "_predmetOptions");
  if (datalistEl) {
    datalistEl.innerHTML = predmetiList.map((p) => '<option value="' + escapeHtml(p) + '"></option>').join("");
  }

  const toggleBtn = document.getElementById(addRowElId + "_toggleManage");
  if (toggleBtn) toggleBtn.textContent = predmetiPanelOpen ? "Zatvori uređivanje" : "Uredi listu predmeta";

  const wrap = document.getElementById(addRowElId + "_managePanelWrap");
  if (!wrap) return;
  if (!predmetiPanelOpen) {
    wrap.innerHTML = "";
    return;
  }

  wrap.innerHTML =
    '<div class="predmeti-manage-panel">' +
      (predmetiList.length === 0
        ? '<div class="predmeti-empty">Još nema zapamćenih predmeta.</div>'
        : predmetiList.map((p, idx) => {
            if (editingPredmet === p) {
              return (
                '<div class="predmeti-manage-row">' +
                  '<input type="text" class="pm-edit-input" value="' + escapeHtml(p) + '" id="' + addRowElId + '_pmEdit_' + idx + '" />' +
                  '<button type="button" class="pm-icon-btn pm-save" data-old="' + escapeHtml(p) + '" data-input="' + addRowElId + '_pmEdit_' + idx + '" aria-label="Sačuvaj">' + checkIcon() + '</button>' +
                  '<button type="button" class="pm-icon-btn pm-cancel" aria-label="Otkaži">' + xIcon() + '</button>' +
                '</div>'
              );
            }
            return (
              '<div class="predmeti-manage-row">' +
                '<span class="pm-name">' + escapeHtml(p) + '</span>' +
                '<button type="button" class="pm-icon-btn pm-edit" data-name="' + escapeHtml(p) + '" aria-label="Izmijeni">' + pencilIcon() + '</button>' +
                '<button type="button" class="pm-icon-btn pm-delete" data-name="' + escapeHtml(p) + '" aria-label="Obriši">' + trashIcon() + '</button>' +
              '</div>'
            );
          }).join(""))
    + '</div>';

  wrap.querySelectorAll(".pm-edit").forEach((btn) => {
    btn.addEventListener("click", () => {
      editingPredmet = btn.dataset.name;
      refreshPredmetSelectAndPanel(addRowElId);
    });
  });
  wrap.querySelectorAll(".pm-delete").forEach((btn) => {
    btn.addEventListener("click", () => {
      deletePredmetFromList(btn.dataset.name);
    });
  });
  wrap.querySelectorAll(".pm-save").forEach((btn) => {
    btn.addEventListener("click", () => {
      const inputEl = document.getElementById(btn.dataset.input);
      renamePredmetInList(btn.dataset.old, inputEl.value);
    });
  });
  wrap.querySelectorAll(".pm-cancel").forEach((btn) => {
    btn.addEventListener("click", () => {
      editingPredmet = null;
      refreshPredmetSelectAndPanel(addRowElId);
    });
  });
  wrap.querySelectorAll(".pm-edit-input").forEach((input) => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const row = e.target.closest(".predmeti-manage-row");
        const saveBtn = row && row.querySelector(".pm-save");
        if (saveBtn) saveBtn.click();
      } else if (e.key === "Escape") {
        editingPredmet = null;
        refreshPredmetSelectAndPanel(addRowElId);
      }
    });
  });
}

function ensureObavezeAddRowSkeleton(addRowEl, addRowElId, timePlaceholder, namePlaceholder) {
  const contextKey = selectedChildId + "|" + selectedSmjena + "|" + selectedDay;
  if (obavezeAddRowContext === contextKey && document.getElementById(addRowElId + "_name")) {
    return;
  }
  addRowEl.innerHTML =
    '<input type="text" class="time-input" placeholder="' + timePlaceholder + '" id="' + addRowElId + '_time" />' +
    '<input type="text" class="name-input" placeholder="' + namePlaceholder + '" id="' + addRowElId + '_name" />' +
    '<button type="button" class="submit-btn">Dodaj</button>';
  addRowEl.querySelector(".submit-btn").addEventListener("click", () => addEntry("obaveze", addRowElId));
  document.getElementById(addRowElId + "_name").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addEntry("obaveze", addRowElId);
  });
  obavezeAddRowContext = contextKey;
}

function addEntry(field, addRowElId) {
  const nameEl = document.getElementById(addRowElId + "_name");
  const naziv = nameEl.value.trim();
  if (!naziv) return;

  let novaStavka;
  if (field === "casovi") {
    const brojEl = document.getElementById(addRowElId + "_broj");
    const odEl = document.getElementById(addRowElId + "_od");
    const doEl = document.getElementById(addRowElId + "_do");
    const ucionicaEl = document.getElementById(addRowElId + "_ucionica");
    const napomenaEl = document.getElementById(addRowElId + "_napomena");
    novaStavka = {
      broj: brojEl.value.trim(),
      od: odEl.value,
      do: doEl.value,
      naziv: naziv,
      ucionica: ucionicaEl.value.trim(),
      napomena: napomenaEl.value.trim(),
    };
  } else {
    const timeEl = document.getElementById(addRowElId + "_time");
    novaStavka = { vrijeme: timeEl.value.trim(), naziv: naziv };
  }

  const smjenaData = (scheduleData && scheduleData.smjene[selectedSmjena]) || { casovi: {}, obaveze: {} };
  const current = (smjenaData[field] && smjenaData[field][selectedDay]) || [];
  const updated = current.concat([novaStavka]);
  saveField(field, updated);

  // Rucno cistimo polja za sledeci unos (umjesto da se cijela forma ponovo gradi) - tako
  // upis ne nestaje ako u medjuvremenu stigne osvjezenje liste predmeta iz pozadine.
  if (field === "casovi") {
    rememberPredmet(naziv);
    const brojEl = document.getElementById(addRowElId + "_broj");
    if (brojEl) {
      const n = parseInt(brojEl.value, 10);
      brojEl.value = String((isNaN(n) ? 0 : n) + 1);
    }
    const odEl = document.getElementById(addRowElId + "_od");
    if (odEl) odEl.value = "";
    const doEl = document.getElementById(addRowElId + "_do");
    if (doEl) doEl.value = "";
    const ucionicaEl = document.getElementById(addRowElId + "_ucionica");
    if (ucionicaEl) ucionicaEl.value = "";
    const napomenaEl = document.getElementById(addRowElId + "_napomena");
    if (napomenaEl) napomenaEl.value = "";
  } else {
    const timeEl = document.getElementById(addRowElId + "_time");
    if (timeEl) timeEl.value = "";
  }
  nameEl.value = "";
  nameEl.focus();
}

function deleteEntry(field, index) {
  const smjenaData = (scheduleData && scheduleData.smjene[selectedSmjena]) || { casovi: {}, obaveze: {} };
  const current = (smjenaData[field] && smjenaData[field][selectedDay]) || [];
  const updated = current.slice();
  updated.splice(index, 1);
  saveField(field, updated);
}

function saveField(field, updatedDayArray) {
  const payload = { smjene: {} };
  payload.smjene[selectedSmjena] = {};
  payload.smjene[selectedSmjena][field] = {};
  payload.smjene[selectedSmjena][field][selectedDay] = updatedDayArray;
  db.collection("raspored").doc(selectedChildId).set(payload, { merge: true });
}
