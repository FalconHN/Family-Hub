<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Potrošnja vode</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=7" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png?v=7" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=7" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F222B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Potrošnja vode">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Forsira svijetlu temu za nativne kontrole (select padajuće liste) - vidi objašnjenje u raspored.html. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes fhspin { to { transform: rotate(360deg); } }
  body {
    font-family: 'Public Sans', sans-serif;
    background: #F5F3EE;
    color: #26313A;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 14px 60px;
  }
  .wrap { width: 100%; max-width: 480px; }
  @media (min-width: 700px) {
    body { padding-top: 48px; }
    .wrap { max-width: 560px; }
    .card { padding: 18px; }
  }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 700; color: #0F222B; letter-spacing: -0.02em; }
  .logo-row { display: flex; justify-content: center; margin-bottom: 14px; }
  .logo-row img { height: 48px; width: auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    background: #fff; border: 1px solid #E6E1D8; border-radius: 10px;
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #5B6670;
  }
  .tabs { display: flex; gap: 4px; background: #EAE6DC; border-radius: 12px; padding: 4px; margin: 16px 0 18px; }
  .tab {
    flex: 1; padding: 8px 0; border-radius: 9px; border: none; background: transparent;
    color: #8A8578; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .tab.active { background: #fff; color: #0F222B; box-shadow: 0 1px 3px rgba(27,58,74,0.12); }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 9px; border: 1px solid #E6E1D8; background: #fff;
    color: #0F222B; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .nav-btn:disabled { color: #D6D1C6; cursor: default; }
  .month-name { font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 600; color: #0F222B; }
  .period-selects { display: flex; align-items: center; gap: 6px; }
  .period-select {
    font-family: 'Fraunces', Georgia, serif; font-size: 15px; font-weight: 600; color: #0F222B;
    border: 1px solid #E6E1D8; border-radius: 9px; background: #fff; padding: 7px 6px;
    outline: none; cursor: pointer;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 14px;
    box-shadow: 0 1px 2px rgba(27,58,74,0.06), 0 8px 20px -10px rgba(27,58,74,0.1);
  }
  .meter-card { margin-bottom: 12px; }
  .meter-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .meter-name { font-weight: 700; font-size: 14.5px; color: #0F222B; }
  .meter-consumption { font-size: 12.5px; font-weight: 700; }
  .fields { display: flex; gap: 8px; margin-bottom: 10px; }
  .field { flex: 1; }
  .field label { font-size: 11px; color: #8A8578; display: block; margin-bottom: 3px; font-weight: 600; }
  .field input {
    width: 100%; border: 1px solid #E6E1D8; border-radius: 9px; padding: 8px 10px;
    font-size: 14.5px; outline: none; background: #FAF8F4; font-family: inherit;
  }
  .field input:focus { border-color: #007991; }
  .costs-row { display: flex; justify-content: space-between; font-size: 13px; color: #8A8578; }
  .total-row {
    display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; color: #0F222B;
    margin-top: 6px; padding-top: 8px; border-top: 1px solid #F0EDE5;
  }
  .diff-row {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed #E6E1D8;
    font-size: 12.5px; color: #8A8578;
  }
  .diff-row strong.pos { color: #007991; }
  .diff-row strong.neg { color: #B0524A; }
  .overview-card { margin-bottom: 16px; }
  .overview-title { font-size: 13px; font-weight: 700; color: #0F222B; margin-bottom: 8px; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .legend-left { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }
  .legend-name { font-size: 13.5px; font-weight: 600; }
  .legend-total { font-size: 13.5px; font-weight: 700; color: #0F222B; text-align: right; }
  .legend-sub { font-size: 11.5px; color: #8A8578; text-align: right; }
  .status { font-size: 13px; color: #8A8578; margin-bottom: 12px; }
  .status.err { color: #B0524A; }
  .status.ok { color: #5E8B7E; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(27,58,74,0.35);
    display: none; align-items: flex-end; justify-content: center; z-index: 10000;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #F5F3EE; border-radius: 18px 18px 0 0; padding: 20px;
    width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 700; color: #0F222B; }
  .section-label {
    font-size: 12.5px; font-weight: 700; color: #8A8578; text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .rate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .rate-row input {
    width: 90px; border: 1px solid #E6E1D8; border-radius: 8px; padding: 6px 8px;
    text-align: right; background: #fff; font-family: inherit;
  }
  .label-input {
    width: 100%; border: 1px solid #E6E1D8; border-radius: 8px; padding: 8px 10px;
    background: #fff; margin-bottom: 8px; font-family: inherit;
  }
  .save-btn {
    width: 100%; background: #0F222B; color: #fff; border: none; border-radius: 10px;
    padding: 12px 0; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: inherit;
  }
  .close-btn { background: none; border: none; cursor: pointer; color: #8A8578; }
  svg { display: block; }
  #chart { width: 100%; height: 220px; }

  #appRoot { width: 100%; display: flex; justify-content: center; }
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 28px 22px;
    box-shadow: 0 1px 2px rgba(27,58,74,0.06), 0 8px 24px -8px rgba(27,58,74,0.12); }
  .login-logo { display: flex; justify-content: center; margin-bottom: 18px; }
  .login-logo img { height: 40px; width: auto; }
  .login-title { font-family: 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 700; color: #0F222B;
    text-align: center; margin-bottom: 22px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { font-size: 12.5px; color: #8A8578; font-weight: 600; display: block; margin-bottom: 5px; }
  .login-field input { width: 100%; border: 1px solid #E6E1D8; border-radius: 9px; padding: 11px 12px;
    font-size: 15px; outline: none; background: #FAF8F4; font-family: inherit; }
  .login-field input:focus { border-color: #007991; }
  .login-btn { width: 100%; background: #0F222B; color: #fff; border: none; border-radius: 10px;
    padding: 13px 0; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; margin-top: 6px; }
  .login-error { color: #B0524A; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
  .logout-row { text-align: center; margin-top: 14px; }
  .logout-btn { background: none; border: none; color: #8A8578; font-size: 12.5px; text-decoration: underline;
    cursor: pointer; font-family: inherit; }

  /* --- Desktop optimizacija (siri ekrani, npr. kad je bocna nav traka aktivna) --- */
  @media (min-width: 900px) {
    .wrap { max-width: 1120px; }
    .logo-row { justify-content: flex-end; margin-bottom: 20px; }
    .logo-row img { height: 90px; width: auto; max-width: 100%; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>

<div id="appLoading" style="position:fixed; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#F5F3EE; font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <div style="width:34px; height:34px; border:3px solid #DDE7E4; border-top-color:#007991; border-radius:50%; animation:fhspin 0.8s linear infinite;"></div>
  <div style="font-size:14px; font-weight:600; color:#5B6B70;">Učitavanje…</div>
</div>

<div id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="login-title">💧 Potrošnja vode</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username" />
    </div>
    <div class="login-field">
      <label>Lozinka</label>
      <input type="password" id="loginPassword" autocomplete="current-password" />
    </div>
    <button class="login-btn" id="loginBtn">Prijavi se</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appRoot" style="display:none">

function periodInfo(index) {
  const year = START_YEAR + Math.floor(index / 12);
  const month = MONTHS[((index % 12) + 12) % 12];
  return { year, month, key: `${year}-${month}`, label: `${month} ${year}` };

function indexFromKey(key) {
  const m = /^(\d{4})-(.+)$/.exec(key);
  if (!m) return null;
  const year = parseInt(m[1], 10);
  const mi = MONTHS.indexOf(m[2]);
  if (mi === -1) return null;
  return (year - START_YEAR) * 12 + mi;
}

function maxStoredIndex() {
  let max = 0;
  Object.keys(state.months).forEach((k) => {

}

}

function migrateLegacyMonths(months) {

function n(v) {
  if (typeof v === "string") v = v.replace(",", ".");

  return isNaN(x) ? 0 : x;
}
function fmt(v, decimals = 2) { return n(v).toLocaleString("sr-RS", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }

function buildEffectiveMonths(months, meters, count) {
  const effective = {};
  const lastKrajnje = {};
  meters.forEach((m) => (lastKrajnje[m.key] = 0));
  for (let i = 0; i < count; i++) {
    const info = periodInfo(i);
    const raw = months[info.key] || {};
    const monthEff = {};
    meters.forEach((m) => {
      const rawPocetno = raw[m.key]?.pocetno;
      const rawKrajnje = raw[m.key]?.krajnje;
      const hasPocetno = rawPocetno !== undefined && rawPocetno !== "";
      const hasKrajnje = rawKrajnje !== undefined && rawKrajnje !== "";
      const effPocetno = hasPocetno ? n(rawPocetno) : lastKrajnje[m.key];
      const effKrajnje = hasKrajnje ? n(rawKrajnje) : effPocetno;
      monthEff[m.key] = { pocetno: effPocetno, krajnje: effKrajnje };
      lastKrajnje[m.key] = effKrajnje;
    });
    effective[info.key] = monthEff;
  }
  return effective;
}

function computeMonth(monthData, meters, rates) {
  const variableRate = n(rates.vodaVarijabilno) + n(rates.precisavanje) + n(rates.kanalizacijaVarijabilno);
  const fixedRate = n(rates.vodaFiksno) + n(rates.kanalizacijaFiksno);
  const porez = n(rates.porez);
  const consumption = {};
  meters.forEach((m) => {
    const md = monthData?.[m.key] || { pocetno: 0, krajnje: 0 };
    consumption[m.key] = n(md.krajnje) - n(md.pocetno);
  });
  const main = meters.find((m) => m.isMain);
  // The main meter already contains the sub-meters' consumption (they measure a portion of the
  // same flow), so the fixed cost must be split against the main meter's reading alone —
  // summing all meters would double-count and understate everyone's fixed share.
  const mainConsumption = main ? consumption[main.key] : meters.reduce((s, m) => s + consumption[m.key], 0);
  const results = {};
  meters.forEach((m) => {
    const c = consumption[m.key];
    const variableCost = c * variableRate;
    const fixedShare = mainConsumption === 0 ? 0 : (c / mainConsumption) * fixedRate;
    const tax = (variableCost + fixedShare) * (porez / 100);
    const total = (variableCost + fixedShare) * (1 + porez / 100);
    results[m.key] = { consumption: c, variableCost, fixedShare, tax, total };
  });
  let diff = null;
  let diffConsumption = null;
  if (main) {
    const others = meters.filter((m) => !m.isMain);
    diff = results[main.key].total - others.reduce((s, m) => s + results[m.key].total, 0);
    diffConsumption = consumption[main.key] - others.reduce((s, m) => s + consumption[m.key], 0);
  }
  return { results, diff, diffConsumption, totalConsumption: mainConsumption };
}

function renderGodisnje() {
  const yearStartIdx = (overviewYear - START_YEAR) * 12;

  const totals = {};
  state.meters.forEach((m) => (totals[m.key] = { consumption: 0, total: 0 }));

function niceNum(range, round) {
  const safeRange = range > 0 ? range : 1;
  const exponent = Math.floor(Math.log10(safeRange));
  const fraction = safeRange / Math.pow(10, exponent);
  let niceFraction;
  if (round) {
    if (fraction < 1.5) niceFraction = 1;
    else if (fraction < 3) niceFraction = 2;
    else if (fraction < 7) niceFraction = 5;
    else niceFraction = 10;
  } else {
    if (fraction <= 1) niceFraction = 1;
    else if (fraction <= 2) niceFraction = 2;
    else if (fraction <= 5) niceFraction = 5;
    else niceFraction = 10;
  }
  return niceFraction * Math.pow(10, exponent);
}

function niceScale(maxVal, tickCount) {
  if (!maxVal || maxVal <= 0) return { step: 1, niceMax: tickCount };
  const range = niceNum(maxVal, false);
  const step = niceNum(range / tickCount, true);
  const niceMax = Math.max(Math.ceil(maxVal / step) * step, step);
  return { step, niceMax };
}

function drawChart(rows) {
  const el = document.getElementById("chart");
  const w = el.clientWidth || 400, h = 220;
  const padLeft = 30, padRight = 8, padTop = 14, padBottom = 24;
  const chartW = w - padLeft - padRight;
  const chartH = h - padTop - padBottom;

  const mainMeter = state.meters.find((m) => m.isMain) || state.meters[0];
  const values = rows.map((r) => r[mainMeter.key] || 0);
  const rawMax = Math.max(0, ...values);
  const { step, niceMax } = niceScale(rawMax, 4);
  const tickCount = Math.max(1, Math.round(niceMax / step));

  const scaleY = (v) => padTop + chartH - (v / niceMax) * chartH;

  const n = rows.length;
  const slot = chartW / n;
  const barW = Math.max(6, slot * 0.55);

  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;

  // dashed gridlines + y-axis labels
  for (let i = 0; i <= tickCount; i++) {
    const val = i * step;
    const y = scaleY(val);
    svg += `<line x1="${padLeft}" y1="${y}" x2="${w - padRight}" y2="${y}" stroke="#E6E1D8" stroke-width="1" stroke-dasharray="3,3"/>`;
    svg += `<text x="${padLeft - 8}" y="${y + 3}" font-size="9" fill="#8A8578" text-anchor="end">${Math.round(val * 10) / 10}</text>`;
  }

  // bars
  rows.forEach((r, i) => {
    const v = values[i];
    const x = padLeft + i * slot + (slot - barW) / 2;
    const yTop = scaleY(v);
    const yBottom = scaleY(0);
    const rad = Math.min(4, barW / 2);
    if (v > 0) {
      svg += `<path d="M ${x} ${yBottom} L ${x} ${yTop + rad} Q ${x} ${yTop} ${x + rad} ${yTop} L ${x + barW - rad} ${yTop} Q ${x + barW} ${yTop} ${x + barW} ${yTop + rad} L ${x + barW} ${yBottom} Z" fill="#007991"/>`;
    }
    svg += `<text x="${x + barW / 2}" y="${h - 6}" font-size="9" fill="#8A8578" text-anchor="middle">${r.month}</text>`;
  });

  svg += `</svg>`;
  el.innerHTML = svg;
}

function render() {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));

  const active = document.activeElement;
  let focusInfo = null;
  if (active && active.tagName === "INPUT" && active.dataset && active.dataset.meter) {
    focusInfo = {
      meter: active.dataset.meter,
      field: active.dataset.field,
      selStart: active.selectionStart,
    };
  }

  if (tab === "unos") renderUnos();
  else renderGodisnje();

  if (focusInfo) {
    const restored = document.querySelector(`input[data-meter="${focusInfo.meter}"][data-field="${focusInfo.field}"]`);
    if (restored) {
      restored.focus({ preventScroll: true });
      try { restored.setSelectionRange(focusInfo.selStart, focusInfo.selStart); } catch (e) {}
    }
  }
}

  const rateFieldsEl = document.getElementById("rateFields");

    </div>
  `).join("");
  document.getElementById("rate_porez").value = state.rates.porez;
  document.getElementById("rate_currency").value = state.rates.currency;

  const meterLabelsEl = document.getElementById("meterLabels");
  meterLabelsEl.innerHTML = state.meters.map((m) => `
    <input class="label-input" data-meterkey="${m.key}" type="text" value="${m.label}" />
  `).join("");

  modalOverlay.classList.add("open");
}

document.getElementById("saveSettings").onclick = () => {
  RATE_FIELDS.forEach((f) => {
    state.rates[f.key] = document.getElementById(`rate_${f.key}`).value;
  });
  state.rates.porez = document.getElementById("rate_porez").value;
  state.rates.currency = document.getElementById("rate_currency").value;

  document.querySelectorAll("#meterLabels input[data-meterkey]").forEach((inp) => {
    const m = state.meters.find((m) => m.key === inp.dataset.meterkey);
    if (m) m.label = inp.value;
  });

  scheduleSave();
  modalOverlay.classList.remove("open");
  render();
};

// Firestore realtime sync — only starts once the user is signed in
const statusEl = document.getElementById("status");
const appLoadingEl = document.getElementById("appLoading");
let firstSnapshot = true;
let unsubscribeSnapshot = null;

function startApp() {
  if (unsubscribeSnapshot) return; // already running
  unsubscribeSnapshot = onSnapshot(docRef, (snap) => {
    if (snap.exists()) {
      const data = snap.data();
      const incomingRates = { ...DEFAULT_RATES, ...(data.rates || {}) };
      const incomingMeters = data.meters && data.meters.length ? data.meters : DEFAULT_METERS.map(m => ({...m}));
      const { result: incomingMonths, changed } = migrateLegacyMonths(data.months || {});

      if (loaded) {
        const currentStr = JSON.stringify({ rates: state.rates, meters: state.meters, months: state.months });
        const incomingStr = JSON.stringify({ rates: incomingRates, meters: incomingMeters, months: incomingMonths });
        if (currentStr === incomingStr) {
          firstSnapshot = false;
          return;
        }
      }

      state.rates = incomingRates;
      state.meters = incomingMeters;
      state.months = incomingMonths;
      if (changed) setDoc(docRef, state).catch(() => {});
    } else if (firstSnapshot) {
      const seeded = {};
      Object.entries(INITIAL_MONTHS).forEach(([monthName, val]) => { seeded[`${START_YEAR}-${monthName}`] = val; });
      state.months = seeded;
      setDoc(docRef, state).catch(() => {});
    }
    firstSnapshot = false;
    loaded = true;
    statusEl.textContent = "";
    if (appLoadingEl) appLoadingEl.style.display = "none";
    render();
  }, (err) => {
    if (appLoadingEl) appLoadingEl.style.display = "none";
    statusEl.textContent = "Greška pri povezivanju s bazom.";
    statusEl.className = "status err";
  });
}

// Auth UI wiring
const loginScreen = document.getElementById("loginScreen");
const appRoot = document.getElementById("appRoot");
const loginError = document.getElementById("loginError");

function doLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  loginError.textContent = "";
  if (!email || !password) {
    loginError.textContent = "Unesi email i lozinku.";
    return;
  }
  signInWithEmailAndPassword(auth, email, password).catch((err) => {
    loginError.textContent = "Pogrešan email ili lozinka.";
  });
}

document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("loginPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
document.getElementById("logoutBtn").addEventListener("click", () => {
  signOut(authGate).catch(() => {}).finally(() => { window.location.href = "index.html?v=20260821"; });
});
if (!AUTH_ENABLED) document.getElementById("logoutBtn").style.display = "none";

// Odjava - poziva se iz zajednicke nav trake (nav-bar.js). Odjavljuje zajednicku (shared) sesiju.
window.fhLogout = function () {
  signOut(authGate).catch(() => {}).finally(() => {
    window.location.href = "index.html?v=20260821";
  });
};

onAuthStateChanged(auth, (user) => {
  if (!AUTH_ENABLED || user) {
    loginScreen.style.display = "none";
    if (appLoadingEl && !loaded) appLoadingEl.style.display = "flex";
    appRoot.style.display = "flex";
    startApp();
  } else {
    appRoot.style.display = "none";
    loginScreen.style.display = "flex";
  }
});
</script>
