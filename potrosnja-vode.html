<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Potrošnja vode">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Public Sans', sans-serif;
    background: #F5F3EE;
    color: #26313A;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 14px 60px;
  }
  .wrap { width: 100%; max-width: 480px; }
  @media (min-width: 700px) {
    body { padding-top: 48px; }
    .wrap { max-width: 560px; }
    .card { padding: 18px; }
  }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 700; color: #1B3A4B; letter-spacing: -0.02em; }
  .logo-row { display: flex; justify-content: center; margin-bottom: 14px; }
  .logo-row img { height: 48px; width: auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    background: #fff; border: 1px solid #E6E1D8; border-radius: 10px;
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #5B6670;
  }
  .tabs { display: flex; gap: 4px; background: #EAE6DC; border-radius: 12px; padding: 4px; margin: 16px 0 18px; }
  .tab {
    flex: 1; padding: 8px 0; border-radius: 9px; border: none; background: transparent;
    color: #8A8578; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .tab.active { background: #fff; color: #1B3A4B; box-shadow: 0 1px 3px rgba(27,58,74,0.12); }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 9px; border: 1px solid #E6E1D8; background: #fff;
    color: #1B3A4B; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .nav-btn:disabled { color: #D6D1C6; cursor: default; }
  .month-name { font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 600; color: #1B3A4B; }
  .period-selects { display: flex; align-items: center; gap: 6px; }
  .period-select {
    font-family: 'Fraunces', Georgia, serif; font-size: 15px; font-weight: 600; color: #1B3A4B;
    border: 1px solid #E6E1D8; border-radius: 9px; background: #fff; padding: 7px 6px;
    outline: none; cursor: pointer;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 14px;
    box-shadow: 0 1px 2px rgba(27,58,74,0.06), 0 8px 20px -10px rgba(27,58,74,0.1);
  }
  .meter-card { margin-bottom: 12px; }
  .meter-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .meter-name { font-weight: 700; font-size: 14.5px; color: #1B3A4B; }
  .meter-consumption { font-size: 12.5px; font-weight: 700; }
  .fields { display: flex; gap: 8px; margin-bottom: 10px; }
  .field { flex: 1; }
  .field label { font-size: 11px; color: #8A8578; display: block; margin-bottom: 3px; font-weight: 600; }
  .field input {
    width: 100%; border: 1px solid #E6E1D8; border-radius: 9px; padding: 8px 10px;
    font-size: 14.5px; outline: none; background: #FAF8F4; font-family: inherit;
  }
  .field input:focus { border-color: #2F6690; }
  .costs-row { display: flex; justify-content: space-between; font-size: 13px; color: #8A8578; }
  .total-row {
    display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; color: #1B3A4B;
    margin-top: 6px; padding-top: 8px; border-top: 1px solid #F0EDE5;
  }
  .diff-row {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed #E6E1D8;
    font-size: 12.5px; color: #8A8578;
  }
  .diff-row strong.pos { color: #2F6690; }
  .diff-row strong.neg { color: #B0524A; }
  .overview-card { margin-bottom: 16px; }
  .overview-title { font-size: 13px; font-weight: 700; color: #1B3A4B; margin-bottom: 8px; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .legend-left { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }
  .legend-name { font-size: 13.5px; font-weight: 600; }
  .legend-total { font-size: 13.5px; font-weight: 700; color: #1B3A4B; text-align: right; }
  .legend-sub { font-size: 11.5px; color: #8A8578; text-align: right; }
  .status { font-size: 13px; color: #8A8578; margin-bottom: 12px; }
  .status.err { color: #B0524A; }
  .status.ok { color: #5E8B7E; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(27,58,74,0.35);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #F5F3EE; border-radius: 18px 18px 0 0; padding: 20px;
    width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 700; color: #1B3A4B; }
  .section-label {
    font-size: 12.5px; font-weight: 700; color: #8A8578; text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .rate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .rate-row input {
    width: 90px; border: 1px solid #E6E1D8; border-radius: 8px; padding: 6px 8px;
    text-align: right; background: #fff; font-family: inherit;
  }
  .label-input {
    width: 100%; border: 1px solid #E6E1D8; border-radius: 8px; padding: 8px 10px;
    background: #fff; margin-bottom: 8px; font-family: inherit;
  }
  .save-btn {
    width: 100%; background: #1B3A4B; color: #fff; border: none; border-radius: 10px;
    padding: 12px 0; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: inherit;
  }
  .close-btn { background: none; border: none; cursor: pointer; color: #8A8578; }
  svg { display: block; }
  #chart { width: 100%; height: 180px; }

  #appRoot { width: 100%; display: flex; justify-content: center; }
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 28px 22px;
    box-shadow: 0 1px 2px rgba(27,58,74,0.06), 0 8px 24px -8px rgba(27,58,74,0.12); }
  .login-logo { display: flex; justify-content: center; margin-bottom: 18px; }
  .login-logo img { height: 40px; width: auto; }
  .login-title { font-family: 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 700; color: #1B3A4B;
    text-align: center; margin-bottom: 22px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { font-size: 12.5px; color: #8A8578; font-weight: 600; display: block; margin-bottom: 5px; }
  .login-field input { width: 100%; border: 1px solid #E6E1D8; border-radius: 9px; padding: 11px 12px;
    font-size: 15px; outline: none; background: #FAF8F4; font-family: inherit; }
  .login-field input:focus { border-color: #2F6690; }
  .login-btn { width: 100%; background: #1B3A4B; color: #fff; border: none; border-radius: 10px;
    padding: 13px 0; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; margin-top: 6px; }
  .login-error { color: #B0524A; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
  .logout-row { text-align: center; margin-top: 14px; }
  .logout-btn { background: none; border: none; color: #8A8578; font-size: 12.5px; text-decoration: underline;
    cursor: pointer; font-family: inherit; }
</style>
</head>
<body>

<div id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="login-title">💧 Potrošnja vode</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username" />
    </div>
    <div class="login-field">
      <label>Lozinka</label>
      <input type="password" id="loginPassword" autocomplete="current-password" />
    </div>
    <button class="login-btn" id="loginBtn">Prijavi se</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appRoot" style="display:none">

  Object.entries(months || {}).forEach(([k, v]) => {
    if (MONTHS.includes(k)) {
      result[`${START_YEAR}-${k}`] = v;
      changed = true;
    } else {
      result[k] = v;
    }
  });
  return { result, changed };
}

const DEFAULT_METERS = [
  { key: "glavni", label: "Glavni (4123315)", color: "#2F6690", isMain: true },
  { key: "stan3", label: "Stan 3 (4123305)", color: "#5E8B7E", isMain: false },
  { key: "stan4", label: "Stan 4 (4123011)", color: "#B8895E", isMain: false },
];

const DEFAULT_RATES = {
  vodaFiksno: 1.187, kanalizacijaFiksno: 0.081, vodaVarijabilno: 0.918,
  precisavanje: 0.183, kanalizacijaVarijabilno: 0.064, porez: 7, currency: "€",
};

const RATE_FIELDS = [
  { key: "vodaFiksno", label: "Voda fiksno" },
  { key: "kanalizacijaFiksno", label: "Kanalizacija fiksno" },
  { key: "vodaVarijabilno", label: "Voda varijabilno" },
  { key: "precisavanje", label: "Prečišćavanje" },
  { key: "kanalizacijaVarijabilno", label: "Kanalizacija varijabilno" },
];

const INITIAL_MONTHS = {
  Januar: { glavni: { pocetno: 75, krajnje: 89 }, stan3: { pocetno: 0, krajnje: 2 } },
  Februar: { glavni: { pocetno: 89, krajnje: 107 }, stan3: { pocetno: 2, krajnje: 7 } },
  Mart: { glavni: { pocetno: 107, krajnje: 126 }, stan3: { pocetno: 7, krajnje: 15 } },
  April: { glavni: { pocetno: 126, krajnje: 151 }, stan3: { pocetno: 15, krajnje: 25 } },
  Maj: { glavni: { pocetno: 151, krajnje: 174 }, stan3: { pocetno: 25, krajnje: 33 } },
  Jun: { glavni: { pocetno: 174, krajnje: 189 }, stan3: { pocetno: 33, krajnje: 40 } },
};

let state = { rates: { ...DEFAULT_RATES }, meters: DEFAULT_METERS.map(m => ({...m})), months: {} };
let loaded = false;
let tab = "unos";
let monthIdx = new Date().getMonth();
let overviewYear = START_YEAR + Math.floor(monthIdx / 12);
let saveTimer = null;

function n(v) {
  if (typeof v === "string") v = v.replace(",", ".");
  const x = parseFloat(v);
  return isNaN(x) ? 0 : x;
}
function fmt(v, decimals = 2) { return n(v).toLocaleString("sr-RS", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }

function buildEffectiveMonths(months, meters, count) {
  const effective = {};
  const lastKrajnje = {};
  meters.forEach((m) => (lastKrajnje[m.key] = 0));
  for (let i = 0; i < count; i++) {
    const info = periodInfo(i);
    const raw = months[info.key] || {};
    const monthEff = {};
    meters.forEach((m) => {
      const rawPocetno = raw[m.key]?.pocetno;
      const rawKrajnje = raw[m.key]?.krajnje;
      const hasPocetno = rawPocetno !== undefined && rawPocetno !== "";
      const hasKrajnje = rawKrajnje !== undefined && rawKrajnje !== "";
      const effPocetno = hasPocetno ? n(rawPocetno) : lastKrajnje[m.key];
      const effKrajnje = hasKrajnje ? n(rawKrajnje) : effPocetno;
      monthEff[m.key] = { pocetno: effPocetno, krajnje: effKrajnje };
      lastKrajnje[m.key] = effKrajnje;
    });
    effective[info.key] = monthEff;
  }
  return effective;
}

function computeMonth(monthData, meters, rates) {
  const variableRate = n(rates.vodaVarijabilno) + n(rates.precisavanje) + n(rates.kanalizacijaVarijabilno);
  const fixedRate = n(rates.vodaFiksno) + n(rates.kanalizacijaFiksno);
  const porez = n(rates.porez);
  const consumption = {};
  meters.forEach((m) => {
    const md = monthData?.[m.key] || { pocetno: 0, krajnje: 0 };
    consumption[m.key] = n(md.krajnje) - n(md.pocetno);
  });
  const main = meters.find((m) => m.isMain);
  // The main meter already contains the sub-meters' consumption (they measure a portion of the
  // same flow), so the fixed cost must be split against the main meter's reading alone —
  // summing all meters would double-count and understate everyone's fixed share.
  const mainConsumption = main ? consumption[main.key] : meters.reduce((s, m) => s + consumption[m.key], 0);
  const results = {};
  meters.forEach((m) => {
    const c = consumption[m.key];
    const variableCost = c * variableRate;
    const fixedShare = mainConsumption === 0 ? 0 : (c / mainConsumption) * fixedRate;
    const tax = (variableCost + fixedShare) * (porez / 100);
    const total = (variableCost + fixedShare) * (1 + porez / 100);
    results[m.key] = { consumption: c, variableCost, fixedShare, tax, total };
  });
  let diff = null;
  if (main) {
    const others = meters.filter((m) => !m.isMain);
    diff = results[main.key].total - others.reduce((s, m) => s + results[m.key].total, 0);
  }
  return { results, diff, totalConsumption: mainConsumption };
}

function scheduleSave() {
  clearTimeout(saveTimer);
  const statusEl = document.getElementById("status");
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(docRef, state);
      statusEl.textContent = "Sačuvano";
      statusEl.className = "status ok";
      setTimeout(() => { if (statusEl.textContent === "Sačuvano") { statusEl.textContent = ""; } }, 1500);
    } catch (e) {
      statusEl.textContent = "Čuvanje nije uspjelo. Provjeri internet konekciju.";
      statusEl.className = "status err";
    }
  }, 400);
}

function svgIcon(name, color) {
  if (name === "left") return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>`;
  if (name === "right") return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>`;
}

function renderUnos() {
  const info = periodInfo(monthIdx);
  const count = Math.max(monthIdx, maxStoredIndex()) + 1;
  const effectiveMonths = buildEffectiveMonths(state.months, state.meters, count);
  const computed = computeMonth(effectiveMonths[info.key], state.meters, state.rates);
  const monthData = state.months[info.key] || {};

  let html = `
    <div class="month-nav">
      <button class="nav-btn" id="prevMonth" ${monthIdx === 0 ? "disabled" : ""}>${svgIcon("left", monthIdx === 0 ? "#D6D1C6" : "#1B3A4B")}</button>
      <div class="period-selects">
        <select class="period-select" id="monthSelect">
          ${MONTHS.map((mn, i) => `<option value="${i}" ${i === monthIdx % 12 ? "selected" : ""}>${mn}</option>`).join("")}
        </select>
        <select class="period-select" id="yearSelect">
          ${yearOptions().map((y) => `<option value="${y}" ${y === info.year ? "selected" : ""}>${y}.</option>`).join("")}
        </select>
      </div>
      <button class="nav-btn" id="nextMonth">${svgIcon("right", "#1B3A4B")}</button>
    </div>
  `;

  state.meters.forEach((m) => {
    const r = computed.results[m.key];
    const md = monthData[m.key] || {};
    const fallback = monthIdx === 0 ? null : effectiveMonths[periodInfo(monthIdx - 1).key]?.[m.key]?.krajnje ?? null;
    html += `
      <div class="card meter-card" style="border-left:4px solid ${m.color}">
        <div class="meter-head">
          <span class="meter-name">${m.label}</span>
          <span class="meter-consumption" style="color:${m.color}">${fmt(r.consumption, 1)} m³</span>
        </div>
        <div class="fields">
          <div class="field">
            <label>Prethodno stanje</label>
            <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" data-meter="${m.key}" data-field="pocetno" value="${md.pocetno ?? ""}" placeholder="${fallback !== null ? fallback : "0"}" />
          </div>
          <div class="field">
            <label>Trenutno stanje</label>
            <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" data-meter="${m.key}" data-field="krajnje" value="${md.krajnje ?? ""}" placeholder="0" />
          </div>
        </div>
        <div class="costs-row">
          <span>Varijabilni: ${fmt(r.variableCost)} ${state.rates.currency}</span>
          <span>Fiksni dio: ${fmt(r.fixedShare)} ${state.rates.currency}</span>
        </div>
        <div class="total-row"><span>Ukupno</span><span>${fmt(r.total)} ${state.rates.currency}</span></div>
        ${m.isMain ? `<div class="diff-row">Razlika (glavno − podbrojila): <strong class="${computed.diff < 0 ? "neg" : "pos"}">${fmt(computed.diff)} ${state.rates.currency}</strong></div>` : ""}
      </div>
    `;
  });

  document.getElementById("content").innerHTML = html;

  document.getElementById("prevMonth").onclick = () => { if (monthIdx > 0) { monthIdx--; render(); } };
  document.getElementById("nextMonth").onclick = () => { monthIdx++; render(); };
  document.getElementById("monthSelect").onchange = (e) => {
    const mi = parseInt(e.target.value, 10);
    const year = periodInfo(monthIdx).year;
    monthIdx = Math.max(0, (year - START_YEAR) * 12 + mi);
    render();
  };
  document.getElementById("yearSelect").onchange = (e) => {
    const year = parseInt(e.target.value, 10);
    const mi = ((monthIdx % 12) + 12) % 12;
    monthIdx = Math.max(0, (year - START_YEAR) * 12 + mi);
    render();
  };
  document.querySelectorAll("input[data-meter]").forEach((inp) => {
    inp.addEventListener("input", (e) => {
      updateReadingKeepFocus(info.key, e.target.dataset.meter, e.target.dataset.field, e.target.value);
    });
  });
}

function updateReadingKeepFocus(periodKey, meterKey, field, value) {
  if (!state.months[periodKey]) state.months[periodKey] = {};
  if (!state.months[periodKey][meterKey]) state.months[periodKey][meterKey] = {};
  state.months[periodKey][meterKey][field] = value;
  scheduleSave();
  render();
}

function renderGodisnje() {
  const yearStartIdx = (overviewYear - START_YEAR) * 12;
  const count = Math.max(yearStartIdx + 11, monthIdx, maxStoredIndex()) + 1;
  const effectiveMonths = buildEffectiveMonths(state.months, state.meters, count);

  const totals = {};
  state.meters.forEach((m) => (totals[m.key] = { consumption: 0, total: 0 }));
  const chartRows = [];
  for (let i = yearStartIdx; i < yearStartIdx + 12; i++) {
    const info = periodInfo(i);
    const c = computeMonth(effectiveMonths[info.key], state.meters, state.rates);
    state.meters.forEach((m) => {
      totals[m.key].consumption += c.results[m.key].consumption;
      totals[m.key].total += c.results[m.key].total;
    });
    const row = { month: info.month.slice(0, 3) };
    state.meters.forEach((m) => (row[m.key] = c.results[m.key].consumption));
    chartRows.push(row);
  }

  let html = `
    <div class="month-nav">
      <button class="nav-btn" id="prevYear" ${overviewYear <= START_YEAR ? "disabled" : ""}>${svgIcon("left", overviewYear <= START_YEAR ? "#D6D1C6" : "#1B3A4B")}</button>
      <select class="period-select" id="yearSelectOverview">
        ${yearOptions().map((y) => `<option value="${y}" ${y === overviewYear ? "selected" : ""}>${y}.</option>`).join("")}
      </select>
      <button class="nav-btn" id="nextYear">${svgIcon("right", "#1B3A4B")}</button>
    </div>
  `;
  html += `<div class="card overview-card"><div class="overview-title">Potrošnja po mjesecima (m³)</div><div id="chart"></div></div>`;
  html += `<div class="card"><div class="overview-title">Godišnji zbir</div>`;
  state.meters.forEach((m) => {
    html += `
      <div class="legend-row">
        <div class="legend-left"><span class="dot" style="background:${m.color}"></span><span class="legend-name">${m.label}</span></div>
        <div>
          <div class="legend-total">${fmt(totals[m.key].total)} ${state.rates.currency}</div>
          <div class="legend-sub">${fmt(totals[m.key].consumption, 1)} m³</div>
        </div>
      </div>
    `;
  });
  html += `</div>`;

  document.getElementById("content").innerHTML = html;
  drawChart(chartRows);

  document.getElementById("prevYear").onclick = () => { if (overviewYear > START_YEAR) { overviewYear--; render(); } };
  document.getElementById("nextYear").onclick = () => { overviewYear++; render(); };
  document.getElementById("yearSelectOverview").onchange = (e) => { overviewYear = parseInt(e.target.value, 10); render(); };
}

function drawChart(rows) {
  const el = document.getElementById("chart");
  const w = el.clientWidth || 400, h = 180, pad = 28;
  const maxVal = Math.max(1, ...rows.flatMap((r) => state.meters.map((m) => r[m.key])));
  const stepX = (w - pad * 2) / (rows.length - 1);
  const scaleY = (v) => h - pad - (v / maxVal) * (h - pad * 1.5);

  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  // grid
  for (let i = 0; i <= 3; i++) {
    const y = pad * 0.5 + i * ((h - pad * 1.5) / 3);
    svg += `<line x1="${pad}" y1="${y}" x2="${w - 8}" y2="${y}" stroke="#F0EDE5" stroke-width="1"/>`;
  }
  // lines
  state.meters.forEach((m) => {
    let points = rows.map((r, i) => `${pad + i * stepX},${scaleY(r[m.key])}`).join(" ");
    svg += `<polyline points="${points}" fill="none" stroke="${m.color}" stroke-width="2"/>`;
    rows.forEach((r, i) => {
      svg += `<circle cx="${pad + i * stepX}" cy="${scaleY(r[m.key])}" r="2" fill="${m.color}"/>`;
    });
  });
  // month labels (every other month to avoid crowding)
  rows.forEach((r, i) => {
    if (i % 2 === 0) {
      svg += `<text x="${pad + i * stepX}" y="${h - 6}" font-size="9" fill="#8A8578" text-anchor="middle">${r.month}</text>`;
    }
  });
  svg += `</svg>`;
  el.innerHTML = svg;
}

function render() {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));

  const active = document.activeElement;
  let focusInfo = null;
  if (active && active.tagName === "INPUT" && active.dataset && active.dataset.meter) {
    focusInfo = {
      meter: active.dataset.meter,
      field: active.dataset.field,
      selStart: active.selectionStart,
    };
  }

  if (tab === "unos") renderUnos();
  else renderGodisnje();

  if (focusInfo) {
    const restored = document.querySelector(`input[data-meter="${focusInfo.meter}"][data-field="${focusInfo.field}"]`);
    if (restored) {
      restored.focus({ preventScroll: true });
      try { restored.setSelectionRange(focusInfo.selStart, focusInfo.selStart); } catch (e) {}
    }
  }
}

document.querySelectorAll(".tab").forEach((t) => {
  t.addEventListener("click", () => { tab = t.dataset.tab; render(); });
});

window.addEventListener("resize", () => {
  if (loaded && tab === "godisnje") render();
});

// Settings modal
const modalOverlay = document.getElementById("modalOverlay");
document.getElementById("settingsBtn").onclick = () => openSettings();
document.getElementById("closeModal").onclick = () => modalOverlay.classList.remove("open");
modalOverlay.onclick = (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove("open"); };

function openSettings() {
  const rateFieldsEl = document.getElementById("rateFields");
  rateFieldsEl.innerHTML = RATE_FIELDS.map((f) => `
    <div class="rate-row">
      <label>${f.label}</label>
      <input type="number" step="0.001" id="rate_${f.key}" value="${state.rates[f.key]}" />
    </div>
  `).join("");
  document.getElementById("rate_porez").value = state.rates.porez;
  document.getElementById("rate_currency").value = state.rates.currency;

  const meterLabelsEl = document.getElementById("meterLabels");
  meterLabelsEl.innerHTML = state.meters.map((m) => `
    <input class="label-input" data-meterkey="${m.key}" type="text" value="${m.label}" />
  `).join("");

  modalOverlay.classList.add("open");
}

document.getElementById("saveSettings").onclick = () => {
  RATE_FIELDS.forEach((f) => {
    state.rates[f.key] = document.getElementById(`rate_${f.key}`).value;
  });
  state.rates.porez = document.getElementById("rate_porez").value;
  state.rates.currency = document.getElementById("rate_currency").value;

  document.querySelectorAll("#meterLabels input[data-meterkey]").forEach((inp) => {
    const m = state.meters.find((m) => m.key === inp.dataset.meterkey);
    if (m) m.label = inp.value;
  });

  scheduleSave();
  modalOverlay.classList.remove("open");
  render();
};

// Firestore realtime sync — only starts once the user is signed in
const statusEl = document.getElementById("status");
let firstSnapshot = true;
let unsubscribeSnapshot = null;

function startApp() {
  if (unsubscribeSnapshot) return; // already running
  unsubscribeSnapshot = onSnapshot(docRef, (snap) => {
    if (snap.exists()) {
      const data = snap.data();
      const incomingRates = { ...DEFAULT_RATES, ...(data.rates || {}) };
      const incomingMeters = data.meters && data.meters.length ? data.meters : DEFAULT_METERS.map(m => ({...m}));
      const { result: incomingMonths, changed } = migrateLegacyMonths(data.months || {});

      if (loaded) {
        const currentStr = JSON.stringify({ rates: state.rates, meters: state.meters, months: state.months });
        const incomingStr = JSON.stringify({ rates: incomingRates, meters: incomingMeters, months: incomingMonths });
        if (currentStr === incomingStr) {
          firstSnapshot = false;
          return;
        }
      }

      state.rates = incomingRates;
      state.meters = incomingMeters;
      state.months = incomingMonths;
      if (changed) setDoc(docRef, state).catch(() => {});
    } else if (firstSnapshot) {
      const seeded = {};
      Object.entries(INITIAL_MONTHS).forEach(([monthName, val]) => { seeded[`${START_YEAR}-${monthName}`] = val; });
      state.months = seeded;
      setDoc(docRef, state).catch(() => {});
    }
    firstSnapshot = false;
    loaded = true;
    statusEl.textContent = "";
    render();
  }, (err) => {
    statusEl.textContent = "Greška pri povezivanju s bazom.";
    statusEl.className = "status err";
  });
}

// Auth UI wiring
const loginScreen = document.getElementById("loginScreen");
const appRoot = document.getElementById("appRoot");
const loginError = document.getElementById("loginError");

function doLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  loginError.textContent = "";
  if (!email || !password) {
    loginError.textContent = "Unesi email i lozinku.";
    return;
  }
  signInWithEmailAndPassword(auth, email, password).catch((err) => {
    loginError.textContent = "Pogrešan email ili lozinka.";
  });
}

document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("loginPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
document.getElementById("logoutBtn").addEventListener("click", () => { signOut(auth); });
if (!AUTH_ENABLED) document.getElementById("logoutBtn").style.display = "none";

onAuthStateChanged(auth, (user) => {
  if (!AUTH_ENABLED || user) {
    loginScreen.style.display = "none";
    appRoot.style.display = "flex";
    startApp();
  } else {
    appRoot.style.display = "none";
    loginScreen.style.display = "flex";
  }
});
