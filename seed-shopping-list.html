<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<title>Jednokratno prebacivanje liste</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body { font-family: sans-serif; background: #F5F3EE; color: #0F222B; max-width: 440px; margin: 60px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  input { display: block; width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
  button { padding: 10px 16px; background: #007991; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #status { margin-top: 16px; font-size: 14px; }
  .ok { color: #1F7A52; }
  .err { color: #B0524A; }
</style>
</head>
<body>
<h1>Jednokratno prebacivanje shopping liste na family-hub-m</h1>
<p>Uloguj se sa svojim (roditeljskim) nalogom na novom projektu. Ovo se pokreće samo jednom.</p>
<input type="email" id="email" placeholder="Email" autocomplete="username" />
<input type="password" id="password" placeholder="Lozinka" autocomplete="current-password" />
<button onclick="runSeed()">Prebaci listu</button>
<div id="status"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAK9h4XR4ozUsOvkqaVNOnn9PS5XOBizAg",
  authDomain: "family-hub-m.firebaseapp.com",
  projectId: "family-hub-m",
  storageBucket: "family-hub-m.firebasestorage.app",
  messagingSenderId: "267839729754",
  appId: "1:267839729754:web:04625e020a8dcd2e0e6863"
};
firebase.initializeApp(firebaseConfig);

const ITEMS = [
  { id: "1", name: "Burata", quantity: 1, store: "Lidl", category: "Food & Groceries", price: 1.69, note: "", purchased: false, order: 0 },
  { id: "2", name: "Limeta", quantity: 1, store: "Kaufland", category: "Food & Groceries", price: 0, note: "", purchased: false, order: 1 },
  { id: "3", name: "Meso", quantity: 1, store: "Voli", category: "Food & Groceries", price: 0, note: "", purchased: false, order: 2 },
  { id: "4", name: "Hljeb", quantity: 1, store: "", category: "Food & Groceries", price: 0, note: "", purchased: false, order: 3 },
  { id: "5", name: "Chili flakes", quantity: 1, store: "", category: "", price: 0, note: "", purchased: false, order: 4 },
  { id: "6", name: "Chicken/Turkey", quantity: 1, store: "Lidl", category: "Food & Groceries", price: 4.5, note: "", purchased: true, order: 5 },
  { id: "7", name: "Cedevita narandža", quantity: 1, store: "Kaufland", category: "Drinks", price: 0, note: "", purchased: true, order: 6 },
  { id: "8", name: "Pizza Šunka", quantity: 1, store: "Voli", category: "Food & Groceries", price: 0, note: "", purchased: true, order: 7 },
  { id: "9", name: "Tortilja", quantity: 1, store: "Voli", category: "Food & Groceries", price: 0, note: "", purchased: true, order: 8 },
  { id: "10", name: "Pašta", quantity: 1, store: "Voli", category: "Food & Groceries", price: 0, note: "", purchased: true, order: 9 },
  { id: "11", name: "Jaja", quantity: 1, store: "Alkoset", category: "Food & Groceries", price: 0, note: "", purchased: true, order: 10 },
];
const FAVORITES = ["Mlijeko", "Hljeb", "Jaja", "Jogurt", "Kafa"];

function setStatus(msg, cls) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls || "";
}

function runSeed() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) {
    setStatus("Unesi email i lozinku.", "err");
    return;
  }
  setStatus("Prijavljivanje...");
  firebase.auth().signInWithEmailAndPassword(email, password)
    .then(() => {
      setStatus("Prebacujem listu...");
      return firebase.firestore().collection("shopping-list").doc("shared").set({
        items: JSON.stringify(ITEMS),
        favorites: JSON.stringify(FAVORITES),
        budget: JSON.stringify(null),
      });
    })
    .then(() => {
      setStatus("Gotovo! Lista je prebačena. Ovu stranicu možeš sad zatvoriti i obrisati.", "ok");
    })
    .catch((err) => {
      setStatus("Greška: " + err.message, "err");
    });
}
</script>
</body>
</html>
